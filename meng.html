                { incoming: 'A wreath of fresh raspberries dusted with genuine 24-karat edible gold leaf looks breathtaking.', taskRu: 'Пожалуйста, нанесите поздравительную надпись белым шоколадом красивым курсивным шрифтом.', hintSkeleton: 'Please pipe the celebratory inscription in white chocolate using elegant cursive script.', variants: ['Please pipe the celebratory inscription in white chocolate using elegant cursive script.', 'Can the lettering "Happy Birthday Max!" be piped in white chocolate cursive on a sugar plaque?', 'Please hand-pipe the birthday message in flowing white chocolate script across the top.'] },
                { incoming: 'Should we bake a tall 4-layer 8-inch cake, or a wider 10-inch single tier?', taskRu: 'Высокий восьмидюймовый торт из четырех слоев позволит нарезать шестнадцать порций?', hintSkeleton: 'Will a tall 8-inch cake with four sponge layers yield sixteen generous party slices?', variants: ['Will a tall 8-inch cake with four sponge layers yield sixteen generous party slices?', 'Does a tall four-layer 8-inch round cake provide 15 to 16 good-sized portions?', 'Is an 8-inch tall cake with 4 internal layers sufficient to serve 15 hungry guests?'] },
                { incoming: 'A tall 8-inch cake provides 16 to 18 generous dessert portions when cut in grid style.', taskRu: 'Предоставляете ли вы набор тонких металлических свечей и декоративный топпер?', hintSkeleton: 'Do you provide a set of slender metallic candles and an acrylic custom cake topper?', variants: ['Do you provide a set of slender metallic candles and an acrylic custom cake topper?', 'Does the cake order come with tall metallic gold candles and a birthday topper?', 'Are thin gold birthday candles and a customized acrylic topper included or available as add-ons?'] },
                { incoming: 'We include sixteen slender gold metallic candles and a custom laser-cut gold topper free of charge.', taskRu: 'Каковы точные условия хранения торта до момента подачи на праздничный стол?', hintSkeleton: 'What are the exact storage instructions for the cake prior to serving at the party?', variants: ['What are the exact storage instructions for the cake prior to serving at the party?', 'How should the cake be kept before cutting: does it need continuous refrigeration?', 'What temperature conditions are recommended to store the cake before the celebration?'] },
                { incoming: 'Keep refrigerated, but take it out exactly 90 minutes before cutting so the ganache softens.', taskRu: 'За полтора часа масляный крем и шоколадная начинка успеют согреться до комнатной температуры.', hintSkeleton: 'In an hour and a half, the buttercream and chocolate filling will warm to room temperature.', variants: ['In an hour and a half, the buttercream and chocolate filling will warm to room temperature.', 'Taking it out 90 minutes prior will allow the butter and ganache to reach ideal eating temperature.', 'An hour and a half on the counter will soften the cake crumb and frosting perfectly.'] },
                { incoming: 'Room temperature brings out the full flavor bouquet of the almond sponge. How about delivery?', taskRu: 'Можете ли вы доставить торт в специальном автомобиле-рефрижераторе прямо в ресторан?', hintSkeleton: 'Can you deliver the cake in a specialized refrigerated van directly to the restaurant venue?', variants: ['Can you deliver the cake in a specialized refrigerated van directly to the restaurant venue?', 'Do you provide climate-controlled delivery van service straight to our banquet hall?', 'Is refrigerated courier delivery available so the cake arrives chilled at the venue?'] },
                { incoming: 'We deliver in custom temperature-controlled vans with anti-vibration suspension. What is the venue address?', taskRu: 'Ресторан Белла Виста на Оушен Драйв, доставка нужна в субботу к пяти часам вечера.', hintSkeleton: 'Bella Vista Restaurant on Ocean Drive, delivery is needed on Saturday by five pm.', variants: ['Bella Vista Restaurant on Ocean Drive, delivery is needed on Saturday by five pm.', 'The venue is Bella Vista at 42 Ocean Drive, please deliver on Saturday around 5:00 pm.', 'It is at Bella Vista Restaurant on Ocean Drive, arrival window between 4:30 and 5:00 pm on Saturday.'] },
                { incoming: 'Our refrigerated courier will hand the cake directly to the restaurant head chef at 5 pm.', taskRu: 'Какой процент предоплаты требуется внести сегодня для подтверждения бронирования даты?', hintSkeleton: 'What deposit percentage is required today to confirm and lock in the baking schedule?', variants: ['What deposit percentage is required today to confirm and lock in the baking schedule?', 'How much down payment do I need to transfer right now to secure the Saturday booking?', 'What is the required upfront deposit to finalize the custom pastry order?'] },
                { incoming: 'A 50% deposit secures the date, with the remainder payable upon restaurant delivery on Saturday.', taskRu: 'Какова общая стоимость торта с учетом индивидуального декора, свечей и доставки?', hintSkeleton: 'What is the total price of the cake including custom decor, candles, and delivery?', variants: ['What is the total price of the cake including custom decor, candles, and delivery?', 'How much is the complete total with the Callebaut chocolate, gold leaf, and courier fee?', 'What is the final invoice amount including the bespoke design and refrigerated transport?'] },
                { incoming: 'Total invoice is $160 all inclusive: bespoke cake, 24k gold, topper, candles, and delivery.', taskRu: 'Я только что перевел депозит в размере восьмидесяти долларов по вашим банковским реквизитам.', hintSkeleton: 'I have just transferred the eighty-dollar deposit to your business bank details.', variants: ['I have just transferred the eighty-dollar deposit to your business bank details.', 'I sent the $80 deposit via instant online banking transfer to your company account.', 'Done, eighty dollars deposit has been transferred to your banking details.'] },
                { incoming: 'Deposit confirmed! I will send you behind-the-scenes progress photos during baking on Friday.', taskRu: 'Это было бы замечательно, буду с нетерпением ждать фотографий процесса выпечки!', hintSkeleton: 'That would be wonderful, I will look forward to the baking progress photos!', variants: ['That would be wonderful, I will look forward to the baking progress photos!', 'That\'s such a lovely touch Claire! We would love to see the cake taking shape.', 'Fantastic, looking forward to seeing the kitchen photos on Friday afternoon!'] },
                { incoming: 'It is going to be a showstopper centerpiece for Max\'s birthday celebration!', taskRu: 'Спасибо вам огромное за заботу о здоровье гостей и кулинарный талант, Клэр!', hintSkeleton: 'Thank you so much for taking care of our guests\' health and for your culinary talent, Claire!', variants: ['Thank you so much for taking care of our guests\' health and for your culinary talent, Claire!', 'Thanks a million Claire, we really appreciate your meticulous allergy care and artistry!', 'Thank you Claire, your dedication to safe allergen-free pastry is truly appreciated!'] },
                { incoming: 'Creating safe, delicious memories is my true passion. Have a magical birthday party on Saturday!', taskRu: 'Обязательно напишу вам отзыв после праздника. До субботы, хороших вам заказов!', hintSkeleton: 'I will definitely leave you a review after the party. See you Saturday, have a great week of baking!', variants: ['I will definitely leave you a review after the party. See you Saturday, have a great week of baking!', 'I\'ll be sure to send feedback and photos of the cake cutting. Have a wonderful week Claire!', 'We\'ll share rave reviews on Instagram for sure! Thanks again Claire, take care!'] }
            ]}
        ];

        // Merge all 30 scenarios into one array
        EXTRA_SCENARIOS_20.forEach(sc => SCENARIOS.push(sc));

        // ENGINE STATE
        let activeScenarioIndex = 0;
        let currentStepIndex = 0;

        function speakWord(word, el) {
            if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
            document.querySelectorAll('.word').forEach(w => w.classList.remove('speaking'));
            if (el) el.classList.add('speaking');
            const clean = word.replace(/[^a-zA-Z']/g, '');
            
            if (typeof TMABridge !== 'undefined' && TMABridge.speak) {
                TMABridge.speak(clean, 0.85, () => {
                    if (el) el.classList.remove('speaking');
                });
            }
        }

        function playPhrase(text) {
            if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
            if (typeof TMABridge !== 'undefined' && TMABridge.speak) {
                TMABridge.speak(text, 0.9);
            }
        }

        function normalize(str) {
            return str.toLowerCase()
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?'"]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function loadScenario(idx) {
            // Freemium Paywall: Scenarios 0 and 1 are free. Scenarios 2..29 are premium.
            if (idx >= 2 && typeof TMABridge !== 'undefined') {
                if (!TMABridge.checkDemoLimit(idx, 2)) {
                    return; // Блокируем загрузку и показываем окно оплаты
                }
            }

            activeScenarioIndex = idx;
            currentStepIndex = 0;
            const sc = SCENARIOS[idx];

            document.getElementById('contactAvatar').innerText = sc.avatar;
            document.getElementById('contactName').innerText = sc.name;

            document.getElementById('chatStream').innerHTML = `
                <div class="typing-indicator" id="typingIndicator">
                    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                </div>
            `;

            closeDrawer();
            showIncomingStep();
        }

        function showIncomingStep() {
            const sc = SCENARIOS[activeScenarioIndex];
            const stepData = sc.steps[currentStepIndex];

            document.getElementById('progressPill').innerText = `Шаг ${currentStepIndex + 1} из ${sc.steps.length}`;
            document.getElementById('taskRu').innerText = stepData.taskRu;
            document.getElementById('skeletonHint').innerText = stepData.hintSkeleton;
            document.getElementById('skeletonHint').style.display = 'none';

            const indicator = document.getElementById('typingIndicator');
            indicator.style.display = 'flex';
            scrollChat();

            setTimeout(() => {
                indicator.style.display = 'none';
                appendIncomingMessage(stepData.incoming);
                playPhrase(stepData.incoming);
                scrollChat();
            }, 1000);
        }

        function appendIncomingMessage(text) {
            const stream = document.getElementById('chatStream');
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble msg-incoming';
            const wordsHtml = text.split(' ').map(w => `<span class="word" onclick="speakWord('${w}', this)">${w}</span>`).join(' ');
            const safeText = encodeURIComponent(text);

            bubble.innerHTML = `
                <div class="msg-top-row">
                    <button class="audio-btn" onclick="playPhrase('${text.replace(/'/g, "\\'")}')">🔊</button>
                    <div>${wordsHtml}</div>
                </div>
                <div class="msg-trans-dock" style="margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 4px;">
                    <button class="trans-btn" data-text="${safeText}" onclick="translateMessage(this)" style="background: none; border: none; color: var(--text-muted); font-size: 0.72rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 2px 0;">
                        🌐 Перевести
                    </button>
                    <div class="trans-text" style="display: none; font-size: 0.82rem; color: #93c5fd; margin-top: 4px; line-height: 1.35; padding-left: 2px;"></div>
                </div>
            `;
            const indicator = document.getElementById('typingIndicator');
            stream.insertBefore(bubble, indicator);
        }

        function appendOutgoingMessage(text) {
            const stream = document.getElementById('chatStream');
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble msg-outgoing';
            const wordsHtml = text.split(' ').map(w => `<span class="word" onclick="speakWord('${w}', this)">${w}</span>`).join(' ');
            bubble.innerHTML = `
                <div class="msg-top-row">
                    <button class="audio-btn" onclick="playPhrase('${text.replace(/'/g, "\\'")}')">🔊</button>
                    <div>${wordsHtml}</div>
                </div>
            `;
            const indicator = document.getElementById('typingIndicator');
            stream.insertBefore(bubble, indicator);
        }

        function scrollChat() {
            const stream = document.getElementById('chatStream');
            stream.scrollTop = stream.scrollHeight;
        }

        function toggleSkeletonHint() {
            if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
            const h = document.getElementById('skeletonHint');
            h.style.display = (h.style.display === 'none' || !h.style.display) ? 'block' : 'none';
        }

        function handleSend() {
            const input = document.getElementById('chatInput');
            const userText = input.value.trim();
            if (!userText) return;

            const sc = SCENARIOS[activeScenarioIndex];
            const stepData = sc.steps[currentStepIndex];
            const normUser = normalize(userText);

            const isMatch = stepData.variants.some(v => normalize(v) === normUser);

            if (isMatch) {
                if (typeof TMABridge !== 'undefined') TMABridge.haptic('medium');
                appendOutgoingMessage(userText);
                input.value = '';
                scrollChat();

                if (currentStepIndex < sc.steps.length - 1) {
                    currentStepIndex++;
                    setTimeout(showIncomingStep, 1000);
                } else {
                    if (typeof TMABridge !== 'undefined') TMABridge.haptic('heavy');
                    setTimeout(() => {
                        alert('🎉 Отлично! Вы успешно завершили эту жизненную переписку!');
                    }, 800);
                }
            } else {
                if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
                showVariantsModal(stepData.variants, stepData.exp);
            }
        }

        function showVariantsModal(variants, exp) {
            const list = document.getElementById('variantsList');
            list.innerHTML = '';

            variants.forEach(v => {
                const item = document.createElement('div');
                item.className = 'variant-item';
                item.innerHTML = `
                    <span style="flex:1;line-height:1.3;">${v}</span>
                    <button style="background:none;border:none;color:#60a5fa;font-size:0.75rem;font-weight:700;cursor:pointer;white-space:nowrap;margin-left:8px;">Вставить ✍️</button>
                `;
                item.onclick = () => {
                    if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
                    document.getElementById('chatInput').value = v;
                    closeVariantsModal();
                    document.getElementById('chatInput').focus();
                };
                list.appendChild(item);
            });

            document.getElementById('modalExp').innerHTML = `<b>Разбор:</b> ${exp}`;
            document.getElementById('variantsModal').style.display = 'flex';
        }

        function closeVariantsModal() {
            document.getElementById('variantsModal').style.display = 'none';
        }

        // КЭШ И ОНЛАЙН-ПЕРЕВОДЧИК СООБЩЕНИЙ (Вариант 1 + Вариант 3)
        let translationCache = {};
        try {
            translationCache = JSON.parse(localStorage.getItem('meng_trans_cache') || '{}');
        } catch (e) {
            translationCache = {};
        }

        async function translateMessage(btn) {
            if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
            
            const originalText = decodeURIComponent(btn.dataset.text || '').trim();
            if (!originalText) return;

            const container = btn.nextElementSibling;

            // Если перевод уже открыт — сворачиваем его
            if (container.style.display === 'block') {
                container.style.display = 'none';
                btn.innerHTML = '🌐 Перевести';
                return;
            }

            // 1. Проверяем кэш памяти и LocalStorage (мгновенный отклик 0 мс)
            if (translationCache[originalText]) {
                container.innerText = translationCache[originalText];
                container.style.display = 'block';
                btn.innerHTML = '🌐 Скрыть перевод';
                return;
            }

            // 2. Скачиваем перевод на лету через бесплатный шлюз Google
            btn.innerHTML = '⏳ Перевожу...';

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(originalText)}`;
                const res = await fetch(url);
                const data = await res.json();
                
                // Собираем переведенные предложения воедино
                const ruTranslation = data[0].map(item => item[0]).join('');

                // Сохраняем в кэш
                translationCache[originalText] = ruTranslation;
                try {
                    localStorage.setItem('meng_trans_cache', JSON.stringify(translationCache));
                } catch (e) {}

                container.innerText = ruTranslation;
                container.style.display = 'block';
                btn.innerHTML = '🌐 Скрыть перевод';
            } catch (err) {
                console.warn("Translation error:", err);
                btn.innerHTML = '⚠️ Ошибка перевода';
                setTimeout(() => { btn.innerHTML = '🌐 Перевести'; }, 2000);
            }
        }

        // DRAWER CONTROLLER
        function openDrawer() {
            if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
            renderDrawerList();
            document.getElementById('drawerModal').style.display = 'flex';
        }

        function closeDrawer() {
            document.getElementById('drawerModal').style.display = 'none';
        }

        function renderDrawerList() {
            const list = document.getElementById('drawerList');
            list.innerHTML = '';

            SCENARIOS.forEach((sc, idx) => {
                const isLocked = idx >= 2 && (!TMABridge || !TMABridge.isPremiumUser());
                const item = document.createElement('div');
                item.className = `drawer-item ${idx === activeScenarioIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="drawer-item-avatar">${sc.avatar}</div>
                    <div class="drawer-item-content">
                        <div class="drawer-item-title">${sc.title} ${isLocked ? '🔒' : ''}</div>
                        <div class="drawer-item-desc">${sc.desc}</div>
                    </div>
                `;
                item.onclick = () => {
                    if (idx >= 2 && typeof TMABridge !== 'undefined') {
                        if (!TMABridge.checkDemoLimit(idx, 2)) {
                            closeDrawer();
                            return;
                        }
                    }
                    loadScenario(idx);
                };
                list.appendChild(item);
            });
        }

        document.getElementById('chatInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadScenario(0);

            if (typeof TMABridge !== 'undefined') {
                TMABridge.setupBackButton('index.html');
            }
        });
    </script>
</body>
</html>
