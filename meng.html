<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тренажер диалогов: 30 жизненных переписок</title>
    
    <!-- Подключение единой дизайн-системы и Telegram SDK -->
    <link rel="stylesheet" href="theme.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="tma-bridge.js"></script>

    <style>
        /* Специфические стили интерактивного мессенджера */
        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        .chat-header {
            height: calc(60px + var(--sa-t));
            padding-top: var(--sa-t);
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: calc(14px + var(--sa-l));
            padding-right: calc(14px + var(--sa-r));
            flex-shrink: 0;
            z-index: 10;
        }

        .btn-menu {
            background: #1f2937;
            border: 1px solid var(--card-border);
            color: #60a5fa;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        .contact-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #374151;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .contact-text {
            display: flex;
            flex-direction: column;
        }

        .contact-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
        }

        .contact-status {
            font-size: 0.7rem;
            color: var(--pos);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--pos);
        }

        .progress-pill {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--gold);
            background: var(--gold-bg);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid var(--gold);
        }

        .chat-stream {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .chat-stream::-webkit-scrollbar { display: none; }

        .msg-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.92rem;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: fadeIn 0.25s ease-out;
        }

        .msg-incoming {
            background: #1f2937;
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg-outgoing {
            background: #2563eb;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg-top-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .msg-incoming .word { color: #93c5fd; }
        .msg-outgoing .word { color: #e0f2fe; }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: #1f2937;
            padding: 10px 14px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            gap: 4px;
            align-items: center;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .prompt-dock {
            background: #111827;
            border-top: 1px solid var(--card-border);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-title {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--gold);
            text-transform: uppercase;
        }

        .hint-toggle-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        .task-ru {
            font-size: 0.88rem;
            font-weight: 600;
            color: #f1f5f9;
            line-height: 1.35;
        }

        .skeleton-hint {
            font-size: 0.75rem;
            color: #cbd5e1;
            background: rgba(0,0,0,0.3);
            padding: 6px 8px;
            border-radius: 6px;
            font-family: ui-monospace, Consolas, monospace;
            display: none;
        }

        .input-bar {
            background: #0b0f19;
            padding: 10px 14px calc(14px + var(--sa-b)) 14px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            background: #1f2937;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }
        .chat-input:focus { border-color: var(--primary); }

        .send-btn {
            background: var(--primary);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .drawer-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            align-items: flex-end;
        }

        .drawer-card {
            background: #111827;
            border-top: 1px solid var(--card-border);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 16px;
            padding-bottom: calc(20px + var(--sa-b));
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--card-border);
        }

        .drawer-title {
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
        }

        .drawer-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .drawer-item {
            background: #1f2937;
            border: 1px solid var(--card-border);
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .drawer-item.active { border-color: var(--primary); background: rgba(59, 130, 246, 0.15); }

        .drawer-item-avatar { font-size: 1.4rem; }
        .drawer-item-content { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .drawer-item-title { font-size: 0.88rem; font-weight: 700; color: #fff; }
        .drawer-item-desc { font-size: 0.75rem; color: var(--text-muted); }

        .variants-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 110;
            padding: 16px;
            align-items: center;
            justify-content: center;
        }

        .variant-item {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.86rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="chat-header">
        <button class="btn-menu" onclick="openDrawer()">☰ Все диалоги (30)</button>
        <div class="contact-info">
            <div class="avatar" id="contactAvatar">🏠</div>
            <div class="contact-text">
                <div class="contact-name" id="contactName">Mr. Henderson</div>
                <div class="contact-status"><span class="status-dot"></span> Online</div>
            </div>
        </div>
        <div class="progress-pill" id="progressPill">Шаг 1 из 3</div>
    </div>

    <!-- Chat Messages -->
    <div class="chat-stream" id="chatStream">
        <div class="typing-indicator" id="typingIndicator">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
    </div>

    <!-- Task Prompt & Skeleton Dock -->
    <div class="prompt-dock">
        <div class="task-header">
            <div class="task-title">🎯 Ваша задача (Передайте мысль на English):</div>
            <button class="hint-toggle-btn" onclick="toggleSkeletonHint()">💡 Подсказка скелета</button>
        </div>
        <div class="task-ru" id="taskRu">Загрузка задачи...</div>
        <div class="skeleton-hint" id="skeletonHint">...</div>
    </div>

    <!-- Input Bar -->
    <div class="input-bar">
        <input type="text" id="chatInput" class="chat-input" placeholder="Напечатайте ответ на английском..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="send-btn" onclick="handleSend()">➤</button>
    </div>

    <!-- Drawer: 30 Scenarios Selector -->
    <div class="drawer-modal" id="drawerModal" onclick="closeDrawer(event)">
        <div class="drawer-card" onclick="event.stopPropagation()">
            <div class="drawer-header">
                <div class="drawer-title">Выберите диалог:</div>
                <button style="background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;" onclick="closeDrawer()">✕</button>
            </div>
            <div class="drawer-list" id="drawerList"></div>
        </div>
    </div>

    <!-- Variants Help Modal -->
    <div class="variants-modal" id="variantsModal">
        <div class="card" style="max-width: 500px; width: 100%; display: flex; flex-direction: column; gap: 12px;">
            <div style="font-size: 0.95rem; font-weight: 800; color: var(--gold);">⚠️ Сравните со своими словами:</div>
            <div style="font-size: 0.78rem; color: var(--text-muted);">Нажмите на любой эталонный вариант, чтобы вставить его:</div>
            <div id="variantsList" style="display: flex; flex-direction: column; gap: 8px;"></div>
            <div id="modalExp" style="font-size: 0.78rem; color: #94a3b8; margin-top: 4px;"></div>
            <button style="background:var(--primary);color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700;cursor:pointer;" onclick="closeVariantsModal()">Понятно, пробую снова</button>
        </div>
    </div>

                { incoming: 'Welcome to Sparkle Auto Spa! Are you looking for a basic exterior wash or interior detailing?', taskRu: 'Мне нужна глубокая химчистка задних сидений, так как ребенок пролил вишневый сок.', hintSkeleton: 'I need a deep steam cleaning for the back seats because my kid spilled cherry juice.', variants: ['I need a deep shampoo cleaning for the back seats because my kid spilled cherry juice.', 'I need deep interior detailing for the rear seats because my child spilled cherry juice.', 'I need deep steam cleaning on the back seats as my child spilled cherry juice.'], exp: 'Deep steam/shampoo cleaning + spilled juice.' },

            { id: 29, avatar: '🎂', title: '30. 🎂 Заказ торта у кондитера', desc: 'Безглютеновый торт на день рождения с надписью', name: 'Claire (Pastry Chef)', steps: [
                { incoming: 'Sweet Treats Bakery! How many guests are you expecting for the birthday celebration?', taskRu: 'У нас будет около пятнадцати гостей, и торт обязательно должен быть без глютена.', hintSkeleton: 'We will have around fifteen guests, and the cake must be strictly gluten-free.', variants: ['We will have around fifteen guests, and the cake must be strictly gluten-free.', 'We are expecting about 15 guests, and the cake has to be gluten-free.', 'There will be around fifteen guests, and it\'s essential that the cake is gluten-free.'], exp: 'Around 15 guests + strictly gluten-free.' },
                { incoming: 'We have a certified gluten-free kitchen! What flavor profile and custom message would you like?', taskRu: 'Шоколадный с малиной, и напишите красивым шрифтом \'Happy Birthday Max!\'.', hintSkeleton: 'Chocolate with raspberry, and please write \'Happy Birthday Max!\' in neat lettering.', variants: ['Chocolate with raspberry, and please write Happy Birthday Max in nice handwriting.', 'Chocolate with raspberry, and please write Happy Birthday Max in neat lettering.', 'Chocolate with raspberry flavor, with Happy Birthday Max written on top.'], exp: 'Chocolate with raspberry + in neat lettering.' },
            ]}
        ];

        // Merge all 30 scenarios into one array
        EXTRA_SCENARIOS_20.forEach(sc => SCENARIOS.push(sc));

        // ENGINE STATE
        let activeScenarioIndex = 0;
        let currentStepIndex = 0;

        function speakWord(word, el) {
            if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
            document.querySelectorAll('.word').forEach(w => w.classList.remove('speaking'));
            if (el) el.classList.add('speaking');
            const clean = word.replace(/[^a-zA-Z']/g, '');
            
            if (typeof TMABridge !== 'undefined' && TMABridge.speak) {
                TMABridge.speak(clean, 0.85, () => {
                    if (el) el.classList.remove('speaking');
                });
            }
        }

        function playPhrase(text) {
            if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
            if (typeof TMABridge !== 'undefined' && TMABridge.speak) {
                TMABridge.speak(text, 0.9);
            }
        }

        function normalize(str) {
            return str.toLowerCase()
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?'"]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function loadScenario(idx) {
            // Freemium Paywall: Scenarios 0 and 1 are free. Scenarios 2..29 are premium.
            if (idx >= 2 && typeof TMABridge !== 'undefined') {
                if (!TMABridge.checkDemoLimit(idx, 2)) {
                    return; // Блокируем загрузку и показываем окно оплаты
                }
            }

            activeScenarioIndex = idx;
            currentStepIndex = 0;
            const sc = SCENARIOS[idx];

            document.getElementById('contactAvatar').innerText = sc.avatar;
            document.getElementById('contactName').innerText = sc.name;

            document.getElementById('chatStream').innerHTML = `
                <div class="typing-indicator" id="typingIndicator">
                    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                </div>
            `;

            closeDrawer();
            showIncomingStep();
        }

        function showIncomingStep() {
            const sc = SCENARIOS[activeScenarioIndex];
            const stepData = sc.steps[currentStepIndex];

            document.getElementById('progressPill').innerText = `Шаг ${currentStepIndex + 1} из ${sc.steps.length}`;
            document.getElementById('taskRu').innerText = stepData.taskRu;
            document.getElementById('skeletonHint').innerText = stepData.hintSkeleton;
            document.getElementById('skeletonHint').style.display = 'none';

            const indicator = document.getElementById('typingIndicator');
            indicator.style.display = 'flex';
            scrollChat();

            setTimeout(() => {
                indicator.style.display = 'none';
                appendIncomingMessage(stepData.incoming);
                playPhrase(stepData.incoming);
                scrollChat();
            }, 1000);
        }

        function appendIncomingMessage(text) {
            const stream = document.getElementById('chatStream');
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble msg-incoming';
            const wordsHtml = text.split(' ').map(w => `<span class="word" onclick="speakWord('${w}', this)">${w}</span>`).join(' ');
            bubble.innerHTML = `
                <div class="msg-top-row">
                    <button class="audio-btn" onclick="playPhrase('${text.replace(/'/g, "\\'")}')">🔊</button>
                    <div>${wordsHtml}</div>
                </div>
            `;
            const indicator = document.getElementById('typingIndicator');
            stream.insertBefore(bubble, indicator);
        }

        function appendOutgoingMessage(text) {
            const stream = document.getElementById('chatStream');
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble msg-outgoing';
            const wordsHtml = text.split(' ').map(w => `<span class="word" onclick="speakWord('${w}', this)">${w}</span>`).join(' ');
            bubble.innerHTML = `
                <div class="msg-top-row">
                    <button class="audio-btn" onclick="playPhrase('${text.replace(/'/g, "\\'")}')">🔊</button>
                    <div>${wordsHtml}</div>
                </div>
            `;
            const indicator = document.getElementById('typingIndicator');
            stream.insertBefore(bubble, indicator);
        }

        function scrollChat() {
            const stream = document.getElementById('chatStream');
            stream.scrollTop = stream.scrollHeight;
        }

        function toggleSkeletonHint() {
            if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
            const h = document.getElementById('skeletonHint');
            h.style.display = (h.style.display === 'none' || !h.style.display) ? 'block' : 'none';
        }

        function handleSend() {
            const input = document.getElementById('chatInput');
            const userText = input.value.trim();
            if (!userText) return;

            const sc = SCENARIOS[activeScenarioIndex];
            const stepData = sc.steps[currentStepIndex];
            const normUser = normalize(userText);

            const isMatch = stepData.variants.some(v => normalize(v) === normUser);

            if (isMatch) {
                if (typeof TMABridge !== 'undefined') TMABridge.haptic('medium');
                appendOutgoingMessage(userText);
                input.value = '';
                scrollChat();

                if (currentStepIndex < sc.steps.length - 1) {
                    currentStepIndex++;
                    setTimeout(showIncomingStep, 1000);
                } else {
                    if (typeof TMABridge !== 'undefined') TMABridge.haptic('heavy');
                    setTimeout(() => {
                        alert('🎉 Отлично! Вы успешно завершили эту жизненную переписку!');
                    }, 800);
                }
            } else {
                if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
                showVariantsModal(stepData.variants, stepData.exp);
            }
        }

        function showVariantsModal(variants, exp) {
            const list = document.getElementById('variantsList');
            list.innerHTML = '';

            variants.forEach(v => {
                const item = document.createElement('div');
                item.className = 'variant-item';
                item.innerHTML = `
                    <span style="flex:1;line-height:1.3;">${v}</span>
                    <button style="background:none;border:none;color:#60a5fa;font-size:0.75rem;font-weight:700;cursor:pointer;white-space:nowrap;margin-left:8px;">Вставить ✍️</button>
                `;
                item.onclick = () => {
                    if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
                    document.getElementById('chatInput').value = v;
                    closeVariantsModal();
                    document.getElementById('chatInput').focus();
                };
                list.appendChild(item);
            });

            document.getElementById('modalExp').innerHTML = `<b>Разбор:</b> ${exp}`;
            document.getElementById('variantsModal').style.display = 'flex';
        }

        function closeVariantsModal() {
            document.getElementById('variantsModal').style.display = 'none';
        }

        // DRAWER CONTROLLER
        function openDrawer() {
            if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
            renderDrawerList();
            document.getElementById('drawerModal').style.display = 'flex';
        }

        function closeDrawer() {
            document.getElementById('drawerModal').style.display = 'none';
        }

        function renderDrawerList() {
            const list = document.getElementById('drawerList');
            list.innerHTML = '';

            SCENARIOS.forEach((sc, idx) => {
                const isLocked = idx >= 2 && (!TMABridge || !TMABridge.isPremiumUser());
                const item = document.createElement('div');
                item.className = `drawer-item ${idx === activeScenarioIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="drawer-item-avatar">${sc.avatar}</div>
                    <div class="drawer-item-content">
                        <div class="drawer-item-title">${sc.title} ${isLocked ? '🔒' : ''}</div>
                        <div class="drawer-item-desc">${sc.desc}</div>
                    </div>
                `;
                item.onclick = () => {
                    if (idx >= 2 && typeof TMABridge !== 'undefined') {
                        if (!TMABridge.checkDemoLimit(idx, 2)) {
                            closeDrawer();
                            return;
                        }
                    }
                    loadScenario(idx);
                };
                list.appendChild(item);
            });
        }

        document.getElementById('chatInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadScenario(0);

            if (typeof TMABridge !== 'undefined') {
                TMABridge.setupBackButton('index.html');
            }
        });
    </script>
