                { incoming: 'We provide complimentary gift wrapping with textured craft paper and cotton ribbon.', taskRu: 'Пожалуйста, упакуйте в темно-зеленую крафтовую бумагу с золотистой бечевкой.', hintSkeleton: 'Please wrap it in dark green craft paper with gold decorative twine.', variants: ['Please wrap it in dark green craft paper with gold decorative twine.', 'I\'d love the forest green textured wrapping paper with a golden ribbon.', 'Please use the dark green artisan paper and tie it with gold twine.'] },
                { incoming: 'Wrapped with a neat bow and protective tissue! Would you like a blank gift tag card?', taskRu: 'Да, положите небольшую открытку для поздравления, и пробьем чек на кассе.', hintSkeleton: 'Yes, please include a small blank greeting card, and let us ring up the sale.', variants: ['Yes, please include a small blank greeting card, and let us ring up the sale.', 'Yes please, add a mini gift card for writing a message, and I\'ll pay by card.', 'A small blank greeting enclosure card would be great. Ready to pay at the register!'] },
                { incoming: 'Total is $45 with student discount applied. Here is your receipt and beautifully wrapped gift!', taskRu: 'Упаковка выглядит потрясающе, спасибо за вашу помощь и любовь к книгам, Артур!', hintSkeleton: 'The wrapping looks stunning, thank you for your help and passion for books, Arthur!', variants: ['The wrapping looks stunning, thank you for your help and passion for books, Arthur!', 'The gift wrapping is gorgeous, thank you for such thoughtful service Arthur!', 'It looks magnificent Arthur, thank you for your wonderful recommendations. Have a great day!'] }
            ]},
            { id: 24, avatar: '🎫', title: '25. 🎫 Билеты на концерт', desc: 'Опечатка в email, списание средств, динамический QR-код Ticketmaster и Wallet', name: 'Ticketmaster Support', steps: [
                { incoming: 'Ticketmaster Customer Care. Please state your order reference or describe your issue.', taskRu: 'Деньги списались с моей карты, но электронные билеты не пришли на мою почту.', hintSkeleton: 'The money was charged to my card, but the e-tickets were not sent to my email.', variants: ['The money was charged to my card, but the e-tickets were not sent to my email.', 'The charge went through on my card, but I haven\'t received the tickets by email.', 'My card was charged, but the electronic tickets never arrived in my inbox.'], exp: 'The charge went through / money was charged.' },
                { incoming: 'I can search your transaction manually. What email address was used at checkout?', taskRu: 'Я использовал адрес alex.dev@gmail.com примерно час назад.', hintSkeleton: 'I used the email alex.dev@gmail.com approximately an hour ago.', variants: ['I used the email alex.dev@gmail.com approximately an hour ago.', 'I used alex.dev@gmail.com about one hour ago.', 'The email address was alex.dev@gmail.com roughly an hour ago.'], exp: 'Used the email + approximately an hour ago.' },
                { incoming: 'I located the transaction, but the checkout form shows "alex.dev@gmai.com" without the letter "l".', taskRu: 'Это всё объясняет! Я случайно пропустил букву в домене почты при спешке.', hintSkeleton: 'That explains everything! I accidentally omitted a letter in the email domain in a rush.', variants: ['That explains everything! I accidentally omitted a letter in the email domain in a rush.', 'That makes complete sense! I made a typo and dropped the letter L when typing fast.', 'That\'s the problem! I accidentally typed gmai instead of gmail during checkout.'] },
                { incoming: 'I have corrected the email address to alex.dev@gmail.com and resent the confirmation email.', taskRu: 'Письмо с подтверждением заказа только что пришло, но где находятся сами входные билеты?', hintSkeleton: 'The order confirmation email just arrived, but where are the actual entry tickets located?', variants: ['The order confirmation email just arrived, but where are the actual entry tickets located?', 'I see the receipt email now, but how do I access the digital event tickets with barcodes?', 'The confirmation landed in my inbox, but where can I view the actual entry passes?'] },
                { incoming: 'This concert uses SafeTix encrypted dynamic barcodes accessible exclusively inside the Ticketmaster app.', taskRu: 'Могу ли я добавить эти электронные билеты напрямую в приложение Apple Wallet на телефоне?', hintSkeleton: 'Can I add these digital tickets directly to the Apple Wallet app on my phone?', variants: ['Can I add these digital tickets directly to the Apple Wallet app on my phone?', 'Is it possible to export the tickets to Apple Wallet or Google Wallet for offline entry?', 'Can I save the digital passes directly into my smartphone\'s Apple Wallet?'] },
                { incoming: 'Tap "Add to Apple Wallet" beneath the event pass; dynamic NFC will scan seamlessly at the turnstile.', taskRu: 'Принимают ли сканеры на входе на стадион скриншоты или распечатанные на бумаге копии штрих-кода?', hintSkeleton: 'Do the stadium gate scanners accept screenshots or printed paper copies of the barcode?', variants: ['Do the stadium gate scanners accept screenshots or printed paper copies of the barcode?', 'Will a static screenshot or paper printout of the QR code be accepted at the arena turnstiles?', 'Can my friends use screenshot images of the tickets to get through the entry gates?'] },
                { incoming: 'Screenshots are strictly rejected; the barcode refreshes every 15 seconds to prevent scalping.', taskRu: 'Что произойдет, если возле арены пропадет мобильный интернет или разрядится телефон?', hintSkeleton: 'What happens if cellular reception drops outside the arena or my phone battery runs low?', variants: ['What happens if cellular reception drops outside the arena or my phone battery runs low?', 'What should I do if mobile data fails due to network congestion outside the stadium?', 'How do I scan my ticket if there is zero mobile signal in the crowd at the gates?'] },
                { incoming: 'Once stored in Apple Wallet, the ticket works 100% offline via contactless NFC without internet.', taskRu: 'Я купил четыре билета. Могу ли я переслать два билета друзьям, чтобы они зашли отдельно?', hintSkeleton: 'I bought four tickets. Can I transfer two tickets to my friends so they can enter separately?', variants: ['I bought four tickets. Can I transfer two tickets to my friends so they can enter separately?', 'Is it possible to split the order and transfer two passes to my friends for separate entry?', 'Can I send two of the four mobile tickets to my buddies so they don\'t have to enter with me?'] },
                { incoming: 'Tap "Transfer Tickets", select the two seats, and enter your friends\' email addresses.', taskRu: 'Взимается ли комиссия за передачу билетов на другой аккаунт пользователя?', hintSkeleton: 'Is there any processing fee charged for transferring tickets to another user\'s account?', variants: ['Is there any processing fee charged for transferring tickets to another user\'s account?', 'Does Ticketmaster charge a transfer surcharge when reassigning tickets to a friend?', 'Is digital ticket transfer completely free of charge or is there an admin fee?'] },
                { incoming: 'Ticket transfer is 100% free and instantaneous once your friends click accept in their email.', taskRu: 'Я заметил два одинаковых списания по сто восемьдесят долларов в банковской выписке.', hintSkeleton: 'I noticed two identical charges of one hundred and eighty dollars on my bank statement.', variants: ['I noticed two identical charges of one hundred and eighty dollars on my bank statement.', 'There appear to be two duplicate charges of $180 on my credit card activity.', 'My banking app shows a double charge of 180 dollars for this single purchase.'] },
                { incoming: 'One is the finalized ticket charge; the second is an authorization hold that failed on your first attempt.', taskRu: 'Через сколько рабочих дней эта ошибочная блокировка средств исчезнет с моей карты?', hintSkeleton: 'In how many business days will this duplicate authorization hold drop off my card?', variants: ['In how many business days will this duplicate authorization hold drop off my card?', 'When will the duplicate pending authorization hold be released back to my available balance?', 'How long does it take for a temporary pending charge to disappear from my bank account?'] },
                { incoming: 'Pending pre-authorizations automatically drop off within 48 to 72 hours according to banking rules.', taskRu: 'В каком секторе стадиона расположены наши места: это фан-зона или сидячий партер?', hintSkeleton: 'Which section of the stadium are our seats in: is it the general admission pit or reserved floor?', variants: ['Which section of the stadium are our seats in: is it the general admission pit or reserved floor?', 'Are these tickets for the general admission standing floor or reserved lower bowl seats?', 'Could you clarify the seating tier: is it standing general admission or numbered seats?'] },
                { incoming: 'You have Reserved Floor Row C, Seats 12 through 15 right in front of the main catwalk.', taskRu: 'Через какие ворота стадиона нам удобнее всего заходить с билетами в партер?', hintSkeleton: 'Through which stadium gate is it most convenient for us to enter with floor tickets?', variants: ['Through which stadium gate is it most convenient for us to enter with floor tickets?', 'Which entrance turnstiles provide the quickest access to Floor Section C?', 'Which exterior gate should we head towards for VIP and Floor ticket holders?'] },
                { incoming: 'Gate B on the East Concourse has dedicated expedited lanes for Floor ticket holders.', taskRu: 'Все билеты перенесены в кошелек, и дубликат списания понятен. Спасибо за помощь!', hintSkeleton: 'All tickets are in my wallet, and the duplicate hold is understood. Thank you for your help!', variants: ['All tickets are in my wallet, and the duplicate hold is understood. Thank you for your help!', 'The tickets are safely in Apple Wallet and the banking hold makes sense. Thanks a lot!', 'Everything is crystal clear and my tickets are ready to scan. Thank you for resolving this so quickly!'] },
                { incoming: 'You are all set for an epic concert night! Have an incredible time with your friends!', taskRu: 'Спасибо огромное за быстрый и дружелюбный сервис! Отличного вам дежурства!', hintSkeleton: 'Thank you very much for the prompt and friendly service! Have a wonderful shift!', variants: ['Thank you very much for the prompt and friendly service! Have a wonderful shift!', 'Thanks for the fast and courteous support! Enjoy the rest of your workday!', 'Much appreciated, outstanding customer support today. Take care and have a great evening!'] }
            ]},
            { id: 25, avatar: '👮', title: '26. 👮 Полиция / Утеря вещей', desc: 'Кража рюкзака в парке, трекинг AirPods, камеры видеонаблюдения и справка для консульства', name: 'Officer Miller (Police)', steps: [
                { incoming: 'Central Precinct, Officer Miller. What would you like to report today?', taskRu: 'Я хочу заявить об утере черного кожаного рюкзака с моим паспортом.', hintSkeleton: 'I want to report the loss of a black leather backpack with my passport inside.', variants: ['I want to report the loss of a black leather backpack containing my passport.', 'I would like to report a lost black leather backpack with my passport inside.', 'I need to report a missing black leather backpack that had my passport in it.'], exp: 'Report the loss of / report a missing backpack.' },
                { incoming: 'Where and at what time did you last have possession of the item?', taskRu: 'Я оставил его на скамейке в Гайд-парке около четырех часов дня.', hintSkeleton: 'I left it on a bench in Hyde Park around four in the afternoon.', variants: ['I left it on a bench in Hyde Park around four in the afternoon.', 'I accidentally left it on a bench in Hyde Park at around 4 pm.', 'It was on a bench in Hyde Park around 4 o\'clock this afternoon.'], exp: 'Left it on a bench around 4 pm.' },
                { incoming: 'Can you specify the exact location in Hyde Park, near which landmark or path?', taskRu: 'Возле озера Серпентайн, рядом с мемориальным садом роз.', hintSkeleton: 'Near the Serpentine lake, close to the memorial rose garden.', variants: ['Near the Serpentine lake, close to the memorial rose garden.', 'Beside the Serpentine lake, right by the rose garden path.', 'Next to the Serpentine lake, in the vicinity of the rose garden.'] },
                { incoming: 'How long was the backpack left unattended before you realized it was gone?', taskRu: 'Я отошел примерно на двадцать минут, чтобы сфотографировать закат у воды.', hintSkeleton: 'I stepped away for about twenty minutes to take sunset photos by the water.', variants: ['I stepped away for about twenty minutes to take sunset photos by the water.', 'It was unattended for roughly 20 minutes while I took pictures near the lake.', 'I was away from the bench for about twenty minutes taking photographs.'] },
                { incoming: 'When you returned to the bench, was there anyone sitting nearby or acting suspiciously?', taskRu: 'Когда я вернулся, скамейка была совершенно пуста, рюкзак исчез.', hintSkeleton: 'When I returned, the bench was completely empty and the backpack had disappeared.', variants: ['When I returned, the bench was completely empty and the backpack had disappeared.', 'When I got back, the bench was empty and my bag was nowhere to be found.', 'The bench was completely vacated when I returned, my backpack was gone.'] },
                { incoming: 'Besides your foreign passport, what other valuables were stored in the compartments?', taskRu: 'Внутри лежал рабочий ноутбук MacBook Pro и беспроводные наушники AirPods.', hintSkeleton: 'Inside was a work MacBook Pro laptop and wireless AirPods earphones.', variants: ['Inside was a work MacBook Pro laptop and wireless AirPods earphones.', 'There was my corporate MacBook Pro and a pair of wireless AirPods in the main pocket.', 'The bag contained a MacBook Pro laptop and Apple AirPods headphones.'] },
                { incoming: 'Do you have active location tracking on the laptop or AirPods via Apple Find My?', taskRu: 'Приложение Локатор показывает, что наушники перемещаются в реальном времени по Оксфорд-стрит.', hintSkeleton: 'The Find My app shows the earphones moving in real time along Oxford Street.', variants: ['The Find My app shows the earphones moving in real time along Oxford Street.', 'Apple Find My indicates the AirPods are currently moving live down Oxford Street.', 'The tracking map displays the AirPods in transit along Oxford Street right now.'] },
                { incoming: 'Is the signal pinging actively right now, and what is the battery percentage?', taskRu: 'Геолокация обновляется каждые две минуты, заряд батареи составляет шестьдесят процентов.', hintSkeleton: 'The geolocation updates every two minutes, and the battery level is sixty percent.', variants: ['The geolocation updates every two minutes, and the battery level is sixty percent.', 'The GPS pin refreshes every two minutes with 60% battery remaining.', 'The live location pings every 2 minutes and battery status shows 60 percent.'] },
                { incoming: 'Do not attempt to confront anyone yourself; recovering stolen property is a police duty.', taskRu: 'Я понимаю риски и поэтому сразу пришел в полицейский участок за помощью.', hintSkeleton: 'I understand the risks, which is why I came directly to the police precinct for help.', variants: ['I understand the risks, which is why I came directly to the police precinct for help.', 'I realize it is dangerous, that is why I came straight to the police station.', 'I understand the danger and immediately sought assistance at the precinct.'] },
                { incoming: 'Good decision. What country issued your passport and what is the document number?', taskRu: 'Это биометрический паспорт гражданина, выданный в двадцать первом году, номер 752941.', hintSkeleton: 'It is a biometric citizen passport issued in twenty twenty-one, number 752941.', variants: ['It is a biometric citizen passport issued in twenty twenty-one, number 752941.', 'It is a biometric passport issued in 2021, document number seven five two nine four one.', 'It\'s a biometric passport from 2021 with the number 752941.'] },
                { incoming: 'Have you contacted your bank to freeze all debit and credit cards in the wallet?', taskRu: 'Да, я заблокировал все банковские карты через мобильное приложение в первые десять минут.', hintSkeleton: 'Yes, I froze all bank cards through my mobile banking app within the first ten minutes.', variants: ['Yes, I froze all bank cards through my mobile banking app within the first ten minutes.', 'Yes, I cancelled all credit and debit cards on my phone within 10 minutes of noticing.', 'I already locked all payment cards via the banking app immediately.'] },
                { incoming: 'Are there public CCTV cameras overlooking that specific pathway in Hyde Park?', taskRu: 'Установлены ли городские камеры видеонаблюдения над аллеей возле розария?', hintSkeleton: 'Are there municipal CCTV surveillance cameras covering the walkway near the rose garden?', variants: ['Are there municipal CCTV surveillance cameras covering the walkway near the rose garden?', 'Does the city have CCTV cameras monitoring that particular path by the rose garden?', 'Are there public security cameras overlooking the walkway near the memorial garden?'] },
                { incoming: 'Park security maintains cameras at the main gates and pedestrian pathways. We will request the footage.', taskRu: 'Смогут ли офицеры просмотреть видеозаписи с четырех до пяти вечера сегодня?', hintSkeleton: 'Will officers be able to review the footage between four and five pm today?', variants: ['Will officers be able to review the footage between four and five pm today?', 'Can the investigators inspect the security tapes recorded between 4 and 5 pm today?', 'Will police check the camera feeds from 4:00 to 5:00 pm this afternoon?'] },
                { incoming: 'A detective will issue a formal evidence preservation request to the Royal Parks authority.', taskRu: 'Будет ли инцидент классифицирован как кража или как утерянное имущество?', hintSkeleton: 'Will the incident be classified as theft or as lost property?', variants: ['Will the incident be classified as theft or as lost property?', 'Is this officially logged as criminal theft or accidental lost property?', 'Will this be categorized as larceny or lost property in the police register?'] },
                { incoming: 'Since the bag was taken from a public bench without consent, it is classified as theft.', taskRu: 'Какой уникальный номер дела в реестре преступлений будет присвоен этому заявлению?', hintSkeleton: 'What unique crime reference number will be assigned to this police report?', variants: ['What unique crime reference number will be assigned to this police report?', 'What is the official police reference number for this theft report?', 'Which crime incident number will be generated for my case file?'] },
                { incoming: 'Your Crime Reference Number is CAD-88219-24. Write it down; you will need it for the consulate.', taskRu: 'У меня назначена встреча в консульстве завтра утром для оформления свидетельства на возвращение.', hintSkeleton: 'I have an appointment at my consulate tomorrow morning to obtain an emergency travel document.', variants: ['I have an appointment at my consulate tomorrow morning to obtain an emergency travel document.', 'I booked a morning slot at my embassy tomorrow for an emergency passport replacement.', 'I have an appointment at the consulate tomorrow morning for an emergency return certificate.'] },
                { incoming: 'The embassy will require our official police incident loss slip to issue emergency travel papers.', taskRu: 'Будет ли этой справки из полиции с круглой печатью достаточно для консульского офицера?', hintSkeleton: 'Will this stamped police incident slip be sufficient for the consular officer?', variants: ['Will this stamped police incident slip be sufficient for the consular officer?', 'Is this official stamped police report enough for the consular section to issue a travel document?', 'Will the consulate accept this signed and stamped police report without issues?'] },
                { incoming: 'Yes, this embossed document is internationally recognized by all foreign embassies and consulates.', taskRu: 'Вот серийный номер украденного ноутбука из моего чека о покупке: C02F8192MD6R.', hintSkeleton: 'Here is the serial number of the stolen laptop from my purchase receipt: C02F8192MD6R.', variants: ['Here is the serial number of the stolen laptop from my purchase receipt: C02F8192MD6R.', 'I have the laptop serial number from the store invoice: C02F8192MD6R.', 'The stolen MacBook serial number is C02F8192MD6R, here is the original invoice.'] },
                { incoming: 'I have blacklisted the serial number in the National Police Stolen Property database.', taskRu: 'Пожалуйста, распечатайте два официальных экземпляра справки с печатью для моей страховой компании.', hintSkeleton: 'Please print two official copies of the report with stamps for my insurance company.', variants: ['Please print two official copies of the report with stamps for my insurance company.', 'Could you give me two stamped physical copies of the crime report for my travel insurer?', 'Please issue two signed and stamped copies so I can submit a travel insurance claim.'] },
                { incoming: 'Printing two stamped originals now. What should you do if the AirPods location stops moving?', taskRu: 'Что мне делать, если геолокация остановится в конкретном жилом доме?', hintSkeleton: 'What should I do if the live geolocation stops at a specific residential building?', variants: ['What should I do if the live geolocation stops at a specific residential building?', 'How should I proceed if the tracking pin settles at a specific street address?', 'What steps should I take if the Find My location pinpoints a stationary residential building?'] },
                { incoming: 'Take a screenshot of the address and call 101 immediately; do not knock on doors yourself.', taskRu: 'Я сделаю снимок экрана с адресом и сразу наберу номер дежурной части.', hintSkeleton: 'I will take a screenshot of the address and dial the precinct dispatch immediately.', variants: ['I will take a screenshot of the address and dial the precinct dispatch immediately.', 'I\'ll capture a screenshot of the location and call 101 right away.', 'I will screenshot the map coordinates and phone the local police station immediately.'] },
                { incoming: 'A patrol unit can be dispatched to verify the GPS coordinates. What is your local phone number?', taskRu: 'Мой временный местный номер телефона в Лондоне: +44 7700 900142.', hintSkeleton: 'My temporary local phone number in London is +44 7700 900142.', variants: ['My temporary local phone number in London is +44 7700 900142.', 'I have a temporary UK mobile number: +44 7700 900142.', 'My contact cell number while in London is +44 7700 900142.'] },
                { incoming: 'Phone number linked to crime CAD-88219-24. Here are your two stamped official police reports.', taskRu: 'Огромное спасибо за оперативное оформление документов и профессионализм, офицер Миллер.', hintSkeleton: 'Thank you very much for the prompt documentation and professionalism, Officer Miller.', variants: ['Thank you very much for the prompt documentation and professionalism, Officer Miller.', 'Thanks so much for processing the paperwork so fast and professionally, Officer Miller.', 'I truly appreciate your efficiency and helpful guidance today, Officer Miller.'] },
                { incoming: 'Keep the report safe for your embassy appointment tomorrow. Take care and stay vigilant!', taskRu: 'Спасибо за помощь и предостережение. Всего хорошего и спокойного вам дежурства!', hintSkeleton: 'Thank you for the help and warning. All the best and have a safe shift!', variants: ['Thank you for the help and warning. All the best and have a safe shift!', 'Thanks for everything. Stay safe and have a peaceful shift, Officer Miller!', 'Much appreciated Officer Miller. Good luck with the investigation and have a safe day!'] }
            ]},
            { id: 26, avatar: '🛡️', title: '27. 🛡️ Страховая после ДТП', desc: 'ДТП на парковке, запись видеорегистратора, франшиза, оригинальные детали и регресс', name: 'Brian (Claims Agent)', steps: [
                { incoming: 'AllState Claims Department. Are all passengers safe, and were police notified?', taskRu: 'Никто не пострадал. Другая машина задела мою фару на парковке.', hintSkeleton: 'Nobody was injured. Another car clipped my headlight in the parking lot.', variants: ['Nobody was injured. Another car scratched my headlight in the parking lot.', 'No one was hurt. Another vehicle hit my headlight in the parking lot.', 'Everyone is fine, no injuries. Another car clipped my headlight in the parking lot.'], exp: 'Nobody was injured / clipped my headlight.' },
                { incoming: 'Glad everyone is uninjured. Have you exchanged contact and policy numbers with the other driver?', taskRu: 'Да, я сфотографировал его водительские права и повреждения обоих автомобилей.', hintSkeleton: 'Yes, I took photos of his driver\'s license and the damage to both cars.', variants: ['Yes I took photos of his driver\'s license and the damage on both cars.', 'Yes, I photographed his driving license and the damage to both vehicles.', 'Yes I took pictures of his license and the damage to both cars.'], exp: 'Took photos of his driver\'s license.' },
                { incoming: 'Can you describe the sequence of events leading up to the collision in the parking lot?', taskRu: 'Другой водитель сдавал задом с парковочного места, не посмотрев в зеркало заднего вида.', hintSkeleton: 'The other driver was reversing out of a parking bay without checking his rearview mirror.', variants: ['The other driver was reversing out of a parking bay without checking his rearview mirror.', 'The other motorist backed out of a parking spot without looking in his rear mirrors.', 'He was reversing from his parking space blindly without checking his blind spots or mirrors.'] },
                { incoming: 'Did the other motorist verbally admit fault or sign any written acknowledgment at the scene?', taskRu: 'Он устно признал свою вину и написал короткую расписку на бумаге с датой и подписью.', hintSkeleton: 'He verbally admitted fault and wrote a brief signed statement on paper with the date.', variants: ['He verbally admitted fault and wrote a brief signed statement on paper with the date.', 'He admitted full responsibility verbally and signed a handwritten note acknowledging fault.', 'The driver conceded fault and provided a signed, dated handwritten statement accepting liability.'] },
                { incoming: 'A signed admission of liability is very strong evidence. Do you have video recordings?', taskRu: 'Мой видеорегистратор зафиксировал момент удара в высоком разрешении со звуком.', hintSkeleton: 'My dashcam captured the moment of impact in high resolution with audio.', variants: ['My dashcam captured the moment of impact in high resolution with audio.', 'My front and rear dash cameras recorded the collision clearly in high definition.', 'The vehicle\'s dashcam recorded the entire incident showing his reverse lights turning on.'] },
                { incoming: 'Can you upload the video file and photos directly through our mobile claims portal?', taskRu: 'Да, я могу загрузить видеозапись и фотографии повреждений через приложение прямо сейчас.', hintSkeleton: 'Yes, I can upload the video file and photos of the damage through the app right now.', variants: ['Yes, I can upload the video file and photos of the damage through the app right now.', 'I am able to submit the dashcam footage and pictures via the mobile portal immediately.', 'Yes, I\'ll attach the video clip and damage photographs to the claim in the app right away.'] },
                { incoming: 'What is the specific damage to your vehicle? Which body panels are impacted?', taskRu: 'Треснул передний бампер, разбито правое крыло и полностью расколот корпус LED-фары.', hintSkeleton: 'The front bumper is cracked, the right fender is dented, and the LED headlight assembly is shattered.', variants: ['The front bumper is cracked, the right fender is dented, and the LED headlight assembly is shattered.', 'There is a cracked bumper, a crushed front-right fender, and a destroyed LED headlight unit.', 'The front bumper cover fractured, the passenger wing is crumpled, and the headlight lens broke.'] },
                { incoming: 'LED headlight assemblies on newer vehicles are costly. What is the other driver\'s insurance policy?', taskRu: 'Его автомобиль застрахован в компании Geico, номер полиса PA-4819024.', hintSkeleton: 'His vehicle is insured with Geico, policy number PA-4819024.', variants: ['His vehicle is insured with Geico, policy number PA-4819024.', 'He has coverage through Geico insurance, policy number PA-4819024.', 'His insurer is Geico and the policy reference is PA-4819024.'] },
                { incoming: 'We have direct electronic subrogation exchange with Geico. What is your collision deductible?', taskRu: 'Моя стандартная франшиза по полису составляет пятьсот долларов.', hintSkeleton: 'My standard collision deductible under the policy is five hundred dollars.', variants: ['My standard collision deductible under the policy is five hundred dollars.', 'My comprehensive collision deductible is set at $500.', 'The deductible on my insurance schedule is five hundred dollars.'] },
                { incoming: 'Since the other driver accepted 100% liability with video proof, will you pay the deductible upfront?', taskRu: 'Будет ли моя франшиза отменена, если виновник полностью установлен и предоставил расписку?', hintSkeleton: 'Will my deductible be waived if the at-fault driver is identified and gave a written confession?', variants: ['Will my deductible be waived if the at-fault driver is identified and gave a written confession?', 'Can you waive my $500 deductible upfront since the other party accepted 100% fault on video?', 'Do I have to pay the deductible if liability is uncontested and proven by dashcam evidence?'] },
                { incoming: 'With clear dashcam proof and Geico coverage, we can waive your $500 deductible immediately.', taskRu: 'Это отличные новости. Могу ли я выбрать авторизованную станцию техобслуживания сам?', hintSkeleton: 'That is great news. Can I choose an authorized repair body shop myself?', variants: ['That is great news. Can I choose an authorized repair body shop myself?', 'Wonderful news. Do I have the right to select my own certified collision repair center?', 'Great! Am I allowed to use an independent certified body shop of my choice?'] },
                { incoming: 'You have full legal right to select any licensed repair shop, or use our guaranteed network.', taskRu: 'Гарантирует ли страховая компания использование оригинальных заводских запчастей OEM?', hintSkeleton: 'Does the insurance policy guarantee the use of original factory OEM replacement parts?', variants: ['Does the insurance policy guarantee the use of original factory OEM replacement parts?', 'Will the repairs be done exclusively using genuine manufacturer OEM parts rather than aftermarket?', 'Does your claim settlement cover brand-new OEM parts to preserve my factory warranty?'] },
                { incoming: 'Because your car is under 2 years old and under factory warranty, 100% OEM parts are mandatory.', taskRu: 'Это очень важно для сохранения дилерской гарантии на кузов и оптику.', hintSkeleton: 'That is very important for maintaining the dealer warranty on the body and headlights.', variants: ['That is very important for maintaining the dealer warranty on the body and headlights.', 'That is crucial to keep the manufacturer corrosion and electrical warranty intact.', 'I appreciate that, aftermarket headlights would void my factory warranty.'] },
                { incoming: 'Does your policy endorsement include replacement rental vehicle coverage while in repairs?', taskRu: 'Включает ли моя страховка аренду подменного автомобиля на весь период кузовного ремонта?', hintSkeleton: 'Does my policy include replacement rental car coverage for the entire duration of body repairs?', variants: ['Does my policy include replacement rental car coverage for the entire duration of body repairs?', 'Am I entitled to a rental loaner vehicle while my car is being fixed at the body shop?', 'Does my comprehensive coverage pay for a rental car during the repair timeframe?'] },
                { incoming: 'You have comprehensive Rental Reimbursement coverage up to $45 per day for a maximum of 30 days.', taskRu: 'Может ли страховая компания производить прямой расчет с компанией по прокату Enterprise?', hintSkeleton: 'Can the insurance company arrange direct billing with the Enterprise rental agency?', variants: ['Can the insurance company arrange direct billing with the Enterprise rental agency?', 'Is direct billing set up between your claims department and Enterprise Rent-A-Car?', 'Can you bill the rental vehicle directly to Enterprise so I pay zero out-of-pocket?'] },
                { incoming: 'Direct billing with Enterprise is confirmed. A mid-size SUV is reserved for you starting tomorrow.', taskRu: 'Когда независимый эксперт-оценщик приедет в автосервис для составления сметы повреждений?', hintSkeleton: 'When will an independent damage appraiser visit the repair shop to write the repair estimate?', variants: ['When will an independent damage appraiser visit the repair shop to write the repair estimate?', 'How soon will a claims adjuster inspect the vehicle at the collision center to approve the quote?', 'When is the field appraiser scheduled to inspect the structural damage at the body shop?'] },
                { incoming: 'A field adjuster is scheduled for tomorrow at 2:00 pm at your chosen certified collision center.', taskRu: 'Что произойдет, если после снятия бампера обнаружатся скрытые повреждения усилителя или радиатора?', hintSkeleton: 'What happens if hidden damage to the bumper reinforcement bar or radiator is discovered?', variants: ['What happens if hidden damage to the bumper reinforcement bar or radiator is discovered?', 'How do you handle supplemental claims if hidden frame or radiator damage is found after teardown?', 'What is the procedure if the body shop uncovers secondary structural damage beneath the bumper?'] },
                { incoming: 'The body shop submits an electronic supplemental estimate with photos, and we approve it within 24 hours.', taskRu: 'Имею ли я право подать иск об утрате товарной стоимости из-за отметки в истории Carfax?', hintSkeleton: 'Am I entitled to file a diminished value claim due to the accident record appearing on Carfax?', variants: ['Am I entitled to file a diminished value claim due to the accident record appearing on Carfax?', 'Can I claim compensation for diminished market value since the vehicle now has an accident history?', 'Is a diminished value payout applicable because the collision will reduce resale value?'] },
                { incoming: 'Yes, against Geico as third-party claimant, you can file for inherent diminished market value.', taskRu: 'Какой номер дела присвоен моему страховому случаю для отслеживания статуса в личном кабинете?', hintSkeleton: 'What claim file number is assigned to my collision case for tracking status online?', variants: ['What claim file number is assigned to my collision case for tracking status online?', 'What is my claims reference number so I can monitor repair progress on the website?', 'Which file identifier was created for this claim on the policyholder portal?'] },
                { incoming: 'Your claim number is CLM-99104-B. You can view all adjuster notes and photo approvals in the app.', taskRu: 'Сколько времени обычно занимает процедура суброгации и взыскания средств со страховой компании виновника?', hintSkeleton: 'How long does the subrogation and recovery process against the at-fault driver\'s insurer take?', variants: ['How long does the subrogation and recovery process against the at-fault driver\'s insurer take?', 'What is the typical timeframe for your legal team to recover all repair costs from Geico?', 'How many weeks does inter-company subrogation take between insurers?'] },
                { incoming: 'Subrogation takes 4 to 8 weeks behind the scenes, but your repairs proceed with zero delays.', taskRu: 'Прекрасно, главное, чтобы мой автомобиль был отремонтирован качественно и в срок.', hintSkeleton: 'Wonderful, the most important thing is that my vehicle is repaired properly and on schedule.', variants: ['Wonderful, the most important thing is that my vehicle is repaired properly and on schedule.', 'Great, my main priority is quality OEM repairs and getting the car back without delay.', 'Excellent, as long as the repair work meets factory standards and finishes on time.'] },
                { incoming: 'All repairs completed through certified facilities carry a lifetime craftsmanship warranty.', taskRu: 'Я загрузил видеозапись с регистратора и фотографии повреждений в приложение.', hintSkeleton: 'I have uploaded the dashcam video footage and damage photographs into the app.', variants: ['I have uploaded the dashcam video footage and damage photographs into the app.', 'I just submitted the dashcam video files and collision pictures through the mobile portal.', 'Done, the video clip showing the impact and photos of the shattered headlight are uploaded.'] },
                { incoming: 'Files received! The video is crystal clear — the Geico vehicle backed out without stopping. Case locked.', taskRu: 'Спасибо за подробные разъяснения и оперативное согласование подменного автомобиля, Брайан!', hintSkeleton: 'Thank you for the detailed explanations and swift rental car authorization, Brian!', variants: ['Thank you for the detailed explanations and swift rental car authorization, Brian!', 'Thanks a lot for handling the claim so smoothly and waiving the deductible upfront, Brian!', 'Much appreciated Brian, outstanding claims service. You made a stressful collision very manageable.'] },
                { incoming: 'That is what we are here for. The Enterprise shuttle will meet you at the body shop tomorrow at 9 am.', taskRu: 'Отлично. Спасибо за помощь, хорошего вам рабочего дня и продуктивного дежурства!', hintSkeleton: 'Great. Thank you for the assistance, have a wonderful workday and productive shift!', variants: ['Great. Thank you for the assistance, have a wonderful workday and productive shift!', 'Awesome. Thanks again for your guidance Brian, have a great afternoon!', 'Understood. Thank you Brian, take care and have a pleasant rest of your week!'] }
            ]},
            { id: 27, avatar: '📲', title: '28. 📲 Ремонт смартфона', desc: 'Разбитый экран OLED, перенос True Tone, сохранение Face ID, замена аккумулятора и гарантия', name: 'Leo (iRepair Technician)', steps: [
                { incoming: 'Hey! Cracked front glass on your iPhone 14 Pro? Let me take a look.', taskRu: 'Сенсор все еще работает, но стекло полностью разбито после падения на асфальт.', hintSkeleton: 'The touch sensor still works, but the glass is completely shattered after dropping on asphalt.', variants: ['The touchscreen still works, but the glass is completely shattered after falling on asphalt.', 'The touch sensor still works, but the screen is shattered from dropping it on asphalt.', 'Touch is working fine, but the glass shattered completely when I dropped it.'], exp: 'Touchscreen still works + completely shattered.' },
                { incoming: 'We can install an OEM OLED panel in 45 minutes for $180. Any questions before we start?', taskRu: 'Останутся ли все мои личные данные и фотографии нетронутыми при замене экрана?', hintSkeleton: 'Will all my personal data and photos remain intact during the screen replacement?', variants: ['Will all my personal data and photos remain intact during the screen replacement?', 'Will my personal data and photos be safe during the repair?', 'Will all my photos and data stay untouched while you replace the screen?'], exp: 'Remain intact = остаться в целости и сохранности.' },
                { incoming: 'Hardware screen replacement never touches user NAND storage; your data stays 100% untouched.', taskRu: 'Устанавливаете ли вы оригинальную матрицу OLED или дешевую копию LCD?', hintSkeleton: 'Do you install a genuine original OLED display or a cheap aftermarket LCD copy?', variants: ['Do you install a genuine original OLED display or a cheap aftermarket LCD copy?', 'Is the replacement screen an original refurbished Apple OLED panel or a generic LCD?', 'Do you use genuine OEM OLED panels or third-party aftermarket displays?'] },
                { incoming: 'We use genuine refurbished OEM Super Retina XDR OLEDs. Contrast and 120Hz ProMotion remain identical.', taskRu: 'В чем разница в цветопередаче и яркости между оригинальной панелью и неоригинальной копией?', hintSkeleton: 'What is the difference in color accuracy and brightness between an OEM panel and an aftermarket copy?', variants: ['What is the difference in color accuracy and brightness between an OEM panel and an aftermarket copy?', 'How does an original OLED differ from cheap aftermarket screens in peak brightness and color gamut?', 'What makes the genuine OEM panel superior to aftermarket display copies in outdoor visibility?'] },
                { incoming: 'Aftermarket LCDs drain 30% more battery, have thick bezels, washed-out blacks, and lack 120Hz.', taskRu: 'Я определенно выбираю оригинальную OLED-матрицу с глубоким черным цветом и частотой 120 герц.', hintSkeleton: 'I definitely choose the genuine original OLED panel with deep blacks and 120Hz refresh rate.', variants: ['I definitely choose the genuine original OLED panel with deep blacks and 120Hz refresh rate.', 'I certainly prefer the authentic OEM OLED screen with true black levels and ProMotion support.', 'I will definitely go with the genuine refurbished OLED to preserve 120Hz smoothness and battery life.'] },
                { incoming: 'Wise choice. Will you need True Tone calibration transferred from your cracked display?', taskRu: 'Можете ли вы перенести калибровку True Tone с помощью специального программатора микросхем?', hintSkeleton: 'Can you transfer the True Tone calibration using a dedicated EEPROM chip programmer?', variants: ['Can you transfer the True Tone calibration using a dedicated EEPROM chip programmer?', 'Are you able to copy the True Tone data from the old screen using an EEPROM programming tool?', 'Can you reprogram the ambient sensor firmware so True Tone continues working in settings?'] },
                { incoming: 'We read the serial from your broken screen and write it to the new IC chip so True Tone stays active.', taskRu: 'Будет ли датчик распознавания лица Face ID работать так же безупречно после замены стекла?', hintSkeleton: 'Will the Face ID facial recognition sensor continue functioning just as flawlessly after the glass swap?', variants: ['Will the Face ID facial recognition sensor continue functioning just as flawlessly after the glass swap?', 'Does Face ID biometric authentication remain completely operational after installing the new screen?', 'Will replacing the front assembly break or disable my Face ID functionality in any way?'] },
                { incoming: 'We meticulously transplant the original ear speaker flex cable containing the paired flood illuminator under a microscope.', taskRu: 'Шлейф датчиков приближения и освещенности крайне хрупкий, пожалуйста, будьте осторожны.', hintSkeleton: 'The proximity and ambient light sensor flex cable is extremely delicate, please handle with care.', variants: ['The proximity and ambient light sensor flex cable is extremely delicate, please handle with care.', 'The ear speaker sensor ribbon is very fragile, please transfer it carefully under the microscope.', 'Please exercise extreme caution with the sensor flex cable so the paired Face ID logic isn\'t damaged.'] },
                { incoming: 'Our technicians have micro-soldering certification; we haven\'t damaged a sensor flex in 5 years.', taskRu: 'Наклеите ли вы новую водонепроницаемую клеевую прокладку по периметру корпуса перед сборкой?', hintSkeleton: 'Will you apply a new waterproof adhesive gasket seal around the frame perimeter before reassembly?', variants: ['Will you apply a new waterproof adhesive gasket seal around the frame perimeter before reassembly?', 'Do you install a factory water-resistant seal around the chassis edges before closing the phone?', 'Will the phone receive a replacement dust and water seal gasket during the assembly stage?'] },
                { incoming: 'Yes, we clean off the old degraded adhesive and press a laser-cut waterproof gasket into the chassis.', taskRu: 'Я понимаю, что нырять с телефоном нельзя, но защита от брызг дождя для меня критически важна.', hintSkeleton: 'I understand diving with the phone is not recommended, but splash resistance against rain is critical.', variants: ['I understand diving with the phone is not recommended, but splash resistance against rain is critical.', 'I know it won\'t be submarine waterproof, but resistance to accidental spills and rain is essential.', 'Understood regarding swimming, but rain and splash ingress protection is very important to me.'] },
                { incoming: 'It restores original IP68 splash and dust ingress protection. While open, want me to test the battery health?', taskRu: 'Да, проверьте, пожалуйста, остаточную емкость аккумулятора и количество циклов зарядки.', hintSkeleton: 'Yes, please check the remaining battery capacity and the number of charge cycles.', variants: ['Yes, please check the remaining battery capacity and the number of charge cycles.', 'Could you inspect the battery health percentage and cycle count while the chassis is open?', 'Yes please, test the battery health and see how many discharge cycles it has accumulated.'] },
                { incoming: 'Your battery has 920 cycles and maximum capacity is down to 77%. iOS shows "Service Recommended".', taskRu: 'Сколько будет стоить замена изношенного аккумулятора на новый прямо сейчас?', hintSkeleton: 'How much would it cost to replace the worn-out battery with a brand-new one right now?', variants: ['How much would it cost to replace the worn-out battery with a brand-new one right now?', 'What is the price to swap in a fresh battery while the phone is already taken apart?', 'How much extra does a new high-capacity battery cost if installed simultaneously?'] },
                { incoming: 'Normally a battery swap is $85, but bundled with a screen repair today, I can do it for $50.', taskRu: 'Предупредит ли операционная система iOS о неизвестной детали в настройках после замены батареи?', hintSkeleton: 'Will the iOS operating system display an "Unknown Part" warning in settings after the battery swap?', variants: ['Will the iOS operating system display an "Unknown Part" warning in settings after the battery swap?', 'Will a non-genuine battery message appear in the iOS battery health menu after replacement?', 'Does replacing the cell trigger an Apple warning banner saying Unknown Battery Component?'] },
                { incoming: 'We transplant the original Battery Management System (BMS) logic board and spot-weld it to remove warnings.', taskRu: 'Вы перенесете оригинальный контроллер питания со старого аккумулятора на новую банку?', hintSkeleton: 'Will you transplant the original power controller board from the old battery to the new cell?', variants: ['Will you transplant the original power controller board from the old battery to the new cell?', 'Do you spot-weld the original OEM BMS tag-on board onto the new battery cell?', 'Are you going to micro-weld the original battery controller chip to preserve 100% health reading?'] },
                { incoming: 'Spot-welding the original BMS board allows us to reprogram the cycle counter to zero and health to 100%.', taskRu: 'Отлично, давайте заменим и экран, и аккумулятор одновременно со скидкой.', hintSkeleton: 'Awesome, let us replace both the screen and the battery simultaneously with the discount.', variants: ['Awesome, let us replace both the screen and the battery simultaneously with the discount.', 'Great, go ahead with both the OEM display and the battery transplant together.', 'Perfect, please replace the screen and install the new battery cell under the bundle deal.'] },
                { incoming: 'Total is $180 for the OEM OLED plus $50 for the battery. What warranty period is included?', taskRu: 'Какой гарантийный срок предоставляется на установленный экран, аккумулятор и работу мастера?', hintSkeleton: 'What warranty period is provided for the installed screen, battery, and technician labor?', variants: ['What warranty period is provided for the installed screen, battery, and technician labor?', 'What kind of warranty coverage do you offer on the replacement display and battery cell?', 'How long does your repair warranty last on parts and labor?'] },
                { incoming: 'We provide a 12-month nationwide warranty on the OLED screen and a 6-month warranty on the battery.', taskRu: 'Покрывает ли годовая гарантия самопроизвольные фантомные нажатия сенсора и полосы на матрице?', hintSkeleton: 'Does the 12-month warranty cover spontaneous phantom touch ghosting and display lines?', variants: ['Does the 12-month warranty cover spontaneous phantom touch ghosting and display lines?', 'Does your screen warranty protect against touch unresponsiveness and vertical color lines?', 'Are ghost touches, touch dead zones, and OLED flicker covered under the one-year warranty?'] },
                { incoming: 'Any touch failure, ghost touches, or vertical lines without external glass cracks are covered 100%.', taskRu: 'Можете ли вы наклеить качественное защитное стекло девять-аш с закругленными краями после ремонта?', hintSkeleton: 'Can you install a high-quality 9H tempered glass screen protector with curved edges after the repair?', variants: ['Can you install a high-quality 9H tempered glass screen protector with curved edges after the repair?', 'Could you apply an edge-to-edge 9H tempered glass protector once the screen is installed?', 'Will you install a scratch-resistant 9H glass protector with oleophobic coating on the new display?'] },
                { incoming: 'I will apply an edge-to-edge 9H tempered glass protector with oleophobic coating for free.', taskRu: 'Это очень щедрое предложение, спасибо! Сколько времени займет весь сложный ремонт?', hintSkeleton: 'That is a very generous offer, thank you! How much time will the entire complex repair take?', variants: ['That is a very generous offer, thank you! How much time will the entire complex repair take?', 'That\'s very kind of you, thanks! What is the estimated turnaround time for the screen and battery?', 'Much appreciated! How long should I wait for the display swap, spot-welding, and waterproofing?'] },
                { incoming: 'With the battery spot-welding and True Tone programming, total repair time is 55 minutes.', taskRu: 'Я отойду выпить кофе в пекарню за углом и вернусь через один час.', hintSkeleton: 'I will step out for coffee at the bakery around the corner and return in one hour.', variants: ['I will step out for coffee at the bakery around the corner and return in one hour.', 'I\'m going to grab an espresso at the cafe nearby and come back in 60 minutes.', 'I\'ll step outside to a nearby coffee shop and be back in approximately one hour.'] },
                { incoming: 'Here is your repair claim ticket #419. You can leave your phone unlocked or in Repair Mode.', taskRu: 'Я перевел смартфон в сервисный режим с ограниченным доступом к личным данным.', hintSkeleton: 'I placed the smartphone into Repair Mode with restricted access to personal data.', variants: ['I placed the smartphone into Repair Mode with restricted access to personal data.', 'I enabled Apple Repair Mode so my personal photos and banking apps remain locked.', 'The phone is locked in Maintenance Mode, biometric access is temporarily restricted.'] },
                { incoming: 'Repair Mode is perfect, it allows hardware touch diagnostics without unlocking your gallery.', taskRu: 'Вот мой телефон. Я уверен в вашем профессионализме, Лео, увидимся через час!', hintSkeleton: 'Here is my phone. I have full confidence in your professionalism, Leo, see you in an hour!', variants: ['Here is my phone. I have full confidence in your professionalism, Leo, see you in an hour!', 'Here is the device. I trust your micro-soldering expertise Leo, see you in 60 minutes!', 'Handing you the phone. Thanks for explaining the process so clearly Leo, see you shortly!'] },
                { incoming: 'I am starting on the heated separation mat right now. See you at 3:15 pm!', taskRu: 'Договорились, спасибо за внимание к деталям и аккуратность. До скорой встречи!', hintSkeleton: 'Deal, thank you for your attention to detail and care. See you very soon!', variants: ['Deal, thank you for your attention to detail and care. See you very soon!', 'Understood, thanks for being so meticulous. Talk to you in an hour Leo!', 'All set, appreciate the thorough service. See you at quarter past three!'] }
            ]},
            { id: 28, avatar: '🧼', title: '29. 🧼 Детейлинг автомойка', desc: 'Химчистка вишневого сока, озонирование, перфорированная кожа Наппа и керамическое покрытие', name: 'Dmitri (Auto Spa)', steps: [
                { incoming: 'Welcome to Sparkle Auto Spa! Are you looking for a basic exterior wash or interior detailing?', taskRu: 'Мне нужна глубокая химчистка задних сидений, так как ребенок пролил вишневый сок.', hintSkeleton: 'I need a deep steam cleaning for the back seats because my kid spilled cherry juice.', variants: ['I need a deep shampoo cleaning for the back seats because my kid spilled cherry juice.', 'I need deep interior detailing for the rear seats because my child spilled cherry juice.', 'I need deep steam cleaning on the back seats as my child spilled cherry juice.'], exp: 'Deep steam/shampoo cleaning + spilled juice.' },
                { incoming: 'Cherry stains can set fast, but our enzyme extraction will lift them completely. Need leather conditioning too?', taskRu: 'Да, обработайте кожу кондиционером и пропылесосьте багажник, пожалуйста.', hintSkeleton: 'Yes, please condition the leather and vacuum the trunk as well.', variants: ['Yes, please condition the leather and vacuum the trunk as well.', 'Yes please apply leather conditioner and vacuum the boot.', 'Yes, condition the leather seats and vacuum out the trunk please.'], exp: 'Condition the leather + vacuum the trunk.' },
                { incoming: 'What kind of leather is fitted on the seats: pigmented grain leather or semi-aniline Nappa?', taskRu: 'В салоне установлена светлая перфорированная кожа Наппа цвета слоновой кости.', hintSkeleton: 'The interior is equipped with light ivory perforated Nappa leather.', variants: ['The interior is equipped with light ivory perforated Nappa leather.', 'It has delicate beige perforated Nappa leather upholstery.', 'The seats are covered in ivory-colored perforated Nappa leather.'] },
                { incoming: 'Perforated Nappa requires extreme care so cleaning foam doesn\'t saturate the foam cushions below.', taskRu: 'Растворяет ли ваш энзимный очиститель пятна фруктового танина, не повреждая деликатную кожу?', hintSkeleton: 'Does your enzyme cleaner dissolve fruit tannin stains without damaging delicate leather?', variants: ['Does your enzyme cleaner dissolve fruit tannin stains without damaging delicate leather?', 'Can your enzyme formula safely break down cherry fruit tannins without stripping the dye?', 'Will the specialized enzyme stain remover lift fruit sugars without harming Nappa leather?'] },
                { incoming: 'Our pH-neutral organic enzyme cleaner safely breaks down organic sugars without stripping natural leather oils.', taskRu: 'Пожалуйста, избегайте едких щелочных растворителей, которые могут смыть защитное заводское покрытие.', hintSkeleton: 'Please avoid harsh alkaline solvents that could strip the factory protective topcoat.', variants: ['Please avoid harsh alkaline solvents that could strip the factory protective topcoat.', 'Make sure not to use aggressive alkaline cleaners that might dissolve the leather clear coat.', 'Please ensure no harsh chemicals or solvents are used that could degrade the factory finish.'] },
                { incoming: 'We use dedicated Swissvax leather cleaners with horsehair brushes to agitate pores gently.', taskRu: 'Можете ли вы использовать сухой пар низкой влажности вместо обильного заливания сидений водой?', hintSkeleton: 'Can you use low-moisture dry steam rather than flooding the seats with water?', variants: ['Can you use low-moisture dry steam rather than flooding the seats with water?', 'Could you extract using dry vapor steam instead of soaking the ventilated seat cushions?', 'Please use low-moisture steam extraction so excess liquid doesn\'t saturate the perforations.'] },
                { incoming: 'Dry vapor steam at 170 degrees sanitizes and lifts pigment without wetting the internal cushion foam.', taskRu: 'Внутри сидений встроены вентиляторы охлаждения и электрические маты подогрева.', hintSkeleton: 'There are cooling ventilation fans and electric heating elements built inside the seats.', variants: ['There are cooling ventilation fans and electric heating elements built inside the seats.', 'The seats have active ventilation fans and electronic heating grids inside the cushions.', 'Both heating elements and ventilation motors are housed beneath the perforated leather.'] },
                { incoming: 'We isolate electrical components and use vacuum extraction simultaneously to keep electronics bone dry.', taskRu: 'Наносите ли вы матовый защитный кондиционер, который не оставляет жирного блеска?', hintSkeleton: 'Do you apply a dedicated matte leather conditioner that leaves zero greasy shine?', variants: ['Do you apply a dedicated matte leather conditioner that leaves zero greasy shine?', 'Does your leather balm dry to an OEM factory matte finish without greasy residue?', 'Will the leather protection cream leave an authentic non-slippery, matte satin look?'] },
                { incoming: 'Our ceramic leather barrier leaves a 100% factory matte touch that repels future dye transfers from jeans.', taskRu: 'Я терпеть не могу скользкую жирную кожу, салон должен выглядеть как новый с завода.', hintSkeleton: 'I cannot stand slippery greasy leather, the cabin must look factory fresh and matte.', variants: ['I cannot stand slippery greasy leather, the cabin must look factory fresh and matte.', 'I dislike shiny greasy seats, I want the interior to retain its original supple matte texture.', 'Greasy glossy leather looks terrible, it needs to look exactly like it came out of the showroom.'] },
                { incoming: 'It will look and smell like a brand new luxury vehicle. How about the fabric headliner and sun visors?', taskRu: 'На солнцезащитных козырьках и стойках из алькантары есть несколько грязных отпечатков пальцев.', hintSkeleton: 'There are several dirty finger marks on the sun visors and Alcantara pillar trims.', variants: ['There are several dirty finger marks on the sun visors and Alcantara pillar trims.', 'The sun visors and Alcantara A-pillars have some greasy smudges that need cleaning.', 'There are noticeable handprints on the headliner fabric and Alcantara pillars.'] },
                { incoming: 'We use dedicated Alcantara foam cleaners with microfiber towels to lift grease without matting the fibers.', taskRu: 'Можете ли вы провести озоновую обработку салона для устранения затхлых запахов сырости?', hintSkeleton: 'Can you perform an ozone shock treatment to eliminate musty damp odors from the cabin?', variants: ['Can you perform an ozone shock treatment to eliminate musty damp odors from the cabin?', 'Could you run an ozone generator cycle to sterilize the interior and remove sour smells?', 'Is an ozone odor elimination treatment included to purify the air conditioning ducts?'] },
                { incoming: 'A 30-minute medical ozone generator treatment destroys all bacteria and mold spores inside the HVAC vents.', taskRu: 'Сколько времени потребуется для тщательного проветривания салона после работы озонатора?', hintSkeleton: 'How much time will be required to thoroughly air out the cabin after the ozone machine finishes?', variants: ['How much time will be required to thoroughly air out the cabin after the ozone machine finishes?', 'How long does the vehicle need to ventilate with doors open following the ozone cycle?', 'How many minutes do you air out the car so the residual ozone gas dissipates safely?'] },
                { incoming: 'We ventilate with high-velocity blowers for 25 minutes until the air is fresh and safe to breathe.', taskRu: 'Входит ли глубокая очистка кузова синтетической глиной и нанесение керамического силанта в комплекс?', hintSkeleton: 'Does the package include clay bar paint decontamination and ceramic spray sealant application?', variants: ['Does the package include clay bar paint decontamination and ceramic spray sealant application?', 'Is mechanical clay bar treatment and ceramic hydrophobic sealant included for the exterior?', 'Do you perform clay decontamination to remove industrial fallout followed by a ceramic spray?'] },
                { incoming: 'Our Signature Detailing package includes full iron fallout remover, clay bar prep, and ceramic sealant.', taskRu: 'Кузов автомобиля кажется шероховатым на ощупь из-за битумных пятен и дорожной смолы.', hintSkeleton: 'The vehicle paint feels rough to the touch due to tar spots and industrial fallout.', variants: ['The vehicle paint feels rough to the touch due to tar spots and industrial fallout.', 'The clear coat feels gritty and rough because of embedded brake dust and road tar.', 'The exterior surface has lost its smoothness from environmental fallout and tar splatter.'] },
                { incoming: 'Clay bar treatment pulls all embedded iron particles and tar out of the clear coat, making it glass-smooth.', taskRu: 'Какую марку керамического гидрофобного покрытия вы наносите на кузов автомобиля?', hintSkeleton: 'Which brand of ceramic hydrophobic sealant do you buff onto the vehicle paint?', variants: ['Which brand of ceramic hydrophobic sealant do you buff onto the vehicle paint?', 'What manufacturer of ceramic protective coating do you use for exterior protection?', 'Which professional ceramic sealant is applied to guarantee hydrophobic water beading?'] },
                { incoming: 'We apply Gyeon Q2 CanCoat Pro, giving 12 months of extreme water beading and UV color protection.', taskRu: 'Очистите ли вы колесные диски от въевшейся тормозной пыли и нанесете ли кондиционер на резину?', hintSkeleton: 'Will you clean the wheel rims from baked-on brake dust and apply satin tire dressing?', variants: ['Will you clean the wheel rims from baked-on brake dust and apply satin tire dressing?', 'Do you deep clean alloy wheels with iron remover and apply a matte dressing to tire sidewalls?', 'Will the wheels be decontaminated from metallic dust and the tires dressed with satin conditioner?'] },
                { incoming: 'Acid-free wheel cleaner removes all baked-on metallic dust, and tires get non-sling satin dressing.', taskRu: 'Используется ли очистка моторного отсека сухим льдом или вы моете двигатель вручную?', hintSkeleton: 'Do you use dry ice blasting for engine bay cleaning or do you wash the motor by hand?', variants: ['Do you use dry ice blasting for engine bay cleaning or do you wash the motor by hand?', 'Is the engine compartment cleaned with cryogenic dry ice or hand-wiped with degreaser?', 'Do you clean the engine bay using dry ice detailing or manual brush cleaning?'] },
                { incoming: 'We use cryogenic dry ice blasting for engine bays; it uses zero liquid water and is 100% safe for electronics.', taskRu: 'Сухой лед для проводки — это идеальное решение, никакого риска короткого замыкания.', hintSkeleton: 'Dry ice for electrical wiring is the ideal solution, zero risk of short circuits.', variants: ['Dry ice for electrical wiring is the ideal solution, zero risk of short circuits.', 'Cryogenic cleaning is fantastic because it eliminates any danger of electrical shorts.', 'Dry ice blasting is wonderful for sensitive engine bays, no water damage risk whatsoever.'] },
                { incoming: 'Total package for full interior restoration, ozone, clay bar, Gyeon ceramic, and dry ice is $320.', taskRu: 'Сколько всего часов займет весь полный комплекс детейлинга от начала до конца?', hintSkeleton: 'How many total hours will the complete detailing package take from start to finish?', variants: ['How many total hours will the complete detailing package take from start to finish?', 'What is the total estimated turnaround time for this full interior and exterior makeover?', 'How long will the vehicle need to remain in your shop for all treatments to cure?'] },
                { incoming: 'A full crew of three specialists will need 5 hours. The car will be ready for pickup at 5:30 pm.', taskRu: 'Можете ли вы прислать мне фотографии сидений до и после химчистки в WhatsApp?', hintSkeleton: 'Can you send me high-resolution before-and-after photos of the seats on WhatsApp?', variants: ['Can you send me high-resolution before-and-after photos of the seats on WhatsApp?', 'Could you message me before-and-after pictures of the cherry stain extraction via WhatsApp?', 'Would you mind sending photos showing the leather transformation on WhatsApp when done?'] },

            { id: 29, avatar: '🎂', title: '30. 🎂 Заказ торта у кондитера', desc: 'Безглютеновый бисквит, целиакия, шоколадный ганаш, малина, сусальное золото и доставка', name: 'Claire (Pastry Chef)', steps: [

                { incoming: 'What outer frosting do you prefer: whipped dark ganache or silky Swiss meringue buttercream?', taskRu: 'Какой крем снаружи лучше переносит комнатную температуру на празднике?', hintSkeleton: 'Which exterior frosting holds up better at room temperature during the party?', variants: ['Which exterior frosting holds up better at room temperature during the party?', 'What type of outer cream is most stable at ambient room temperature during an event?', 'Between ganache and Swiss buttercream, which frosting resists melting better on display?'] },

                { incoming: 'Can we tint the buttercream in customized palette colors to match your birthday party decor?', taskRu: 'Основная цветовая гамма праздника — темно-синий с золотым акцентом.', hintSkeleton: 'The primary color theme of the party is navy blue with gold accents.', variants: ['The primary color theme of the party is navy blue with gold accents.', 'Our celebration palette is deep navy blue accompanied by elegant gold elements.', 'The event decor features midnight navy blue with metallic gold highlights.'] },
