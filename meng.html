                { incoming: 'I waited two minutes and knocked on door 4, but there is still no answer inside.', taskRu: 'Видимо, она вышла в аптеку. Можете ли вы перенаправить посылку в автоматический постамат поблизости?', hintSkeleton: 'She probably went to the pharmacy. Can you redirect the parcel to a nearby automated locker?', variants: ['She probably went to the pharmacy. Can you redirect the parcel to a nearby automated locker?', 'She must have stepped out to the drugstore. Is it possible to divert the package to a parcel locker?', 'She might be at the pharmacy. Could you drop the box at a secure automated parcel locker nearby?'] },
                { incoming: 'There is an Amazon Hub locker at the 7-Eleven store two blocks away on Elm Street.', taskRu: 'Это было бы идеально! Пожалуйста, перенаправьте доставку в постамат на улице Элм.', hintSkeleton: 'That would be ideal! Please redirect the delivery to the locker on Elm Street.', variants: ['That would be ideal! Please redirect the delivery to the locker on Elm Street.', 'That sounds perfect! Please divert the parcel to the 7-Eleven Elm Street locker.', 'That works great for me! Please drop it off at the automated locker on Elm Street.'] },
                { incoming: 'Rerouting in progress... System accepted the transfer to Locker "Orion" on Elm Street.', taskRu: 'Сколько календарных дней посылка будет храниться в ячейке постамата до возврата отправителю?', hintSkeleton: 'How many calendar days will the parcel be held in the locker compartment before return to sender?', variants: ['How many calendar days will the parcel be held in the locker compartment before return to sender?', 'How long will the package remain in the automated locker before it gets shipped back?', 'What is the maximum holding period in the parcel locker prior to return to sender?'] },
                { incoming: 'You will have 5 full calendar days to collect the item using your pickup barcode.', taskRu: 'Каким образом я получу шестизначный код доступа или QR-код для открытия ячейки?', hintSkeleton: 'How will I receive the six-digit access code or QR code to open the locker compartment?', variants: ['How will I receive the six-digit access code or QR code to open the locker compartment?', 'In what way will the one-time pickup code or QR barcode be sent to me?', 'How does the system deliver the pickup PIN or barcode required to open the locker?'] },
                { incoming: 'Amazon sends both an email notification and a push notification with a scannable QR code.', taskRu: 'Нужно ли мне будет оплачивать какие-либо таможенные пошлины или сборы при заборе заказа?', hintSkeleton: 'Will I need to pay any customs duties or import taxes upon collecting the order?', variants: ['Will I need to pay any customs duties or import taxes upon collecting the order?', 'Are there any outstanding customs fees or delivery surcharges due at pickup?', 'Do I have to pay import duties or courier handling fees when opening the locker?'] },
                { incoming: 'No fees are due, all import duties and priority courier fees were prepaid by the seller.', taskRu: 'В каком состоянии внешняя картонная коробка, нет ли видимых повреждений или вмятин?', hintSkeleton: 'What condition is the outer cardboard shipping box in, are there any visible dents or tears?', variants: ['What condition is the outer cardboard shipping box in, are there any visible dents or tears?', 'Is the exterior shipping carton intact or does it show signs of crushing or damage?', 'Can you check if the outer packaging is undamaged and sealed properly?'] },
                { incoming: 'The outer box is completely intact, original security tape unbroken, no crushing on the corners.', taskRu: 'Спасибо за проверку, внутри находится дорогой ноутбук с хрупким экраном.', hintSkeleton: 'Thank you for checking, there is an expensive laptop with a fragile screen inside.', variants: ['Thank you for checking, there is an expensive laptop with a fragile screen inside.', 'Thanks for confirming, it contains a high-value laptop with a delicate display.', 'Appreciate you looking, I was concerned because there is a fragile computer inside.'] },
                { incoming: 'I will handle it with extra care. I am loading it into Locker Orion in about 20 minutes.', taskRu: 'В котором часу постамат в магазине 7-Eleven закрывается на ночь?', hintSkeleton: 'At what time does the parcel locker location inside the 7-Eleven close for the night?', variants: ['At what time does the parcel locker location inside the 7-Eleven close for the night?', 'What are the operating hours of that 7-Eleven store, does it close at night?', 'Is the 7-Eleven locker accessible 24/7 or does the store have restricted opening hours?'] },
                { incoming: 'That specific 7-Eleven branch operates 24 hours a day, 7 days a week with security cameras.', taskRu: 'Это превосходно, я смогу забрать посылку сегодня вечером по дороге домой с работы.', hintSkeleton: 'That is excellent, I will be able to retrieve the parcel tonight on my way home from work.', variants: ['That is excellent, I will be able to retrieve the parcel tonight on my way home from work.', 'Fantastic news, that means I can pick up the package on my commute back tonight.', 'Wonderful, I\'ll just swing by the store tonight after my office shift ends.'] },
                { incoming: 'Remember to increase your phone screen brightness when scanning the QR code at the locker kiosk.', taskRu: 'Спасибо за ценную подсказку, я обязательно сделаю экран ярче при сканировании.', hintSkeleton: 'Thank you for the valuable tip, I will certainly turn up the screen brightness when scanning.', variants: ['Thank you for the valuable tip, I will certainly turn up the screen brightness when scanning.', 'Thanks for the helpful advice, I\'ll make sure my phone brightness is at 100 percent.', 'Good to know! I will maximize screen brightness when presenting the barcode.'] },
                { incoming: 'If the scanner ever has trouble reading your screen, you can manually type the 6-digit backup PIN.', taskRu: 'Где в письме с подтверждением будет указан этот резервный цифровой пин-код?', hintSkeleton: 'Where in the confirmation email will this backup numeric PIN code be located?', variants: ['Where in the confirmation email will this backup numeric PIN code be located?', 'Where on the pickup notification can I find the manual 6-digit backup code?', 'In which section of the delivery email is the backup entry PIN printed?'] },
                { incoming: 'It is printed in bold font directly beneath the large black-and-white QR barcode image.', taskRu: 'Понял, всё предельно ясно. Спасибо за ваше терпение и помощь в поиске решения!', hintSkeleton: 'Understood, everything is crystal clear. Thank you for your patience and finding a solution!', variants: ['Understood, everything is crystal clear. Thank you for your patience and finding a solution!', 'Got it, perfectly clear. I really appreciate your patience and flexibility today, Carlos!', 'Understood. Thanks so much for taking the time to reroute the parcel safely for me!'] },
                { incoming: 'Package successfully deposited in Locker #14! You should have received the notification just now.', taskRu: 'Да, push-уведомление с QR-кодом только что пришло на мой экран. Всё сработало!', hintSkeleton: 'Yes, the push notification with the QR code just popped up on my screen. It all worked!', variants: ['Yes, the push notification with the QR code just popped up on my screen. It all worked!', 'Confirmed, I just received the text and email with the locker QR barcode. Perfect!', 'Yes! The notification with the pickup code arrived on my phone right now. Excellent!'] },
                { incoming: 'Glad we could get it sorted out without delays. Enjoy your new laptop and have a great evening!', taskRu: 'Спасибо за безупречную работу, Карлос! Удачи вам на маршруте и хорошего завершения смены!', hintSkeleton: 'Thank you for the flawless work, Carlos! Best of luck on your route and have a great shift!', variants: ['Thank you for the flawless work, Carlos! Best of luck on your route and have a great shift!', 'Thanks for your top-tier service Carlos! Drive safe on the rest of your deliveries today!', 'Much appreciated Carlos, outstanding courier service. Take care and have a pleasant evening!'] }
            ]},
            { id: 17, avatar: '🐶', title: '18. 🐶 Прием в ветклинике', desc: 'Проглоченная кость, седация, рентген, риск перфорации и экстренная операция', name: 'Dr. Bell (Veterinarian)', steps: [
                { incoming: 'Animal Care Emergency. What brings your pet in this afternoon?', taskRu: 'Моя собака проглотила куриную кость вчера и сегодня отказывается от еды.', hintSkeleton: 'My dog swallowed a chicken bone yesterday and is refusing to eat today.', variants: ['My dog swallowed a chicken bone yesterday and is refusing to eat today.', 'My dog swallowed a chicken bone yesterday and has refused to eat all day.', 'My dog swallowed a bone yesterday and won\'t eat anything today.'], exp: 'Swallowed a bone + is refusing to eat.' },
                { incoming: 'Chicken bones can splinter and cause an obstruction. We need to take an immediate X-ray.', taskRu: 'Сколько займет рентген и опасна ли эта процедура?', hintSkeleton: 'How long will the X-ray take and is the procedure dangerous?', variants: ['How long will the X-ray take and is the procedure dangerous?', 'How long does the X-ray take and is it dangerous for the dog?', 'How long will the X-ray take and are there any risks?'], exp: 'How long will it take + is it dangerous.' },
                { incoming: 'The digital radiograph takes 10 minutes and radiation exposure is minimal. Has he been vomiting?', taskRu: 'Утром он выпил немного воды, но через двадцать минут его вырвало желтой пеной.', hintSkeleton: 'This morning he drank a little water, but vomited yellowish foam twenty minutes later.', variants: ['This morning he drank a little water, but vomited yellowish foam twenty minutes later.', 'He had some water early today, but threw up yellow bile twenty minutes afterwards.', 'He tried to drink water this morning, but brought up yellowish foam shortly after.'] },
                { incoming: 'Persistent vomiting of bile indicates a complete mechanical blockage in the gastrointestinal tract.', taskRu: 'Показывает ли ручная пальпация его живота острую боль или мышечное напряжение?', hintSkeleton: 'Does manual palpation of his abdomen indicate acute pain or muscle guarding?', variants: ['Does manual palpation of his abdomen indicate acute pain or muscle guarding?', 'Is his stomach tender or painful when you press on the abdomen?', 'Does he react with pain when you palpate his abdominal cavity?'] },
                { incoming: 'His cranial abdomen is extremely rigid and painful to the touch. Let me get him onto the X-ray table.', taskRu: 'Потребуется ли седативный укол для фиксации собаки во время рентгеновского снимка?', hintSkeleton: 'Will a light sedative injection be required to keep the dog still during the X-ray?', variants: ['Will a light sedative injection be required to keep the dog still during the X-ray?', 'Do you need to administer a mild sedative so he remains motionless on the table?', 'Will light sedation be necessary to obtain clear diagnostic radiographs?'] },
                { incoming: 'A mild reversible sedative will keep him calm and pain-free while we take two orthogonal views.', taskRu: 'Может ли вареная кость расщепиться на острые осколки и проткнуть стенку кишечника?', hintSkeleton: 'Can a cooked bone splinter into sharp fragments and perforate the intestinal wall?', variants: ['Can a cooked bone splinter into sharp fragments and perforate the intestinal wall?', 'Is there a danger that the brittle cooked bone will puncture his stomach lining?', 'Could the sharp bone shards cause a perforation of the bowel wall?'] },
                { incoming: 'Cooked bones become brittle and frequently cause life-threatening intestinal punctures and peritonitis.', taskRu: 'Пожалуйста, проверьте также пищевод и желудок на снимках, помимо тонкого кишечника.', hintSkeleton: 'Please check the esophagus and stomach on the scans as well, in addition to the small intestine.', variants: ['Please check the esophagus and stomach on the scans as well, in addition to the small intestine.', 'Make sure the radiograph covers the entire tract from the esophagus down through the bowel.', 'Please inspect his throat, stomach cavity, and intestines on the digital images.'] },
                { incoming: 'Looking at the X-rays now... There is a dense, jagged 4-centimeter bone shard lodged in the duodenum.', taskRu: 'Возможно ли извлечь этот осколок эндоскопически через пищевод без полостной операции?', hintSkeleton: 'Is it possible to retrieve this shard endoscopically without open abdominal surgery?', variants: ['Is it possible to retrieve this shard endoscopically without open abdominal surgery?', 'Could an endoscope with grasping forceps reach the bone fragment through the stomach?', 'Can you remove the obstruction via endoscopy or is invasive surgery unavoidable?'] },
                { incoming: 'It has passed beyond the pyloric sphincter into the duodenum; endoscopy cannot safely reach it without tearing.', taskRu: 'Означает ли это, что срочное хирургическое вмешательство является единственным выходом?', hintSkeleton: 'Does that mean urgent surgical intervention is the only viable option?', variants: ['Does that mean urgent surgical intervention is the only viable option?', 'So open abdominal surgery is the only way to save him from perforation?', 'Does that make an emergency enterotomy procedure absolutely mandatory right now?'] },
                { incoming: 'Yes, an emergency enterotomy must be performed before the sharp edge causes septic peritonitis.', taskRu: 'Каковы основные хирургические риски и процент успешного исхода при такой операции?', hintSkeleton: 'What are the primary surgical risks and the success rate for such a procedure?', variants: ['What are the primary surgical risks and the success rate for such a procedure?', 'What are the main complications associated with this surgery and what is the survival rate?', 'How risky is this emergency bowel surgery and what is the typical prognosis?'] },
                { incoming: 'With early intervention like today, success rates exceed 95%. Main risks are anesthesia and infection.', taskRu: 'Будет ли квалифицированный анестезиолог непрерывно следить за показателями его жизнедеятельности?', hintSkeleton: 'Will a qualified veterinary anesthesiologist continuously monitor his vital signs?', variants: ['Will a qualified veterinary anesthesiologist continuously monitor his vital signs?', 'Is there a dedicated nurse monitoring heart rate, oxygen, and blood pressure under anesthesia?', 'Will his vital parameters be constantly tracked by an anesthesia specialist throughout surgery?'] },
                { incoming: 'Our licensed veterinary technician monitors pulse oximetry, ECG, and blood pressure every 5 minutes.', taskRu: 'Какие предоперационные анализы крови необходимо взять перед погружением в наркоз?', hintSkeleton: 'What pre-operative blood tests must be drawn before inducing general anesthesia?', variants: ['What pre-operative blood tests must be drawn before inducing general anesthesia?', 'Which blood panels do you need to run to evaluate his organ function before surgery?', 'Are pre-anesthetic blood tests required to check liver and kidney parameters?'] },
                { incoming: 'A comprehensive chemistry panel and CBC to evaluate liver enzymes, kidneys, and red blood cells.', taskRu: 'Сколько времени займет получение результатов экспресс-биохимии крови в вашей лаборатории?', hintSkeleton: 'How long will it take to get the in-house blood chemistry results in your lab?', variants: ['How long will it take to get the in-house blood chemistry results in your lab?', 'How much time does your in-clinic laboratory need to run the pre-op blood panel?', 'How soon will the blood work findings be ready for the surgeon to review?'] },
                { incoming: 'Our in-house Idexx analyzers generate complete diagnostic results in just 12 minutes.', taskRu: 'Пожалуйста, сделайте полный анализ крови немедленно, я даю согласие на операцию.', hintSkeleton: 'Please run the complete blood work immediately, I give full consent for the surgery.', variants: ['Please run the complete blood work immediately, I give full consent for the surgery.', 'Go ahead with the comprehensive blood tests right away, I authorize the emergency procedure.', 'Please draw the blood immediately, I sign the surgical and anesthetic consent form.'] },
                { incoming: 'Blood work is pristine — kidneys and liver are 100% healthy. We are moving him into the sterile OR now.', taskRu: 'Сколько примерно времени продлится операция от первого разреза до наложения швов?', hintSkeleton: 'Approximately how long will the operation last from the initial incision to closing stitches?', variants: ['Approximately how long will the operation last from the initial incision to closing stitches?', 'How much time will the surgical procedure take from start to final suture?', 'What is the estimated duration of the surgery from opening to closure?'] },
                { incoming: 'The surgery will take approximately 75 to 90 minutes. Will you wait in our consultation lounge?', taskRu: 'Да, я останусь в зале ожидания. Смогу ли я навестить его в стационаре после пробуждения?', hintSkeleton: 'Yes, I will remain in the waiting lounge. Will I be able to visit him in recovery once he wakes up?', variants: ['Yes, I will remain in the waiting lounge. Will I be able to visit him in recovery once he wakes up?', 'I will stay here in the clinic. Can I see him in the ICU ward after extubation?', 'Yes, I\'ll wait right here. Is visiting allowed once he regains consciousness?'] },
                { incoming: 'Once he is extubated and resting under warm blankets, you can sit with him for 20 minutes.', taskRu: 'Потребуется ли ему остаться в круглосуточном стационаре под капельницей на ночь?', hintSkeleton: 'Will he need to stay in the 24-hour intensive care ward on IV fluids overnight?', variants: ['Will he need to stay in the 24-hour intensive care ward on IV fluids overnight?', 'Does he have to remain hospitalized overnight on intravenous fluid therapy?', 'Is overnight hospitalization necessary for post-operative monitoring and IV antibiotics?'] },
                { incoming: 'Overnight monitoring ensures pain control and watches for internal leakage. Do you have pet insurance?', taskRu: 'Да, у меня оформлена комплексная страховка с девяностопроцентным покрытием расходов.', hintSkeleton: 'Yes, I have comprehensive pet health insurance with ninety percent reimbursement coverage.', variants: ['Yes, I have comprehensive pet health insurance with ninety percent reimbursement coverage.', 'Yes, my dog is covered under a premium pet insurance policy with 90% reimbursement.', 'I carry comprehensive pet insurance that pays 90% of emergency surgical costs.'] },
                { incoming: 'We can submit a direct claim to Trupanion or provide an itemized invoice with clinical notes.', taskRu: 'Пожалуйста, распечатайте подробный счет со всеми клиническими выписками для страховой компании.', hintSkeleton: 'Please print an itemized invoice along with all clinical medical notes for the insurance company.', variants: ['Please print an itemized invoice along with all clinical medical notes for the insurance company.', 'Could you provide a detailed itemized bill and diagnostic summary for my claim submission?', 'Please prepare the complete medical record and itemized invoice for my insurer.'] },
                { incoming: 'Anesthesia induction is starting. He is in expert hands. I will come out as soon as the bone is removed!', taskRu: 'Спасибо вам огромное, доктор Белл. Спасите моего верного друга, я молюсь за него!', hintSkeleton: 'Thank you so much, Doctor Bell. Please save my loyal friend, I am praying for him!', variants: ['Thank you so much, Doctor Bell. Please save my loyal friend, I am praying for him!', 'Thanks from the bottom of my heart Doctor Bell. Take care of my boy, I trust you completely!', 'Thank you Doctor Bell, please do your best for him. I\'ll be right here waiting for good news!'] }
            ]},
            { id: 18, avatar: '🏢', title: '19. 🏢 Аренда коворкинга', desc: 'Переговорная комната, переходники 4K, гигабитный Wi-Fi, шумоизоляция и кейтеринг', name: 'Sophie (Community Manager)', steps: [
                { incoming: 'Hi there! Looking to book one of our meeting rooms for your team today?', taskRu: 'Мне нужна переговорка на четырех человек с двух до четырех часов дня.', hintSkeleton: 'I need a meeting room for four people from two to four pm.', variants: ['I need a meeting room for four people from two to four pm.', 'I\'d like to book a meeting room for four people from 2 to 4 pm.', 'We need a conference room for four people between two and four pm.'], exp: 'Meeting room for four people from 2 to 4 pm.' },
                { incoming: 'Room B is open during that slot. It comes equipped with a 4K display and high-speed Wi-Fi.', taskRu: 'Включены ли кофе и вода для моих гостей в стоимость аренды?', hintSkeleton: 'Are coffee and water for my guests included in the rental price?', variants: ['Are coffee and water for my guests included in the rental price?', 'Is complimentary coffee and water for my guests included?', 'Are coffee and drinking water included in the price for my guests?'], exp: 'Included in the rental price = включено в стоимость.' },
                { incoming: 'Unlimited barista coffee, specialty teas, and filtered sparkling water are free for all attendees.', taskRu: 'Имеются ли в переговорке универсальные адаптеры HDMI и USB-C для ноутбуков Apple?', hintSkeleton: 'Does the meeting room have universal HDMI and USB-C adapters for Apple laptops?', variants: ['Does the meeting room have universal HDMI and USB-C adapters for Apple laptops?', 'Are there USB-C and HDMI dongles available on the conference table for MacBooks?', 'Does the setup include video display adapters compatible with modern Apple laptops?'] },
                { incoming: 'We have built-in pop-up tabletop hubs with HDMI, USB-C, and Lightning cables. Need screen sharing?', taskRu: 'Поддерживает ли телевизор беспроводную трансляцию экрана через протоколы AirPlay и Miracast?', hintSkeleton: 'Does the TV display support wireless screen mirroring via AirPlay and Miracast?', variants: ['Does the TV display support wireless screen mirroring via AirPlay and Miracast?', 'Can we mirror our laptop screens wirelessly using Apple AirPlay or Google Cast?', 'Is wireless presentation supported on that 4K display without plugging in cables?'] },
                { incoming: 'Yes, our smart display supports one-click AirPlay, Miracast, and Barco ClickShare. What is your group size?', taskRu: 'Нас будет четверо коллег, плюс три внешних клиента присоединятся к нам позже.', hintSkeleton: 'There will be four of us colleagues, plus three external clients will join us later.', variants: ['There will be four of us colleagues, plus three external clients will join us later.', 'We have 4 internal team members, and 3 external business partners will arrive later.', 'Our core group is four people, but three clients will be attending the presentation in person.'] },
                { incoming: 'Room B comfortably seats up to 8 people around an executive oak table. Need conference audio?', taskRu: 'Предоставляется ли круговой спикерфон с шумоподавлением для звонков по Zoom?', hintSkeleton: 'Is a conference speakerphone with noise cancellation provided for Zoom video calls?', variants: ['Is a conference speakerphone with noise cancellation provided for Zoom video calls?', 'Do you have an omnidirectional conference mic and speaker for virtual hybrid meetings?', 'Is there a Jabra or Logitech conference speakerphone available in Room B for Zoom calls?'] },
                { incoming: 'A high-end Jabra Speak 750 omnidirectional puck is permanently docked on the table.', taskRu: 'Обладают ли стеклянные перегородки достаточной шумоизоляцией для конфиденциальных бесед?', hintSkeleton: 'Do the glass partitions provide sufficient acoustic soundproofing for confidential discussions?', variants: ['Do the glass partitions provide sufficient acoustic soundproofing for confidential discussions?', 'Is Room B fully soundproofed so confidential client conversations cannot be overheard outside?', 'Are the meeting room walls acoustically treated to ensure private financial discussions?'] },
                { incoming: 'The room features double-glazed acoustic acoustic glass rated at 48 decibels of noise isolation.', taskRu: 'Есть ли внутри настенная маркерная доска и свежие маркеры разных цветов для мозгового штурма?', hintSkeleton: 'Is there a magnetic whiteboard inside with fresh multicolored markers for brainstorming?', variants: ['Is there a magnetic whiteboard inside with fresh multicolored markers for brainstorming?', 'Does the room come equipped with a dry-erase whiteboard and erasers for ideation?', 'Is there a full-wall whiteboard available with dry-erase pens for team sketching?'] },
                { incoming: 'A large glass whiteboard with a full set of fresh neon markers and erasers is ready.', taskRu: 'Какова реальная скорость входящего и исходящего интернет-соединения по гостевому Wi-Fi?', hintSkeleton: 'What is the actual download and upload speed on the dedicated guest Wi-Fi network?', variants: ['What is the actual download and upload speed on the dedicated guest Wi-Fi network?', 'How fast is the guest wireless connection, is it symmetrical gigabit broadband?', 'What bandwidth can my guests expect on the private meeting room Wi-Fi SSID?'] },
                { incoming: 'Our enterprise fiber delivers symmetrical 1 Gbps with sub-5ms ping and dedicated bandwidth.', taskRu: 'Как моим внешним клиентам пройти через турникеты на первом этаже без пропусков?', hintSkeleton: 'How can my external clients pass through the security turnstiles on the ground floor without badges?', variants: ['How can my external clients pass through the security turnstiles on the ground floor without badges?', 'How will our visiting guests get past the lobby security desk if they don\'t have keycards?', 'What is the procedure for external visitors to access the elevators downstairs without passes?'] },
                { incoming: 'Give their names at reception; our concierge will issue temporary visitor passes with QR codes.', taskRu: 'Я могу прямо сейчас продиктовать вам имена и фамилии всех трех гостей для регистрации.', hintSkeleton: 'I can dictate the first and last names of all three guests to you right now for pre-registration.', variants: ['I can dictate the first and last names of all three guests to you right now for pre-registration.', 'Let me provide the full names of our visiting clients so you can add them to the security log.', 'I am ready to give you their full legal names to ensure smooth lobby check-in downstairs.'] },
                { incoming: 'Names logged in the security database! Can I offer your team lunch catering options?', taskRu: 'Разрешено ли заказывать доставку еды из сторонних ресторанов прямо в переговорную комнату?', hintSkeleton: 'Is it permitted to order external food delivery from outside restaurants directly to the meeting room?', variants: ['Is it permitted to order external food delivery from outside restaurants directly to the meeting room?', 'Can we have outside catering or DoorDash delivered into Room B for our working lunch?', 'Are external food deliveries allowed inside private conference rooms during bookings?'] },
                { incoming: 'Outside catering is totally welcome! We provide compostable plates, cutlery, and recycling bins.', taskRu: 'Сколько стоит продление аренды еще на один час, если наши переговоры затянутся?', hintSkeleton: 'How much does it cost to extend the booking for another hour if our negotiations run overtime?', variants: ['How much does it cost to extend the booking for another hour if our negotiations run overtime?', 'What is the hourly rate if we need to prolong the room reservation by an extra 60 minutes?', 'If our presentation takes longer, can we add an hour, and what is the overtime rate?'] },
                { incoming: 'Overtime is billed at our standard member rate of $45 per hour, calculated in 15-minute increments.', taskRu: 'Свободна ли эта переговорная комната с четырех до пяти вечера на случай продления?', hintSkeleton: 'Is this meeting room available from four to five pm in case we need to extend?', variants: ['Is this meeting room available from four to five pm in case we need to extend?', 'Does anyone have Room B reserved right after us from 4:00 to 5:00 pm today?', 'Is the slot immediately following our booking currently unreserved on the calendar?'] },
                { incoming: 'Room B is completely free until 6:00 pm today! You have full flexibility to extend.', taskRu: 'Замечательно, тогда давайте сразу забронируем время до половины пятого вечера.', hintSkeleton: 'Wonderful, then let us immediately extend the reservation until four-thirty pm.', variants: ['Wonderful, then let us immediately extend the reservation until four-thirty pm.', 'Great, please lock in the booking until 4:30 pm right now to give us a buffer.', 'Perfect, let\'s book it straight until half past four so we don\'t feel rushed.'] },
                { incoming: 'Booking updated: 2:00 pm to 4:30 pm in Room B. Do you need any printing before the meeting?', taskRu: 'Включено ли цветное сканирование и печать раздаточных материалов в стоимость аренды?', hintSkeleton: 'Is color scanning and printing of handouts included in the room rental fee?', variants: ['Is color scanning and printing of handouts included in the room rental fee?', 'Do we get complimentary printing credits for presentation decks on your multi-function printer?', 'Is printing presentation handouts covered by the meeting room booking package?'] },
                { incoming: 'You have 30 free color pages on our network printer. Send documents to print@cowork.com.', taskRu: 'Где мои коллеги могут безопасно оставить свои ноутбуки и верхнюю одежду во время кофе-брейка?', hintSkeleton: 'Where can my colleagues safely leave their laptops and coats during our coffee breaks?', variants: ['Where can my colleagues safely leave their laptops and coats during our coffee breaks?', 'Are there secure lockers or a coat closet where we can leave bags during breaks?', 'Can we lock Room B with a physical key or passcode when stepping out for lunch?'] },
                { incoming: 'Room B has an RFID door lock coded to your member keycard. It locks automatically when closed.', taskRu: 'Могу ли я оплатить совокупный счет за переговорную комнату корпоративной кредитной картой?', hintSkeleton: 'Can I pay the unified meeting room invoice using a corporate credit card?', variants: ['Can I pay the unified meeting room invoice using a corporate credit card?', 'Do you accept corporate American Express cards for conference room billing?', 'Can the total charges be invoiced to our company credit card at the reception terminal?'] },
                { incoming: 'Yes, we take all major corporate cards and issue formal VAT tax invoices via email.', taskRu: 'Я приложил корпоративную карту. Все организовано на высшем уровне, спасибо вам, Софи!', hintSkeleton: 'I tapped the corporate card. Everything is organized to the highest standard, thank you Sophie!', variants: ['I tapped the corporate card. Everything is organized to the highest standard, thank you Sophie!', 'Payment went through. Outstanding facilities and very helpful assistance, thanks Sophie!', 'Card processed. We really appreciate your thorough onboarding Sophie, fantastic space!'] },
                { incoming: 'Payment settled! Room B is unlocked and air-conditioned for your arrival. Have a killer pitch meeting!', taskRu: 'Спасибо за гостеприимство и помощь в организации, Софи! Пойдем готовить слайды.', hintSkeleton: 'Thank you for the hospitality and organizational help, Sophie! Heading in to set up our slides.', variants: ['Thank you for the hospitality and organizational help, Sophie! Heading in to set up our slides.', 'Thanks so much Sophie! We are going inside to plug in our laptops and get ready.', 'Much appreciated Sophie, thanks for making this seamless. We\'re heading into Room B now!'] }
            ]},
            { id: 19, avatar: '🚪', title: '20. 🚪 Разговор с соседом', desc: 'Ремонт в воскресенье, закон о тишине, строительная пыль в подъезде и отключение воды', name: 'Greg (Neighbor from Apt 18)', steps: [
                { incoming: 'Hey, sorry about the noise! We are remodeling the bathroom tiles this weekend.', taskRu: 'Я понимаю, но сегодня воскресенье, и шум дрели не прекращается с 8 утра.', hintSkeleton: 'I understand, but today is Sunday and the drilling noise has been non-stop since 8 am.', variants: ['I understand, but today is Sunday and the drilling has not stopped since 8 am.', 'I understand, but it\'s Sunday and the drilling noise has been going on since 8 am.', 'I get it, but today is Sunday and the drilling noise has been non-stop since eight am.'], exp: 'Drilling noise + has been going on since 8 am.' },
                { incoming: 'Oh man, I lost track of time. I really apologize. Would it help if we stopped by 2 pm?', taskRu: 'Было бы здорово, если бы вы закончили шумные работы к часу дня.', hintSkeleton: 'It would be great if you could finish the noisy work by one pm.', variants: ['It would be great if you could finish the noisy work by 1 pm.', 'It would be wonderful if you wrapped up the loud work by one pm.', 'That would help, but could you finish the noisy work by 1 pm?'], exp: 'It would be great if you could... by 1 pm.' },
                { incoming: 'We are replacing subfloor concrete, so the jackhammering is intense. Are Sunday noise rules strict here?', taskRu: 'Муниципальные правила нашего дома категорически запрещают шумные строительные работы по воскресеньям.', hintSkeleton: 'Our building municipal bylaws strictly prohibit loud construction work on Sundays.', variants: ['Our building municipal bylaws strictly prohibit loud construction work on Sundays.', 'The city noise ordinance and building rules completely forbid power tools on Sundays.', 'Heavy remodeling and impact drilling are strictly illegal on Sundays in this residential zone.'] },
                { incoming: 'I honestly had no idea Sundays were restricted. Our contractor said weekend work was fine.', taskRu: 'Подрядчик ввел вас в заблуждение, за работу перфоратора в выходные дни жильцам грозят крупные штрафы.', hintSkeleton: 'The contractor misled you, tenants face heavy fines for using hammer drills on weekends.', variants: ['The contractor misled you, tenants face heavy fines for using hammer drills on weekends.', 'Your builders gave you wrong information, Sunday demolition work triggers city fines.', 'The contractors misinformed you, loud power tools on Sundays violate local bylaws.'] },
                { incoming: 'I definitely do not want to get fined by the HOA or upset the neighbors. Do you work from home?', taskRu: 'Да, я работаю удаленно в сфере IT, и сегодня днем у меня важные видеоконференции с клиентами.', hintSkeleton: 'Yes, I work remotely in IT, and I have critical video conference calls with clients this afternoon.', variants: ['Yes, I work remotely in IT, and I have critical video conference calls with clients this afternoon.', 'Yes, I work from home and have high-stakes international Zoom meetings scheduled today.', 'I do, I work remotely and must host several live client video presentations after midday.'] },
                { incoming: 'I see how disruptive that must be with this concrete vibration. When are your calls scheduled?', taskRu: 'Мой первый главный созвон начнется ровно в половине двенадцатого и продлится сорок пять минут.', hintSkeleton: 'My first critical conference call starts at exactly eleven-thirty and will last forty-five minutes.', variants: ['My first critical conference call starts at exactly eleven-thirty and will last forty-five minutes.', 'My main presentation is from 11:30 am to 12:15 pm, and I cannot have background drilling.', 'The most important video meeting begins at half past eleven and takes about 45 minutes.'] },
                { incoming: 'Can we drill for just 15 more minutes to anchor the plumbing manifold before your call?', taskRu: 'Хорошо, если вы пошумите до одиннадцати двадцати, а затем отключите перфоратор на время созвона.', hintSkeleton: 'Alright, if you make noise until eleven-twenty, and then turn off the hammer drill during the call.', variants: ['Alright, if you make noise until eleven-twenty, and then turn off the hammer drill during the call.', 'Fine, you can drill until 11:20 am, but total silence is required once my meeting starts.', 'Fair enough, drill until twenty past eleven, but please stop all impact noise after that.'] },
                { incoming: 'I promise total silence on power tools between 11:20 am and 12:30 pm. What can workers do quietly?', taskRu: 'Ваши рабочие могут заняться бесшумными задачами, такими как укладка плитки, покраска или замеры.', hintSkeleton: 'Your workers can switch to quiet tasks like laying tiles, painting, or taking measurements.', variants: ['Your workers can switch to quiet tasks like laying tiles, painting, or taking measurements.', 'The builders could do quiet work such as measuring, grouting tiles, or dry fitting pipes.', 'They can focus on silent jobs like taping seams, painting, or manual tiling without power tools.'] },
                { incoming: 'Great idea, I will tell them to apply waterproofing primer during that window. Another thing: hallway dust.', taskRu: 'Да, на лестничной площадке лежит толстый слой белой штукатурной пыли от вашего ремонта.', hintSkeleton: 'Yes, there is a thick layer of white plaster dust on the landing from your renovation.', variants: ['Yes, there is a thick layer of white plaster dust on the landing from your renovation.', 'Indeed, your demolition generated a heavy coating of drywall dust across the whole hallway.', 'Yes, the shared corridor floor is completely covered in fine white construction dust.'] },
                { incoming: 'Concrete dust travels everywhere. We planned to sweep up at the end of the day.', taskRu: 'Могли бы ваши рабочие постелить влажные коврики и пленку, чтобы жильцы не разносили грязь в квартиры?', hintSkeleton: 'Could your workers lay down damp mats and plastic sheeting so residents do not track dirt into flats?', variants: ['Could your workers lay down damp mats and plastic sheeting so residents do not track dirt into flats?', 'Can the crew place damp runners outside the door so plaster dust isn\'t tracked indoors?', 'Would you mind laying protective plastic film and wet mats in the elevator vestibule?'] },
                { incoming: 'I will buy sticky dust containment mats and put them outside our threshold immediately.', taskRu: 'Спасибо, это предотвратит попадание едкой бетонной пыли в вентиляцию и квартиры соседей.', hintSkeleton: 'Thank you, that will prevent abrasive concrete dust from getting into neighbor ventilation and flats.', variants: ['Thank you, that will prevent abrasive concrete dust from getting into neighbor ventilation and flats.', 'I appreciate that, it will stop toxic plaster dust from entering neighboring apartments.', 'Thanks, that will keep the hallway air breathable and avoid complaints from other tenants.'] },
                { incoming: 'We also need to replace the main water stopcock next week. That requires shutting off the building riser.', taskRu: 'Потребуется ли полное перекрытие подачи холодной и горячей воды по всему нашему стояку?', hintSkeleton: 'Will that require a complete shutoff of both hot and cold water supplies across our entire riser?', variants: ['Will that require a complete shutoff of both hot and cold water supplies across our entire riser?', 'Does that mean the entire plumbing stack will have water disconnected during the valve replacement?', 'Will the whole vertical riser lose water pressure while the new valve is installed?'] },
                { incoming: 'Yes, but only for about 90 minutes on Tuesday morning. What time causes the least disruption?', taskRu: 'Лучше всего перекрыть воду во вторник между десятью утра и полуднем, когда большинство людей на работе.', hintSkeleton: 'It is best to shut the water on Tuesday between ten am and noon when most people are at work.', variants: ['It is best to shut the water on Tuesday between ten am and noon when most people are at work.', 'Tuesday between 10:00 am and 12:00 pm would cause the least inconvenience for the building.', 'The ideal window is 10 am to 12 pm on Tuesday since morning showers are already finished.'] },
                { incoming: 'Tuesday 10:00 am to 11:30 am is locked in. Do I need to post a notice in the lobby?', taskRu: 'Вы обязаны повесить официальное предупреждение на доске объявлений у лифта за 48 часов.', hintSkeleton: 'You are obligated to post an official advance notice on the elevator bulletin board 48 hours prior.', variants: ['You are obligated to post an official advance notice on the elevator bulletin board 48 hours prior.', 'Building bylaws mandate hanging a printed 48-hour notice next to the elevator buttons.', 'You must pin an advance warning flyer in the lobby at least two days before shutting off water.'] },
                { incoming: 'I am printing the brightly colored notice right now and will tape it in the elevator today.', taskRu: 'Давайте обменяемся номерами мобильных телефонов, чтобы оперативно решать вопросы по шуму через сообщения.', hintSkeleton: 'Let us exchange mobile phone numbers so we can resolve noise issues promptly via text messages.', variants: ['Let us exchange mobile phone numbers so we can resolve noise issues promptly via text messages.', 'Can we swap cell numbers so we can text each other directly if issues arise?', 'Let\'s trade phone numbers so I can message you directly rather than knocking on the door.'] },
                { incoming: 'My number is 555-0198. Text me anytime if the noise gets out of hand or vibrates your floor.', taskRu: 'Записал ваш номер. Мой телефон 555-0144, сохраните его под именем Алекс из девятнадцатой квартиры.', hintSkeleton: 'Saved your number. My phone is 555 0144, save it as Alex from apartment nineteen.', variants: ['Saved your number. My phone is 555 0144, save it as Alex from apartment nineteen.', 'Got it. Mine is 555-0144, listed under Alex in apartment 19 right next door.', 'Saved. You can reach me at 555-0144, I\'m Alex in flat 19.'] },
                { incoming: 'Saved you in my contacts, Alex. What about noise during normal working weekdays?', taskRu: 'С понедельника по пятницу умеренный шум с девяти утра до пяти вечера меня вполне устраивает.', hintSkeleton: 'From Monday through Friday, moderate remodeling noise between 9 am and 5 pm is completely fine with me.', variants: ['From Monday through Friday, moderate remodeling noise between 9 am and 5 pm is completely fine with me.', 'Weekday drilling between 9:00 am and 5:00 pm is totally acceptable as I wear noise-cancelling headphones.', 'During standard business hours on weekdays from 9 to 5, renovation sounds are not a problem.'] },
                { incoming: 'That gives our crew 8 solid hours every weekday to finish all the noisy subfloor leveling.', taskRu: 'Я искренне ценю вашу готовность к разумному компромиссу и добрососедские отношения.', hintSkeleton: 'I genuinely appreciate your willingness to find a reasonable compromise and keep good neighborly relations.', variants: ['I genuinely appreciate your willingness to find a reasonable compromise and keep good neighborly relations.', 'Thank you for being so understanding and cooperative, that makes being neighbors much easier.', 'I really value your neighborly attitude and willingness to respect quiet hours today, Greg.'] },
                { incoming: 'Good neighbors are hard to find, I want to make sure we stay on great terms. Workers are turning off tools now!', taskRu: 'Спасибо за тишину во время моего звонка, Грег! Успешного вам завершения ремонта санузла.', hintSkeleton: 'Thank you for the quiet during my call, Greg! Best of luck finishing your bathroom renovation.', variants: ['Thank you for the quiet during my call, Greg! Best of luck finishing your bathroom renovation.', 'Thanks for keeping it silent for my meeting Greg! Hope the rest of your remodeling goes smoothly.', 'Much appreciated Greg, the silence is wonderful. Good luck with the tile work this afternoon!'] },
                { incoming: 'Thanks Alex! Text me if you smell any primer paint fumes later. Have a productive call!', taskRu: 'Обязательно напишу, если что-то пойдет не так. Спасибо еще раз и хорошего воскресенья!', hintSkeleton: 'I will definitely text if anything comes up. Thanks once again and have a pleasant Sunday!', variants: ['I will definitely text if anything comes up. Thanks once again and have a pleasant Sunday!', 'Will do if the fumes get too strong. Thanks again for your understanding, enjoy your Sunday!', 'I\'ll keep you posted. Thanks again for compromising, have a peaceful rest of your weekend Greg!'] }
            ]},
            { id: 20, avatar: '💈', title: '21. 💈 Визит в барбершоп', desc: 'Стрижка фейд, текстурирование ножницами, оформление бороды опасной бритвой и компресс', name: 'Sam (Barber)', steps: [
                { incoming: 'Take a seat! How are we styling your hair today?', taskRu: 'Сделайте коротко по бокам с плавным переходом, но оставьте длину сверху.', hintSkeleton: 'Keep it short on the sides with a fade, but leave the length on top.', variants: ['Keep it short on the sides with a fade, but leave the length on top.', 'I want it short on the sides with a taper fade, but keep the length on top.', 'Short on the sides with a fade please, but don\'t cut too much off the top.'], exp: 'Fade (плавный переход) + leave the length on top.' },
                { incoming: 'Understood! Would you like me to trim and line up your beard as well?', taskRu: 'Да, пожалуйста, подравняйте бороду и сделайте четкие контуры на щеках.', hintSkeleton: 'Yes please, trim the beard and line up the edges on my cheeks.', variants: ['Yes please, trim the beard and line up the edges on my cheeks.', 'Yes please, trim my beard and give me sharp lines on the cheeks.', 'Yes please, clean up the beard and sharpen the cheek lines.'], exp: 'Line up the edges = сделать четкие контуры.' },
                { incoming: 'Do you prefer a mid fade or a low skin fade down to zero at the neck?', taskRu: 'Сделайте низкий скин-фейд с плавным переходом в ноль на затылке.', hintSkeleton: 'A low skin fade that tapers cleanly down to zero at the neckline.', variants: ['A low skin fade that tapers cleanly down to zero at the neckline.', 'I prefer a low skin fade blending down to bare skin at the neck.', 'Make it a low skin fade that fades to zero towards the nape of my neck.'], exp: 'Low skin fade tapers down to zero at the neckline.' },
                { incoming: 'Low skin fade it is. How much length should we take off the top fringe?', taskRu: 'Уберите примерно полдюйма сверху и профилируйте пряди для объема.', hintSkeleton: 'Take about half an inch off the top and texture it so it has volume.', variants: ['Take about half an inch off the top and texture it so it has volume.', 'Cut roughly half an inch on top and add texture for natural volume.', 'Trim about half an inch off the top and point-cut it for extra texture.'] },
                { incoming: 'Do you want me to blend the sides with clippers or scissors over comb?', taskRu: 'Используйте технику стрижки ножницами по расческе для более мягкого перехода.', hintSkeleton: 'Use scissor-over-comb technique for a smoother transition between sides and top.', variants: ['Use scissor-over-comb technique for a smoother transition between sides and top.', 'I prefer scissor-over-comb for a softer blend into the top length.', 'Please use shears over comb so the blend looks natural rather than harsh.'] },
                { incoming: 'Scissor over comb gives the cleanest blend. Should I thin out the bulky crown area?', taskRu: 'Да, пройдитесь филировочными ножницами, чтобы снять лишнюю густоту на макушке.', hintSkeleton: 'Yes, please use thinning shears to remove some bulk on the crown.', variants: ['Yes, please use thinning shears to remove some bulk on the crown.', 'Yes, thin out the crown area slightly because my hair gets very thick there.', 'Please take some weight off the crown using texturizing thinning scissors.'] },
                { incoming: 'Done with the hair! For your beard: guard number 2 or number 3 on the trimmer?', taskRu: 'Снимите длину бороды под насадку номер три, но оставьте усы чуть гуще.', hintSkeleton: 'Trim the beard down to a guard number 3, but keep the mustache a bit fuller.', variants: ['Trim the beard down to a guard number 3, but keep the mustache a bit fuller.', 'Use a number 3 guard on the beard, but leave the mustache slightly longer.', 'Take the beard down with a 3 guard, keeping a little more density on the mustache.'] },
                { incoming: 'Number 3 on the beard. Should I edge up your cheeks and throat with the straight razor?', taskRu: 'Да, сделайте четкие контуры опасной бритвой с горячей пеной.', hintSkeleton: 'Yes, sharpen the edges using a straight razor with hot lather.', variants: ['Yes, sharpen the edges using a straight razor with hot lather.', 'Yes please, line up the cheeks and neck with a traditional straight razor.', 'Definitely, use a straight razor and warm shaving foam for clean sharp lines.'] },
                { incoming: 'Any skin sensitivity or ingrown hairs on your neck I should be mindful of?', taskRu: 'У меня чувствительная кожа на шее, пожалуйста, нанесите масло до бритья.', hintSkeleton: 'I have sensitive skin on my neck, please apply pre-shave oil first.', variants: ['I have sensitive skin on my neck, please apply pre-shave oil first.', 'My lower neck is prone to razor burn, so please use a protective pre-shave oil.', 'I suffer from skin irritation on the neck, apply pre-shave soothing oil please.'] },
                { incoming: 'Pre-shave eucalyptus oil applied. Leaning you back for the hot towel steam now...', taskRu: 'Горячее влажное полотенце ощущается потрясающе и отлично расслабляет.', hintSkeleton: 'The hot steamed towel feels fantastic and is very relaxing.', variants: ['The hot steamed towel feels fantastic and is very relaxing.', 'This warm eucalyptus towel feels incredible, very refreshing.', 'The hot towel treatment is so soothing and relaxing, thank you.'] },
                { incoming: 'Shave finished with zero irritation! Would you like cold water or an astringent splash?', taskRu: 'Ополосните холодной водой и нанесите бесспиртовой увлажняющий бальзам после бритья.', hintSkeleton: 'Rinse with cold water and apply an alcohol-free soothing aftershave balm.', variants: ['Rinse with cold water and apply an alcohol-free soothing aftershave balm.', 'Cold water splash please, followed by a non-alcoholic calming lotion.', 'Please splash cold water to close the pores and use an alcohol-free balm.'] },
                { incoming: 'Soothing aloe balm applied. How do you want to style the hair: matte clay or shiny pomade?', taskRu: 'Я предпочитаю матовую глину с естественной текстурой и сильной фиксацией без блеска.', hintSkeleton: 'I prefer a matte clay with a natural texture and strong hold without shine.', variants: ['I prefer a matte clay with a natural texture and strong hold without shine.', 'Matte styling clay please, I like a natural finish with good hold and zero gloss.', 'I\'d like a matte paste with strong hold that leaves no greasy shine.'] },
                { incoming: 'Let me blow-dry with sea salt spray first for maximum root volume before applying clay.', taskRu: 'Отличная идея, текстурирующий солевой спрей всегда дает прекрасный объем.', hintSkeleton: 'Great idea, texturizing sea salt spray always adds wonderful volume.', variants: ['Great idea, texturizing sea salt spray always adds wonderful volume.', 'Sounds good, sea salt spray works wonders for gritty texture and lift.', 'Yes please, blow-drying with salt spray gives great structure to my hair.'] },
                { incoming: 'Clay worked in! Take a look in the hand mirror at the back and neckline. How does it look?', taskRu: 'Переход на затылке плавный и идеальный, а контуры бороды безупречно ровные.', hintSkeleton: 'The fade on the back is seamless and perfect, and the beard lines are flawless.', variants: ['The fade on the back is seamless and perfect, and the beard lines are flawless.', 'The taper fade looks incredible and the beard edges are razor-sharp.', 'Everything looks immaculate, the fade is smooth and the neckline is crisp.'] },
                { incoming: 'Thank you! Total for the haircut, beard sculpt, and hot towel shave is $45.', taskRu: 'Вот пятьдесят пять долларов, сдачу оставьте себе в качестве чаевых за отличную работу!', hintSkeleton: 'Here is fifty-five dollars, please keep the change as a tip for the excellent service!', variants: ['Here is fifty-five dollars, please keep the change as a tip for the excellent service!', 'Take $55 and keep the change, you did an outstanding job today Sam!', 'Here is 55, keep the rest as your tip. Thanks for the fresh cut Sam!'] }
            ]},
            { id: 21, avatar: '🛫', title: '22. 🛫 Авиакомпания и стыковка', desc: 'Срыв пересадки, отель от авиакомпании, ваучеры на питание, багаж и компенсация', name: 'Jessica (Delta Airlines)', steps: [
                { incoming: 'Customer Service, Jessica here. I see your flight from Chicago was delayed by two hours.', taskRu: 'Из-за этой задержки я пропустил свой стыковочный рейс в Лондон.', hintSkeleton: 'Due to this delay, I missed my connecting flight to London.', variants: ['Due to this delay I missed my connecting flight to London.', 'Because of this delay, I have missed my connecting flight to London.', 'Owing to this delay, I missed my connection to London.'], exp: 'Connecting flight = стыковочный рейс.' },
                { incoming: 'I am so sorry. We can rebook you on British Airways at 8 pm, or put you in a hotel until tomorrow.', taskRu: 'Перебронируйте меня на рейс в 8 вечера, пожалуйста, и предоставьте ваучер на еду.', hintSkeleton: 'Please rebook me on the 8 pm flight and provide a meal voucher.', variants: ['Please rebook me on the 8 pm flight and provide a meal voucher.', 'Could you rebook me on the eight pm flight and give me a meal voucher?', 'I prefer the 8 pm flight, and could you please issue a meal voucher?'], exp: 'Meal voucher = талон на питание в аэропорту.' },
                { incoming: 'Checking the 8 pm flight... Unfortunately, Economy is overbooked, only Business has empty seats.', taskRu: 'Можете ли вы бесплатно повысить меня в бизнес-класс из-за задержки по вине авиакомпании?', hintSkeleton: 'Can you provide a complimentary upgrade to Business class due to the airline delay?', variants: ['Can you provide a complimentary upgrade to Business class due to the airline delay?', 'Could you bump me up to Business for free since the missed connection was your fault?', 'Is a complimentary operational upgrade to Business possible given the disruption?'] },
                { incoming: 'Company policy restricts complimentary upgrades, but I found a direct flight on Virgin Atlantic at 7:30 am.', taskRu: 'Если мне придется ночевать здесь, предоставит ли авиакомпания отель и трансфер?', hintSkeleton: 'If I must stay overnight, will the airline provide a hotel room and airport shuttle?', variants: ['If I must stay overnight, will the airline provide a hotel room and airport shuttle?', 'Does the airline cover hotel accommodation and shuttle transfers for overnight delays?', 'Will you issue a complimentary hotel room voucher and transportation to the airport?'] },
                { incoming: 'Yes, we provide a room at the Marriott Airport Hotel with a free 24/7 shuttle bus voucher.', taskRu: 'Каков суммарный номинал продуктовых ваучеров на ужин сегодня и завтрак завтра утром?', hintSkeleton: 'What is the total value of the meal vouchers for dinner tonight and breakfast tomorrow?', variants: ['What is the total value of the meal vouchers for dinner tonight and breakfast tomorrow?', 'How much meal allowance is included on the food vouchers for dinner and breakfast?', 'What dollar amount do the dinner and breakfast restaurant vouchers cover?'] },
                { incoming: 'You will receive two $25 meal vouchers accepted at any terminal restaurant or the hotel buffet.', taskRu: 'Что произойдет с двумя моими зарегистрированными чемоданами, оформленными до Лондона?', hintSkeleton: 'What will happen to my two checked bags that were tagged through to London?', variants: ['What will happen to my two checked bags that were tagged through to London?', 'Where is my checked luggage right now and will it transfer to the morning flight?', 'What happens to the suitcases I checked in, do they stay in transit overnight?'] },
                { incoming: 'Your luggage remains safely in our automated transit holding area and transfers to Virgin Atlantic.', taskRu: 'Могу ли я забрать чемоданы на ночь, чтобы достать свежую одежду и рецептурные лекарства?', hintSkeleton: 'Can I retrieve my luggage overnight to access fresh clothes and prescription medication?', variants: ['Can I retrieve my luggage overnight to access fresh clothes and prescription medication?', 'Is it possible to claim my suitcases tonight so I can take out clean clothes and medicine?', 'Could baggage handlers pull my luggage so I have my essentials and pills tonight?'] },
                { incoming: 'Recalling bags takes up to 3 hours, but I can issue a complimentary overnight travel hygiene kit.', taskRu: 'Хорошо, выдайте мне дорожный гигиенический набор, а багаж пусть летит утренним рейсом.', hintSkeleton: 'Fine, give me the overnight hygiene kit and let the luggage fly on the morning flight.', variants: ['Fine, give me the overnight hygiene kit and let the luggage fly on the morning flight.', 'Alright, I will take the overnight amenity kit so my bags transfer automatically.', 'That works, issue the emergency toiletry kit and keep the suitcases in transit.'] },
                { incoming: 'Here is the amenity kit with toothbrush, t-shirt, and toiletries. Let me assign your seat for tomorrow.', taskRu: 'Пожалуйста, выберите для меня место у прохода в передней части салона возле аварийного выхода.', hintSkeleton: 'Please select an aisle seat for me in the forward section near an exit row.', variants: ['Please select an aisle seat for me in the forward section near an exit row.', 'Could you assign me an extra legroom aisle seat in an emergency exit row?', 'I prefer an aisle seat towards the front of the aircraft, preferably with extra legroom.'] },
                { incoming: 'I reserved seat 14C in the Comfort Plus section with extra legroom at no additional charge.', taskRu: 'Имею ли я право на денежную компенсацию за длительную задержку по закону о правах пассажиров?', hintSkeleton: 'Am I entitled to monetary cash compensation for this prolonged delay under passenger rights?', variants: ['Am I entitled to monetary cash compensation for this prolonged delay under passenger rights?', 'Does this overnight delay qualify for statutory flight delay compensation under DOT rules?', 'Can I claim cash compensation for the delay caused by aircraft mechanical failure?'] },
                { incoming: 'Yes, this was classified as a controllable carrier mechanical delay, making you eligible for $600.', taskRu: 'В каком разделе вашего сайта я должен подать официальное заявление на выплату компенсации?', hintSkeleton: 'Under which section of your website should I submit the formal compensation claim?', variants: ['Under which section of your website should I submit the formal compensation claim?', 'Where online do I file the passenger delay reimbursement claim using my ticket number?', 'Which webpage handles statutory flight disruption claims and payout requests?'] },
                { incoming: 'Go to delta.com/reimbursement and input your ticket number 006-889124 and reason code "MEC-01".', taskRu: 'Будут ли мне начислены бонусные мили за перелет партнерской авиакомпанией Virgin Atlantic?', hintSkeleton: 'Will I still be credited frequent flyer miles for flying on the partner airline Virgin Atlantic?', variants: ['Will I still be credited frequent flyer miles for flying on the partner airline Virgin Atlantic?', 'Do I still earn SkyMiles and tier status points for this rebooked Virgin Atlantic flight?', 'Will my frequent flyer mileage account receive original routing credit for the trip?'] },
                { incoming: 'Yes, Original Routing Credit applies automatically to your SkyMiles loyalty account.', taskRu: 'Распечатайте, пожалуйста, бумажные копии посадочного талона, гостиничного ваучера и талонов на еду.', hintSkeleton: 'Please print paper copies of the boarding pass, hotel voucher, and meal vouchers.', variants: ['Please print paper copies of the boarding pass, hotel voucher, and meal vouchers.', 'Could you give me physical printouts of the new boarding pass, hotel voucher, and meal coupons?', 'Please print all documents: the morning boarding pass, hotel transfer slip, and meal vouchers.'] },
                { incoming: 'Here is your travel packet: Virgin Atlantic boarding pass for 7:30 am, hotel room voucher, and shuttle pass.', taskRu: 'Где останавливается бесплатный автобус-шаттл до отеля Марриотт возле терминала?', hintSkeleton: 'Where does the complimentary airport shuttle bus to the Marriott hotel stop outside the terminal?', variants: ['Where does the complimentary airport shuttle bus to the Marriott hotel stop outside the terminal?', 'Which door does the free Marriott hotel shuttle pick up from on the arrivals level?', 'Where can I catch the shuttle bus to the Marriott hotel from this baggage claim area?'] },
                { incoming: 'Exit door 4 on the lower ground level, lane 2. Buses depart every 15 minutes around the clock.', taskRu: 'Спасибо огромное за быстрое и профессиональное решение сложной проблемы, Джессика!', hintSkeleton: 'Thank you very much for the prompt and professional resolution to a difficult problem, Jessica!', variants: ['Thank you very much for the prompt and professional resolution to a difficult problem, Jessica!', 'Thanks so much Jessica, you handled this stressful cancellation with great professionalism!', 'I really appreciate your efficiency, empathy, and clear help tonight, Jessica. Have a good evening!'] }
            ]},
            { id: 22, avatar: '🦷', title: '23. 🦷 Стоматология / Острая боль', desc: 'Выпавшая пломба, пульсирующая боль на холодное, артикаин, рентген и страховка', name: 'Clara (Dental Reception)', steps: [
                { incoming: 'Bright Smile Dental, how can we help with your tooth today?', taskRu: 'У меня вчера выпала пломба, и теперь зуб сильно болит от холодного.', hintSkeleton: 'My filling fell out yesterday and now the tooth is very sensitive to cold.', variants: ['My filling fell out yesterday and now the tooth hurts badly from cold drinks.', 'A filling came out yesterday and now the tooth is very sensitive to cold.', 'My filling fell out yesterday and the tooth is throbbing whenever I drink cold water.'], exp: 'Filling fell out (пломба выпала) + sensitive to cold.' },
                { incoming: 'That sounds painful. We have an emergency slot open with Dr. Adams at 3:30 pm.', taskRu: 'Запишите меня, пожалуйста. Потребуется ли анестезия во время лечения?', hintSkeleton: 'Book me in please. Will anesthesia be required during the treatment?', variants: ['Please book me in. Will anesthesia be required during the treatment?', 'Sign me up please. Will I need a local anesthetic for this procedure?', 'Book that slot for me please. Will local anesthesia be used?'], exp: 'Book me in + local anesthesia.' },
                { incoming: 'Dr. Adams always numbs the area thoroughly. Is the pain constant or does it throb at night?', taskRu: 'Боль острая и пульсирующая, ночью она усилилась и не давала мне спать.', hintSkeleton: 'The pain is sharp and throbbing, it worsened at night and kept me awake.', variants: ['The pain is sharp and throbbing, it worsened at night and kept me awake.', 'It is a sharp throbbing ache that got much worse overnight and prevented me from sleeping.', 'The pain throbs constantly and woke me up several times during the night.'] },
                { incoming: 'Nighttime throbbing suggests the dental pulp nerve might be inflamed. Any facial swelling?', taskRu: 'Отечности на щеке пока нет, но зуб остро реагирует даже на вдыхание холодного воздуха.', hintSkeleton: 'There is no facial swelling yet, but the tooth reacts sharply even to breathing in cold air.', variants: ['There is no facial swelling yet, but the tooth reacts sharply even to breathing in cold air.', 'No visible swelling on my cheek, but inhaling cold air triggers an acute sharp pain.', 'My cheek is not swollen, but the exposed tooth is agonizingly sensitive to cold air.'] },
                { incoming: 'Keep breathing through your nose. Does Dr. Adams use Articaine or Lidocaine for local numbing?', taskRu: 'Использует ли доктор сильный анестетик вроде артикаина, чтобы я ничего не почувствовал?', hintSkeleton: 'Does the doctor use a strong anesthetic like Articaine so that I feel no pain whatsoever?', variants: ['Does the doctor use a strong anesthetic like Articaine so that I feel no pain whatsoever?', 'Will Dr. Adams administer Septocaine or Articaine to ensure the area is 100% numb?', 'Does the clinic use modern profound anesthetics like Articaine for pain-free treatment?'] },
                { incoming: 'We use Articaine with epinephrine for profound numbness, preceded by topical numbing jelly.', taskRu: 'Сделаете ли вы прицельный цифровой рентгеновский снимок зуба перед началом лечения?', hintSkeleton: 'Will you take a targeted digital dental X-ray of the tooth before starting treatment?', variants: ['Will you take a targeted digital dental X-ray of the tooth before starting treatment?', 'Do you take a periapical digital X-ray to examine the root and nerve health first?', 'Will a diagnostic digital radiograph be taken before Dr. Adams begins drilling?'] },
                { incoming: 'A digital periapical X-ray is mandatory to evaluate the nerve root and check for infection.', taskRu: 'Входит ли стоимость диагностического рентгеновского снимка в первичный прием или оплачивается отдельно?', hintSkeleton: 'Is the cost of the diagnostic X-ray included in the emergency exam fee or billed separately?', variants: ['Is the cost of the diagnostic X-ray included in the emergency exam fee or billed separately?', 'Does the emergency consultation fee cover the periapical X-ray or is that an extra charge?', 'Is the radiograph included in the initial visit price or charged as an additional line item?'] },
                { incoming: 'The diagnostic X-ray is $45, but insurance usually covers preventive diagnostics at 100%.', taskRu: 'Что если зуб потребует лечения каналов, а не простой светоотверждаемой пломбы?', hintSkeleton: 'What if the tooth requires a root canal treatment rather than a simple composite filling?', variants: ['What if the tooth requires a root canal treatment rather than a simple composite filling?', 'What happens if Dr. Adams finds deep nerve decay requiring endodontic root canal therapy?', 'If the pulp is infected, can a root canal be started today instead of a regular filling?'] },
                { incoming: 'Dr. Adams can perform a pain-relieving pulpotomy today and place a sedative temporary filling.', taskRu: 'Можно ли поставить временную пломбу сегодня, если позже понадобится циркониевая коронка?', hintSkeleton: 'Can a temporary filling be placed today if a zirconia crown is needed later?', variants: ['Can a temporary filling be placed today if a zirconia crown is needed later?', 'Is it possible to place a sedative dressing today if the tooth will eventually require a crown?', 'Could you install a temporary seal today if we decide to do a ceramic crown next week?'] },
                { incoming: 'Yes, a temporary sedative restoration calms the nerve and protects the tooth structure.', taskRu: 'Принимаете ли вы стоматологическую страховку Delta Dental PPO с прямым расчетом?', hintSkeleton: 'Do you accept Delta Dental PPO insurance plans with direct billing?', variants: ['Do you accept Delta Dental PPO insurance plans with direct billing?', 'Are you an in-network provider for Delta Dental PPO insurance?', 'Can you process my insurance claim directly through Delta Dental PPO?'] },
                { incoming: 'We are in-network with Delta Dental PPO and can submit real-time electronic claims.', taskRu: 'Можете ли вы проверить мой оставшийся годовой лимит страхового покрытия прямо сейчас?', hintSkeleton: 'Could you verify my remaining annual insurance benefit maximum right now?', variants: ['Could you verify my remaining annual insurance benefit maximum right now?', 'Can you check how much of my annual dental insurance benefit is still available?', 'Could you look up my policy to see my remaining annual deductible and benefit cap?'] },
                { incoming: 'Your portal shows you have $1,150 remaining in annual benefits with your deductible already met.', taskRu: 'Какое обезболивающее средство мне принять сейчас, чтобы дотерпеть до визита в 3:30?', hintSkeleton: 'What painkiller should I take right now to manage the ache until my three-thirty appointment?', variants: ['What painkiller should I take right now to manage the ache until my three-thirty appointment?', 'Which over-the-counter pain medication is recommended while I wait for 3:30 pm?', 'What anti-inflammatory pill can I take to soothe the toothache before seeing the doctor?'] },
                { incoming: 'Take 400mg of Ibuprofen with food. Do not place aspirin directly against the gum tissue!', taskRu: 'Следует ли мне поесть перед визитом или лучше прийти натощак из-за анестезии?', hintSkeleton: 'Should I eat before the dental visit or is it better to come on an empty stomach due to anesthesia?', variants: ['Should I eat before the dental visit or is it better to come on an empty stomach due to anesthesia?', 'Is it advisable to have a light meal before local anesthesia, or should I fast?', 'Should I eat lunch prior to my appointment, or do you require an empty stomach?'] },
                { incoming: 'Eat a light meal beforehand; local anesthesia works better and you won\'t be able to chew for 2 hours.', taskRu: 'Я почищу зубы и приеду на пятнадцать минут раньше, чтобы заполнить медицинскую анкету.', hintSkeleton: 'I will brush my teeth and arrive fifteen minutes early to fill out the medical history questionnaire.', variants: ['I will brush my teeth and arrive fifteen minutes early to fill out the medical history questionnaire.', 'I\'ll floss, brush, and get to the clinic at 3:15 pm to complete the new patient intake forms.', 'I will arrive 15 minutes before the appointment to handle the registration paperwork.'] },
                { incoming: 'We have reserved Dr. Adams\' chair for you at 3:30 pm. Hang in there, we will relieve your pain soon!', taskRu: 'Спасибо за понимание и быструю запись на прием, Клара! До встречи в половине четвертого.', hintSkeleton: 'Thank you for your understanding and prompt booking, Clara! See you at half past three.', variants: ['Thank you for your understanding and prompt booking, Clara! See you at half past three.', 'Thanks so much for fitting me in today Clara, really appreciate it. See you at 3:15!', 'Thank you Clara for your helpful advice and fast scheduling. See you this afternoon!'] }
            ]},
            { id: 23, avatar: '📚', title: '24. 📚 Книжный магазин', desc: 'Коллекционное издание «Дюны», тканевый переплет, золотой обрез, скидка и упаковка', name: 'Arthur (Bookseller)', steps: [
                { incoming: 'Hello! Looking for any specific title or author in our literature section?', taskRu: 'Я ищу английское издание романа Дюна в твердой обложке.', hintSkeleton: 'I am looking for the hardcover English edition of the novel Dune.', variants: ['I am looking for the hardcover English edition of the novel Dune.', 'I\'m searching for a hardcover edition of the novel Dune in English.', 'Do you have the English hardcover edition of Dune in stock?'], exp: 'Hardcover edition (в твердой обложке) vs paperback.' },
                { incoming: 'It is currently out of stock on our shelves, but our central warehouse has copies.', taskRu: 'Сколько дней займет доставка, если я закажу книгу прямо сейчас?', hintSkeleton: 'How many days will delivery take if I order the book right now?', variants: ['How many days will delivery take if I order the book right now?', 'How long will the delivery take if I place an order right now?', 'How many days will it take to arrive if I order it today?'], exp: 'How long will delivery take if I order...' },
                { incoming: 'Standard warehouse dispatch takes 3 days, but we have the Deluxe Illustrated Collector\'s Edition right here!', taskRu: 'Можете ли вы показать мне это иллюстрированное коллекционное издание на витрине?', hintSkeleton: 'Could you show me this illustrated collector\'s edition from the display shelf?', variants: ['Could you show me this illustrated collector\'s edition from the display shelf?', 'Can I take a look at the deluxe illustrated edition you have in stock?', 'Could you pull down that collector\'s hardcover copy so I can inspect it?'] },
                { incoming: 'Here it is! It features stunning full-color interior plates by artist Sam Weber.', taskRu: 'Включает ли это специальное издание цветные карты планеты Арракис на форзацах?', hintSkeleton: 'Does this special edition include full-color maps of the planet Arrakis on the endpapers?', variants: ['Does this special edition include full-color maps of the planet Arrakis on the endpapers?', 'Are there detailed fold-out maps of Arrakis printed inside the front and back covers?', 'Does the volume feature illustrated cartography of Arrakis on the illustrated endpapers?'] },
                { incoming: 'Yes, full-color illustrated cartography on the endpapers plus an introduction by Brian Herbert.', taskRu: 'Выполнен ли переплет из прошитой натуральной ткани с золотым тиснением на корешке?', hintSkeleton: 'Is the binding made of Smyth-sewn natural cloth with gold foil stamping on the spine?', variants: ['Is the binding made of Smyth-sewn natural cloth with gold foil stamping on the spine?', 'Does it feature a stitched cloth hardcover with embossed gold lettering along the spine?', 'Is this a genuine Smyth-sewn clothbound book with gold foil detailing?'] },
                { incoming: 'It is bound in midnight blue bookcloth with embossed gold foil and a matching silk ribbon bookmark.', taskRu: 'Какова розничная цена этого подарочного коллекционного тома в твердом переплете?', hintSkeleton: 'What is the retail price of this deluxe collector\'s hardcover volume?', variants: ['What is the retail price of this deluxe collector\'s hardcover volume?', 'How much does this special illustrated clothbound edition cost?', 'What is the listed retail price for this collector\'s edition of Dune?'] },
                { incoming: 'The retail list price is $50. Do you hold a university student card or educator ID?', taskRu: 'Да, у меня есть действующий студенческий билет, действует ли по нему скидка?', hintSkeleton: 'Yes, I have an active student ID card, does it qualify for an academic discount?', variants: ['Yes, I have an active student ID card, does it qualify for an academic discount?', 'Yes, I carry a valid university student card, do you offer a student discount?', 'I have my university ID with me, is there a discount for enrolled students?'] },
                { incoming: 'Students receive 10% off all hardcover fiction! That brings the total down to $45.', taskRu: 'Есть ли у вашего книжного магазина программа лояльности для накопления бонусных баллов?', hintSkeleton: 'Does your bookstore have a customer loyalty program for accumulating reward points?', variants: ['Does your bookstore have a customer loyalty program for accumulating reward points?', 'Do you run a readers\' loyalty scheme where purchases earn rewards or vouchers?', 'Is there a membership club where I can collect points on book purchases?'] },
                { incoming: 'Every dollar spent earns 1 point; reaching 100 points grants an automatic $10 store gift certificate.', taskRu: 'Могу ли я зарегистрироваться в вашей программе лояльности по номеру мобильного телефона?', hintSkeleton: 'Can I register for your loyalty program using my mobile phone number right now?', variants: ['Can I register for your loyalty program using my mobile phone number right now?', 'Could you sign me up for the reader rewards club using my cell phone number?', 'Is it possible to enroll in the loyalty program at checkout with just my phone number?'] },
                { incoming: 'You are enrolled in our Readers Club! By the way, do you plan to read the sequel, "Dune Messiah"?', taskRu: 'Имеется ли у вас в наличии вторая часть романа в точно таком же оформлении переплета?', hintSkeleton: 'Do you have the second volume, "Dune Messiah", available in this exact matching binding?', variants: ['Do you have the second volume, "Dune Messiah", available in this exact matching binding?', 'Is the sequel "Dune Messiah" in stock in the identical deluxe clothbound edition?', 'Do you carry the companion volume "Dune Messiah" matching this blue cloth cover?'] },
                { incoming: 'It is currently backordered, but our shipment from the UK publisher lands next Tuesday.', taskRu: 'Можете ли вы оформить предзаказ второй книги, чтобы я забрал ее на следующей неделе?', hintSkeleton: 'Could you place a reserve hold on the second book so I can collect it next week?', variants: ['Could you place a reserve hold on the second book so I can collect it next week?', 'Can you put me on the reservation list for Dune Messiah when the shipment arrives Tuesday?', 'Would you mind creating a pre-order reservation for the sequel under my loyalty account?'] },
                { incoming: 'Reserved under your name! We will SMS you when it arrives. Is this book a gift for someone?', taskRu: 'Да, это подарок на день рождения другу, можете ли вы упаковать книгу в подарочную бумагу?', hintSkeleton: 'Yes, it is a birthday present for a friend, could you wrap the book in gift paper?', variants: ['Yes, it is a birthday present for a friend, could you wrap the book in gift paper?', 'Indeed, it\'s a birthday gift for a close friend, do you offer complimentary gift wrapping?', 'Yes, it\'s a birthday present, could you wrap it nicely in decorative paper?'] },
