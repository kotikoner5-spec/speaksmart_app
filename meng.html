<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тренажер диалогов: 30 жизненных переписок</title>
    
    <!-- Подключение единой дизайн-системы и Telegram SDK -->
    <link rel="stylesheet" href="theme.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="tma-bridge.js"></script>

    <style>
        /* Специфические стили интерактивного мессенджера */
        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        .chat-header {
            height: calc(60px + var(--sa-t));
            padding-top: var(--sa-t);
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: calc(14px + var(--sa-l));
            padding-right: calc(14px + var(--sa-r));
            flex-shrink: 0;
            z-index: 10;
        }

        .btn-menu {
            background: #1f2937;
            border: 1px solid var(--card-border);
            color: #60a5fa;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        .contact-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #374151;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .contact-text {
            display: flex;
            flex-direction: column;
        }

        .contact-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
        }

        .contact-status {
            font-size: 0.7rem;
            color: var(--pos);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--pos);
        }

        .progress-pill {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--gold);
            background: var(--gold-bg);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid var(--gold);
        }

        .chat-stream {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .chat-stream::-webkit-scrollbar { display: none; }

        .msg-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.92rem;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: fadeIn 0.25s ease-out;
        }

        .msg-incoming {
            background: #1f2937;
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg-outgoing {
            background: #2563eb;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg-top-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .msg-incoming .word { color: #93c5fd; }
        .msg-outgoing .word { color: #e0f2fe; }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: #1f2937;
            padding: 10px 14px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            gap: 4px;
            align-items: center;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .prompt-dock {
            background: #111827;
            border-top: 1px solid var(--card-border);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-title {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--gold);
            text-transform: uppercase;
        }

        .hint-toggle-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        .task-ru {
            font-size: 0.88rem;
            font-weight: 600;
            color: #f1f5f9;
            line-height: 1.35;
        }

        .skeleton-hint {
            font-size: 0.75rem;
            color: #cbd5e1;
            background: rgba(0,0,0,0.3);
            padding: 6px 8px;
            border-radius: 6px;
            font-family: ui-monospace, Consolas, monospace;
            display: none;
        }

        .input-bar {
            background: #0b0f19;
            padding: 10px 14px calc(14px + var(--sa-b)) 14px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            background: #1f2937;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }
        .chat-input:focus { border-color: var(--primary); }

        .send-btn {
            background: var(--primary);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .drawer-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            align-items: flex-end;
        }

        .drawer-card {
            background: #111827;
            border-top: 1px solid var(--card-border);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 16px;
            padding-bottom: calc(20px + var(--sa-b));
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--card-border);
        }

        .drawer-title {
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
        }

        .drawer-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .drawer-item {
            background: #1f2937;
            border: 1px solid var(--card-border);
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .drawer-item.active { border-color: var(--primary); background: rgba(59, 130, 246, 0.15); }

        .drawer-item-avatar { font-size: 1.4rem; }
        .drawer-item-content { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .drawer-item-title { font-size: 0.88rem; font-weight: 700; color: #fff; }
        .drawer-item-desc { font-size: 0.75rem; color: var(--text-muted); }

        .variants-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 110;
            padding: 16px;
            align-items: center;
            justify-content: center;
        }

        .variant-item {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.86rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="chat-header">
        <button class="btn-menu" onclick="openDrawer()">☰ Все диалоги (30)</button>
        <div class="contact-info">
            <div class="avatar" id="contactAvatar">🏠</div>
            <div class="contact-text">
                <div class="contact-name" id="contactName">Mr. Henderson</div>
                <div class="contact-status"><span class="status-dot"></span> Online</div>
            </div>
        </div>
        <div class="progress-pill" id="progressPill">Шаг 1 из 3</div>
    </div>

    <!-- Chat Messages -->
    <div class="chat-stream" id="chatStream">
        <div class="typing-indicator" id="typingIndicator">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
    </div>

    <!-- Task Prompt & Skeleton Dock -->
    <div class="prompt-dock">
        <div class="task-header">
            <div class="task-title">🎯 Ваша задача (Передайте мысль на English):</div>
            <button class="hint-toggle-btn" onclick="toggleSkeletonHint()">💡 Подсказка скелета</button>
        </div>
        <div class="task-ru" id="taskRu">Загрузка задачи...</div>
        <div class="skeleton-hint" id="skeletonHint">...</div>
    </div>

    <!-- Input Bar -->
    <div class="input-bar">
        <input type="text" id="chatInput" class="chat-input" placeholder="Напечатайте ответ на английском..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="send-btn" onclick="handleSend()">➤</button>
    </div>

    <!-- Drawer: 30 Scenarios Selector -->
    <div class="drawer-modal" id="drawerModal" onclick="closeDrawer(event)">
        <div class="drawer-card" onclick="event.stopPropagation()">
            <div class="drawer-header">
                <div class="drawer-title">Выберите диалог:</div>
                <button style="background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;" onclick="closeDrawer()">✕</button>
            </div>
            <div class="drawer-list" id="drawerList"></div>
        </div>
    </div>

    <!-- Variants Help Modal -->
    <div class="variants-modal" id="variantsModal">
        <div class="card" style="max-width: 500px; width: 100%; display: flex; flex-direction: column; gap: 12px;">
            <div style="font-size: 0.95rem; font-weight: 800; color: var(--gold);">⚠️ Сравните со своими словами:</div>
            <div style="font-size: 0.78rem; color: var(--text-muted);">Нажмите на любой эталонный вариант, чтобы вставить его:</div>
            <div id="variantsList" style="display: flex; flex-direction: column; gap: 8px;"></div>
            <div id="modalExp" style="font-size: 0.78rem; color: #94a3b8; margin-top: 4px;"></div>
            <button style="background:var(--primary);color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700;cursor:pointer;" onclick="closeVariantsModal()">Понятно, пробую снова</button>
        </div>
    </div>

                { incoming: 'Bookings open exactly 72 hours prior to each class. What if you need to cancel a booking?', taskRu: 'Взимается ли штраф, если я отменю бронь тренировки менее чем за два часа?', hintSkeleton: 'Is there a penalty fee if I cancel a class booking less than two hours before?', variants: ['Is there a penalty fee if I cancel a class booking less than two hours before?', 'Do you charge a late cancellation fine if I cancel within two hours of the class?', 'Will I be penalized if I fail to cancel my workout spot two hours in advance?'], exp: 'Penalty fee / late cancellation fine.' },
                { incoming: 'A $5 late cancellation fee applies if cancelled within 2 hours. How does auto-renewal work for you?', taskRu: 'Продлевается ли мой годовой контракт автоматически после окончания срока?', hintSkeleton: 'Does my annual contract renew automatically once the term expires?', variants: ['Does my annual contract renew automatically once the term expires?', 'Will my yearly membership be auto-renewed when the 12 months are up?', 'Does the agreement automatically roll over into a new annual period?'], exp: 'Renew automatically / auto-renew.' },
                { incoming: 'It transitions to month-to-month billing unless you notify us 30 days prior to expiration.', taskRu: 'За сколько дней я должен уведомить клуб об отказе от автоматического продления?', hintSkeleton: 'How many days notice must I give to opt out of automatic contract renewal?', variants: ['How many days notice must I give to opt out of automatic contract renewal?', 'How far in advance must I submit a written cancellation notice?', 'How many days before expiration do you require notice to cancel auto-renewal?'], exp: 'How many days notice to opt out of auto-renewal.' },
                { incoming: 'Written notice 30 days in advance via email or at the reception desk is required.', taskRu: 'Могу ли я разморозить карту раньше, если моя командировка завершится быстрее?', hintSkeleton: 'Can I unfreeze my membership earlier if my business trip ends ahead of schedule?', variants: ['Can I unfreeze my membership earlier if my business trip ends ahead of schedule?', 'Is it possible to reactivate my card early if I return from my trip sooner?', 'Can I cancel the freeze early if my business trip wraps up ahead of time?'], exp: 'Unfreeze membership earlier / ahead of schedule.' },
                { incoming: 'Absolutely! Just scan your barcode at the turnstile anytime and the freeze cancels automatically.', taskRu: 'Это очень удобно. Пожалуйста, отправьте мне подтверждение заморозки на почту.', hintSkeleton: 'That is very convenient. Please send me the freeze confirmation by email.', variants: ['That is very convenient. Please send me the freeze confirmation by email.', 'That sounds great and flexible. Could you email me the freeze receipt?', 'Very convenient. Please forward the written freeze confirmation to my inbox.'], exp: 'Freeze confirmation by email.' },
                { incoming: 'Confirmation email sent! Have a productive and safe business trip, see you in three weeks!', taskRu: 'Большое спасибо за подробные разъяснения, Маркус. До встречи через три недели!', hintSkeleton: 'Thank you very much for the thorough explanations, Marcus. See you in three weeks!', variants: ['Thank you very much for the thorough explanations, Marcus. See you in three weeks!', 'Thanks a lot for your help Marcus, appreciate it. See you in three weeks!', 'Thank you Marcus, great service as always. See you when I get back!'], exp: 'Thorough explanations + See you in three weeks.' }
            ]},
            { id: 11, avatar: '💼', title: '12. 💼 Собеседование (HR)', desc: 'Зарплатные ожидания, опционы, гибридный график, страховка и оффер', name: 'Rachel (Talent Lead)', steps: [
                { incoming: 'The team really enjoyed speaking with you! What are your compensation expectations for this position?', taskRu: 'Основываясь на моих навыках и требованиях роли, я рассчитываю на $90,000 в год.', hintSkeleton: 'Based on my skills and the role requirements, I am expecting 90000 a year.', variants: ['Based on my skills and the role requirements, I am expecting 90000 a year.', 'Based on my experience and the job requirements, I am looking for 90000 per year.', 'Given my skills and the requirements, I expect around 90000 a year.'], exp: 'Based on my skills + expect / look for + per year.' },
                { incoming: 'That is definitely within our budget range. If we extend an offer by Friday, when could you realistically start?', taskRu: 'Мне нужно отработать две недели на текущей работе, так что я смогу начать через месяц.', hintSkeleton: 'I need to give two weeks notice at my current job so I can start in a month.', variants: ['I need to give two weeks notice at my current job so I can start in a month.', 'I have to give two weeks\' notice at my current job, so I can start in a month.', 'I need to give two weeks notice at my current job, so I\'ll be able to start in a month.'], exp: 'Give two weeks\' notice = отработать 2 недели.' },
                { incoming: 'A one-month transition timeline is completely reasonable. Does your current role include a bonus structure?', taskRu: 'Включает ли предлагаемый компенсационный пакет ежегодный бонус за результаты?', hintSkeleton: 'Does the offered compensation package include an annual performance bonus?', variants: ['Does the offered compensation package include an annual performance bonus?', 'Is an annual performance-based bonus included in the total compensation?', 'Does this role come with an annual bonus tied to company and individual KPIs?'], exp: 'Annual performance bonus (годовой бонус).' },
                { incoming: 'We offer an annual target bonus of up to 15% based on company and individual performance milestones.', taskRu: 'Предоставляются ли опционы на акции компании как часть начального оффера?', hintSkeleton: 'Are stock options or equity grants provided as part of the initial offer?', variants: ['Are stock options or equity grants provided as part of the initial offer?', 'Does the initial compensation package include company stock options or RSUs?', 'Is equity included in the starting compensation for this engineering role?'], exp: 'Stock options / equity grants (опционы на акции).' },
                { incoming: 'Yes, eligible candidates receive an equity grant of stock options. Are you familiar with vesting schedules?', taskRu: 'Какой график вестинга опционов стандартно применяется в вашей компании?', hintSkeleton: 'What vesting schedule for stock options is standardly applied in your company?', variants: ['What vesting schedule for stock options is standardly applied in your company?', 'What is your standard stock option vesting schedule and is there a one-year cliff?', 'How does the option vesting work, is it standard four-year vesting with a cliff?'], exp: 'Vesting schedule with a one-year cliff (вестинг опционов).' },
                { incoming: 'We use the industry-standard 4-year vesting schedule with a 1-year cliff. How about health coverage?', taskRu: 'Что именно покрывает корпоративный пакет медицинского и стоматологического страхования?', hintSkeleton: 'What exactly does the corporate medical and dental insurance package cover?', variants: ['What exactly does the corporate medical and dental insurance package cover?', 'What is included in the company comprehensive health, dental, and vision insurance?', 'Could you describe the scope of your corporate medical and dental insurance plans?'], exp: 'Medical, dental, and vision insurance package.' },
                { incoming: 'We cover 100% of employee healthcare premiums and 75% for dependents, including vision and dental.', taskRu: 'Софинансирует ли компания пенсионные отчисления сотрудников по программе 401k?', hintSkeleton: 'Does the company match employee 401k retirement contributions?', variants: ['Does the company match employee 401k retirement contributions?', 'Is there a 401k employer match program available for retirement savings?', 'Does the employer match 401k retirement contributions, and up to what percentage?'], exp: 'Match employee 401k retirement contributions (софинансирование пенсии).' },
                { incoming: 'We match up to 4% of your salary dollar-for-dollar immediately upon hire. What work setup do you prefer?', taskRu: 'Какова официальная политика компании относительно удаленной работы и гибких часов?', hintSkeleton: 'What is the company official policy regarding remote work and flexible hours?', variants: ['What is the company official policy regarding remote work and flexible hours?', 'What is your official stance on remote work versus working from the office?', 'Could you explain the company policy concerning hybrid schedules and flexible hours?'], exp: 'Remote work and flexible hours (удаленка и гибкие часы).' },
                { incoming: 'We operate on a hybrid model: 2 days in the downtown office and 3 days remote from home.', taskRu: 'В какие конкретно дни недели команда собирается в офисе для совместной работы?', hintSkeleton: 'On which specific days of the week does the team gather in the office for collaboration?', variants: ['On which specific days of the week does the team gather in the office for collaboration?', 'Which days are mandatory for in-office presence across the engineering team?', 'What are the designated anchor days when everyone works from the office?'], exp: 'Designated anchor days / mandatory in-office presence.' },
                { incoming: 'Tuesdays and Thursdays are our collaborative core anchor days. Do you have a home office setup?', taskRu: 'Выделяет ли компания единовременное пособие на обустройство домашнего рабочего места?', hintSkeleton: 'Does the company provide a one-time home office equipment stipend?', variants: ['Does the company provide a one-time home office equipment stipend?', 'Is there a work-from-home allowance to purchase monitors and an ergonomic chair?', 'Do you offer a home office setup stipend for remote work gear?'], exp: 'Home office equipment stipend (пособие на обустройство рабочего места).' },
                { incoming: 'We offer a $1,000 WFH reimbursement for monitors, desk, and ergonomic chairs, plus a MacBook Pro.', taskRu: 'Сколько дней оплачиваемого отпуска и больничных предоставляется в год?', hintSkeleton: 'How many days of paid time off and sick leave are provided annually?', variants: ['How many days of paid time off and sick leave are provided annually?', 'How many PTO days and paid sick days do employees receive each year?', 'What is your annual paid vacation allowance and sick leave policy?'], exp: 'Paid time off (PTO) and sick leave.' },
                { incoming: 'We provide 20 days of paid vacation, 10 corporate holidays, and unlimited paid sick leave days.', taskRu: 'Сколько человек сейчас насчитывает инженерная команда, с которой я буду работать?', hintSkeleton: 'How many people does the engineering team currently have that I will be working with?', variants: ['How many people does the engineering team currently have that I will be working with?', 'What is the current size of the engineering team I would be joining?', 'How many developers and designers are currently in this product squad?'], exp: 'Size of the engineering team / product squad.' },
                { incoming: 'The squad consists of 6 developers, a QA lead, a UI/UX designer, and an agile Product Manager.', taskRu: 'Какой методологии разработки придерживается команда — Scrum с двухнедельными спринтами?', hintSkeleton: 'Which development methodology does the team follow — Scrum with two-week sprints?', variants: ['Which development methodology does the team follow — Scrum with two-week sprints?', 'Does the engineering team practice Agile Scrum with two-week sprint cycles?', 'What software development workflow do you use, is it Scrum or Kanban?'], exp: 'Scrum with two-week sprints.' },
                { incoming: 'Yes, classic 2-week sprints with daily 15-minute standups and bi-weekly retrospectives.', taskRu: 'Как устроена система оценки результатов и пересмотра заработной платы?', hintSkeleton: 'How is the performance review and salary adjustment system structured?', variants: ['How is the performance review and salary adjustment system structured?', 'What is the structure for performance evaluations and annual salary reviews?', 'How frequently do you conduct performance reviews and promotional evaluations?'], exp: 'Performance review and salary adjustment system.' },
                { incoming: 'We conduct formal 360-degree performance reviews bi-annually in June and December with merit raise opportunities.', taskRu: 'Предоставляет ли компания ежегодный бюджет на профессиональное обучение и конференции?', hintSkeleton: 'Does the company provide an annual budget for professional development and conferences?', variants: ['Does the company provide an annual budget for professional development and conferences?', 'Is there an annual educational stipend for tech conferences, books, and certifications?', 'Do you offer tuition assistance or a professional learning budget for engineers?'], exp: 'Annual budget for professional development.' },
                { incoming: 'Every team member gets an individual $1,500 annual learning stipend to use on courses or conferences.', taskRu: 'Каковы следующие этапы процесса найма перед принятием окончательного решения?', hintSkeleton: 'What are the next stages of the hiring process before a final decision is made?', variants: ['What are the next stages of the hiring process before a final decision is made?', 'What does the remainder of the interview process look like before an offer?', 'Are there any further interview rounds scheduled before management makes a decision?'], exp: 'Stages of the hiring process.' },
                { incoming: 'This was your final round! The interview committee convenes tomorrow afternoon for the hiring review.', taskRu: 'Когда я могу ожидать получить обратную связь по итогам сегодняшней беседы?', hintSkeleton: 'When can I expect to receive feedback following today\'s conversation?', variants: ['When can I expect to receive feedback following today\'s conversation?', 'How soon will you be able to provide feedback regarding today\'s interview?', 'When should I expect an email or call with the committee\'s decision?'], exp: 'Receive feedback following today\'s conversation.' },
                { incoming: 'I will call you by Friday 3 pm with the committee\'s decision and official offer details.', taskRu: 'Сколько времени у меня будет на рассмотрение контракта в случае получения оффера?', hintSkeleton: 'How much time will I have to review the contract terms if an offer is extended?', variants: ['How much time will I have to review the contract terms if an offer is extended?', 'If I receive a formal job offer, what is the deadline to accept or decline?', 'How many business days do candidates typically have to consider the job offer?'], exp: 'Time to review contract terms / consider the offer.' },
                { incoming: 'We typically allow 5 business days to review the written agreement, consult family, and ask questions.', taskRu: 'Это очень комфортный срок. Спасибо за подробные и прозрачные ответы на все вопросы.', hintSkeleton: 'That is a very comfortable timeframe. Thank you for the detailed and transparent answers.', variants: ['That is a very comfortable timeframe. Thank you for the detailed and transparent answers.', 'That sounds very fair and generous. Thank you for being so transparent and thorough.', 'That timeline works great. I truly appreciate your transparency regarding company benefits.'] },
                { incoming: 'It was a pleasure discussing this opportunity with you! Have a great evening and talk Friday!', taskRu: 'Взаимно, Рэйчел! Спасибо за уделенное время, буду ждать вашего звонка в пятницу.', hintSkeleton: 'Likewise, Rachel! Thank you for your time, I will look forward to your call on Friday.', variants: ['Likewise, Rachel! Thank you for your time, I will look forward to your call on Friday.', 'Same here Rachel! Thanks so much for your time, talk to you on Friday.', 'Thank you Rachel, it was a pleasure. Looking forward to hearing from you on Friday!'], exp: 'Likewise / look forward to your call.' }
            ]},
            { id: 12, avatar: '🌐', title: '13. 🌐 Интернет-провайдер', desc: 'Сбой оптического терминала, срочный выезд мастера, статический IP и компенсация', name: 'Liam (Technical Support)', steps: [
                { incoming: 'Spectrum Fiber Support, Liam speaking. Could you describe the issue with your connection?', taskRu: 'Красная лампочка горит на моем роутере, и у меня нет интернета уже час.', hintSkeleton: 'The red light is blinking on my router and I have had no internet for an hour.', variants: ['The red light is on my router and I have had no internet for an hour.', 'There is a red light on my router and my internet has been down for an hour.', 'The red light is blinking on my router and I have had no connection for an hour.'], exp: 'Has been down / have had no internet for an hour.' },
                { incoming: 'I am checking the line... It looks like an outage in your area. Our engineers are already working on it.', taskRu: 'У меня важная онлайн-конференция через тридцать минут. Есть ли примерное время восстановления?', hintSkeleton: 'I have an important conference call in thirty minutes. Is there an estimated restoration time?', variants: ['I have an important video call in thirty minutes. Is there an estimated time of resolution?', 'I have an important online meeting in thirty minutes. Is there an estimated restoration time?', 'I have a crucial conference call in 30 minutes. When will it be restored?'], exp: 'Estimated restoration time = расчетное время починки.' },
                { incoming: 'The current ETA is 3 hours due to damaged trunk cabling. Have you tried power cycling the optical ONT?', taskRu: 'Да, я уже дважды перезагружал и роутер, и оптический терминал, но сигнала нет.', hintSkeleton: 'Yes, I have already rebooted both the router and the optical terminal twice, but there is no signal.', variants: ['Yes, I have already rebooted both the router and the optical terminal twice, but there is no signal.', 'Yes, I power-cycled both the router and the ONT box twice with no success.', 'I already restarted both devices twice, the LOS light is still solid red.'] },
                { incoming: 'A solid red LOS light indicates zero optical signal reaching your unit. What color is the PON light?', taskRu: 'Индикатор PON полностью выключен и не светится зеленым.', hintSkeleton: 'The PON indicator light is completely off and not glowing green.', variants: ['The PON indicator light is completely off and not glowing green.', 'The PON light is dark, there is no green indicator light whatsoever.', 'The PON LED is completely off, only the red alarm LED is illuminated.'] },
                { incoming: 'That confirms a physical fiber break between your apartment and the building distribution frame.', taskRu: 'Можете ли вы проверить, доходит ли лазерный сигнал до нашего этажного распределительного щитка?', hintSkeleton: 'Can you check whether the optical signal reaches our floor distribution box?', variants: ['Can you check whether the optical signal reaches our floor distribution box?', 'Could you test if the fiber signal arrives at the floor junction box in my hallway?', 'Are you able to ping the floor distribution switch to see if the main riser is alive?'] },
                { incoming: 'Our telemetry shows the building riser is alive, meaning the micro-fiber patch cord to your flat is severed.', taskRu: 'Возможно ли вызвать аварийного выездного мастера для замены поврежденного кабеля сегодня?', hintSkeleton: 'Is it possible to dispatch an emergency field technician to replace the damaged cable today?', variants: ['Is it possible to dispatch an emergency field technician to replace the damaged cable today?', 'Can you send an emergency field engineer to repair the damaged fiber drop cable today?', 'Could you schedule an urgent technician visit today to replace the broken patch cord?'] },
                { incoming: 'We have an emergency field slot open between 4:00 pm and 6:00 pm today. Would that work?', taskRu: 'Да, этот временной интервал мне подходит, пожалуйста, забронируйте его.', hintSkeleton: 'Yes, that time slot works for me, please book it immediately.', variants: ['Yes, that time slot works for me, please book it immediately.', 'Yes, that window works perfectly, please lock in that appointment.', 'That time slot is fine, please schedule the technician for between 4 and 6 pm.'] },
                { incoming: 'Technician assigned! Will the technician need access to any locked telecom rooms in the basement?', taskRu: 'Да, я предупрежу консьержа, чтобы он открыл доступ в подвальную серверную.', hintSkeleton: 'Yes, I will notify the concierge to grant access to the basement telecom room.', variants: ['Yes, I will notify the concierge to grant access to the basement telecom room.', 'Yes, I will speak with building management to unlock the basement server room.', 'Yes, I\'ll ask the building superintendent to open the telecom distribution room.'] },
                { incoming: 'Excellent. The technician will call your registered phone 20 minutes prior to arrival. Need mobile data?', taskRu: 'Предоставляет ли ваша компания бесплатный пакет мобильного интернета в качестве резервного канала?', hintSkeleton: 'Does your company provide a complimentary mobile data bundle as a backup hotspot?', variants: ['Does your company provide a complimentary mobile data bundle as a backup hotspot?', 'Do you offer emergency mobile data allowances while broadband fiber is down?', 'Can you credit free mobile data to my phone so I can tether during the meeting?'] },
                { incoming: 'If you are also a Spectrum Mobile subscriber, I can instantly inject 50GB of high-speed hotspot data.', taskRu: 'Да, мой номер телефона зарегистрирован в вашей мобильной сети, пожалуйста, начислите трафик.', hintSkeleton: 'Yes, my phone number is registered with your mobile network, please credit the data.', variants: ['Yes, my phone number is registered with your mobile network, please credit the data.', 'Yes, I use Spectrum Mobile on this number, please activate the emergency 50GB bundle.', 'My mobile plan is with Spectrum on this account, please apply the hotspot allowance.'] },
                { incoming: '50GB high-speed tethering bundle applied! You can turn on your mobile hotspot now for the conference call.', taskRu: 'Спасибо, мобильная точка доступа работает, это спасет мою сегодняшнюю презентацию.', hintSkeleton: 'Thank you, the mobile hotspot is working, this will save my presentation today.', variants: ['Thank you, the mobile hotspot is working, this will save my presentation today.', 'Thanks so much, the hotspot is active now, that really saves my business meeting.', 'Great, the phone hotspot connected immediately, thank you for saving my presentation.'] },
                { incoming: 'Glad that worked out. While I have your file open, would you like me to inspect your Wi-Fi channel congestion?', taskRu: 'Можете ли вы удаленно перевести роутер в режим моста, чтобы я использовал собственную систему Mesh?', hintSkeleton: 'Can you remotely switch the router into bridge mode so I can use my own Mesh system?', variants: ['Can you remotely switch the router into bridge mode so I can use my own Mesh system?', 'Could you put the ISP gateway into transparent bridge mode for my third-party mesh router?', 'Are you able to configure bridge mode remotely so I can connect my own Wi-Fi mesh?'] },
                { incoming: 'I have queued the bridge mode provisioning script. It will apply as soon as the optical link restores.', taskRu: 'Поддерживает ли мой тариф постоянный статический IP-адрес для удаленного доступа к серверу?', hintSkeleton: 'Does my plan support a static public IP address for remote server access?', variants: ['Does my plan support a static public IP address for remote server access?', 'Can I get a dedicated static public IPv4 address on my current subscription?', 'Is a fixed static IP available on this fiber tier so I can host a home lab?'] },
                { incoming: 'Residential fiber accounts can add a dedicated static IPv4 address for an extra $5 per month.', taskRu: 'Пожалуйста, добавьте статический IP-адрес к моему тарифу, начиная со следующего расчетного периода.', hintSkeleton: 'Please add a static IP address to my plan starting from the next billing cycle.', variants: ['Please add a static IP address to my plan starting from the next billing cycle.', 'Please activate the static IPv4 add-on beginning with my next monthly bill.', 'Could you add the dedicated static IP to my subscription starting next billing period?'] },
                { incoming: 'Static IPv4 reservation added to next month\'s statement. What about downtime compensation?', taskRu: 'Будет ли мне начислена автоматическая компенсация в счете за время отсутствия связи?', hintSkeleton: 'Will a prorated credit be automatically applied to my monthly bill for the downtime?', variants: ['Will a prorated credit be automatically applied to my monthly bill for the downtime?', 'Does your service level agreement provide automatic billing credits for fiber outages?', 'Will you credit my account proportionately for the hours of lost service?'] },
                { incoming: 'Yes, outages exceeding 2 hours trigger an automatic 1-day service credit on your next monthly bill.', taskRu: 'Нужно ли мне заполнять отдельное заявление на компенсацию или она зачислится сама?', hintSkeleton: 'Do I need to submit a separate compensation claim or will it apply automatically?', variants: ['Do I need to submit a separate compensation claim or will it apply automatically?', 'Must I file a formal downtime credit request or does the system process it automatically?', 'Do I have to do any paperwork online or is the SLA credit applied seamlessly?'] },
                { incoming: 'No action needed on your part, our billing engine automatically detects outage timestamps and credits accounts.', taskRu: 'Появилась ли новая информация от аварийной бригады касательно починки магистрального кабеля?', hintSkeleton: 'Has any updated information arrived from the emergency crew regarding the trunk cable repair?', variants: ['Has any updated information arrived from the emergency crew regarding the trunk cable repair?', 'Is there any fresh update from the field crew fixing the neighborhood trunk line?', 'Did the network operations center issue a revised timeline for the main cable splicing?'] },
                { incoming: 'The trunk cable splicing is already 70% completed, so the main signal should return even before the technician arrives.', taskRu: 'Пожалуйста, пришлите мне SMS-уведомление, как только физический линк восстановится.', hintSkeleton: 'Please send me an SMS text alert as soon as the physical fiber link is restored.', variants: ['Please send me an SMS text alert as soon as the physical fiber link is restored.', 'Could you trigger an automated text notification once the optical signal comes back online?', 'Please notify me by SMS when the neighborhood line is officially up and running.'] },
                { incoming: 'SMS alert trigger enabled. The field technician is still scheduled for 4:30 pm just to inspect your drop cord.', taskRu: 'Отлично, я буду дома и встречу мастера в половине пятого.', hintSkeleton: 'Great, I will be home and meet the technician at four-thirty.', variants: ['Great, I will be home and meet the technician at four-thirty.', 'Awesome, I will be at the apartment waiting for the technician at 4:30 pm.', 'Understood, I\'ll remain at home to let the field engineer in at half past four.'] },
                { incoming: 'Case ticket #884912 is logged. Good luck with your online conference call, and have a pleasant afternoon!', taskRu: 'Большое спасибо за оперативную помощь и предоставленный мобильный трафик, Лиам!', hintSkeleton: 'Thank you very much for the prompt assistance and the complimentary mobile data, Liam!', variants: ['Thank you very much for the prompt assistance and the complimentary mobile data, Liam!', 'Thanks a lot for your quick help and emergency hotspot data Liam, really appreciate it!', 'Thank you so much Liam, your support was fast, effective, and professional. Goodbye!'] }
            ]},
            { id: 13, avatar: '🚕', title: '14. 🚕 Такси и водитель', desc: 'Сложная точка посадки, платные трассы, багаж, кондиционер и заезд в банк', name: 'Tariq (Uber Driver)', steps: [
                { incoming: 'Hi! I am in the silver Camry outside the main shopping mall entrance, but I do not see you.', taskRu: 'Я стою у северного выхода возле аптеки. Можете подъехать сюда?', hintSkeleton: 'I am standing by the north exit near the pharmacy. Can you drive around here?', variants: ['I am standing by the north exit near the pharmacy. Can you drive around here?', 'I am at the north exit next to the pharmacy. Could you pull up here?', 'I\'m waiting by the north entrance near the pharmacy. Can you come around here?'], exp: 'Pull up / drive around here = подъехать сюда.' },
                { incoming: 'Got it! There is a little bit of traffic around the corner, I will be right there in two minutes.', taskRu: 'Хорошо, без проблем, я в черном пальто и держу серый зонт.', hintSkeleton: 'No problem, I am wearing a black coat and holding a grey umbrella.', variants: ['No problem I am wearing a black coat and holding a grey umbrella.', 'Great, no rush! I am wearing a black coat and holding a gray umbrella.', 'Okay, I am in a black coat holding a grey umbrella.'], exp: 'Wearing a coat and holding an umbrella.' },
                { incoming: 'I see you waving! Pulling up to the curb with hazard lights on right now.', taskRu: 'Здравствуйте! Не могли бы вы открыть багажник, чтобы я положил два тяжелых чемодана?', hintSkeleton: 'Hello! Could you please pop the trunk so I can load two heavy suitcases?', variants: ['Hello! Could you please pop the trunk so I can load two heavy suitcases?', 'Hi there! Can you open the trunk from inside so I can put my luggage in?', 'Hello! Could you unlock the trunk so I can load two large suitcases please?'], exp: 'Pop the trunk (открыть багажник из салона).' },
                { incoming: 'Trunk is open! Let me step out and give you a hand with those bulky bags.', taskRu: 'Пожалуйста, будьте аккуратны с синей сумкой, внутри находится хрупкая стеклянная посуда.', hintSkeleton: 'Please be careful with the blue bag, there is fragile glassware inside.', variants: ['Please be careful with the blue bag, there is fragile glassware inside.', 'Handle the blue bag gently please, it contains fragile glass souvenirs.', 'Please take care with the blue suitcase, there are breakable glass items in there.'], exp: 'Fragile glassware inside (хрупкое стекло внутри).' },
                { incoming: 'Packed safely and trunk closed! Please make yourself comfortable and buckle up your seatbelt.', taskRu: 'Спасибо! Не могли бы вы немного убавить кондиционер, в салоне довольно прохладно.', hintSkeleton: 'Thank you! Could you please turn down the air conditioning slightly, it is quite chilly in here.', variants: ['Thank you! Could you please turn down the air conditioning slightly, it is quite chilly in here.', 'Thanks! Could you turn the AC down a bit, it\'s feeling rather cold in the back seat.', 'Thank you, could you adjust the air conditioner, it feels a bit too chilly back here?'], exp: 'Turn down the air conditioning slightly.' },
                { incoming: 'Adjusted to 22 degrees! GPS is showing our destination as Terminal 3 at the International Airport.', taskRu: 'Нам необходимо прибыть в терминал до половины шестого вечера, чтобы успеть на регистрацию.', hintSkeleton: 'We need to arrive at the terminal before five-thirty pm to catch our flight check-in.', variants: ['We need to arrive at the terminal before five-thirty pm to catch our flight check-in.', 'We must reach Terminal 3 by 5:30 pm at the latest for passenger check-in.', 'It is crucial that we arrive before half past five to make our flight check-in deadline.'] },
                { incoming: 'Rush hour is starting. The free local road has heavy congestion, but the toll highway is completely green.', taskRu: 'Намного ли быстрее ехать по платной скоростной автомагистрали в это время суток?', hintSkeleton: 'Is it much faster to take the toll expressway at this time of day?', variants: ['Is it much faster to take the toll expressway at this time of day?', 'How much travel time will we save if we take the highway toll road instead?', 'Is the toll highway significantly quicker given the evening rush hour traffic?'] },
                { incoming: 'The toll highway saves at least 25 minutes and guarantees we arrive by 5:10 pm.', taskRu: 'Включается ли плата за проезд по платной трассе автоматически в итоговый чек в приложении?', hintSkeleton: 'Is the highway toll fee automatically added to the final trip fare in the app?', variants: ['Is the highway toll fee automatically added to the final trip fare in the app?', 'Do electronic toll charges get added to my Uber receipt automatically?', 'Will the toll road charges be billed directly to my credit card through the app?'] },
                { incoming: 'Yes, the toll transponder charges Uber directly, no cash is needed. Should we take the expressway?', taskRu: 'Да, пожалуйста, поезжайте по платной трассе, мы не можем рисковать опозданием на самолет.', hintSkeleton: 'Yes, please take the toll highway, we cannot risk missing our flight.', variants: ['Yes, please take the toll highway, we cannot risk missing our flight.', 'Definitely take the toll expressway, we cannot afford to miss our flight.', 'Please take the toll route, avoiding traffic delays is our top priority.'] },
                { incoming: 'Taking the highway on-ramp now. Smooth sailing from here!', taskRu: 'Можем ли мы сделать короткую остановку на две минуты возле круглосуточного банкомата по пути?', hintSkeleton: 'Can we make a brief two-minute stop near a 24-hour ATM on the way?', variants: ['Can we make a brief two-minute stop near a 24-hour ATM on the way?', 'Would it be possible to pull over for two minutes by an ATM along our route?', 'Could we make a quick stop at an ATM machine before hitting the airport highway?'] },
                { incoming: 'Sure, but please add the ATM stop in your Uber app so the GPS recalculates the route.', taskRu: 'Я только что добавил промежуточную остановку в маршрут поездки в своем телефоне.', hintSkeleton: 'I have just added the intermediate stop to the trip route on my phone.', variants: ['I have just added the intermediate stop to the trip route on my phone.', 'I just updated the ride route with the ATM waypoint in the mobile app.', 'Done, I added the quick intermediate stop to our navigation in the app.'] },
                { incoming: 'Route updated on my dashboard! I will pull into the bank lane right after this traffic light.', taskRu: 'Взимает ли приложение дополнительную плату за время ожидания во время остановки?', hintSkeleton: 'Does the app charge an extra fee for wait time during the intermediate stop?', variants: ['Does the app charge an extra fee for wait time during the intermediate stop?', 'Is there a per-minute waiting fee charged by the app while I use the ATM?', 'Will the app automatically bill waiting time while you wait for me at the curb?'] },
                { incoming: 'The first 2 minutes are free, then it is just 35 cents per minute. Take your time!', taskRu: 'Я сниму наличные за одну минуту и сразу вернусь в машину.', hintSkeleton: 'I will withdraw cash in under a minute and return to the car immediately.', variants: ['I will withdraw cash in under a minute and return to the car immediately.', 'I\'ll be super fast at the cash machine, back in sixty seconds.', 'I\'ll grab the cash from the ATM within a minute and jump right back in.'] },
                { incoming: 'Back on the highway! By the way, do you need to charge your phone in the back?', taskRu: 'Да, есть ли у вас зарядный провод USB-C или Lightning для айфона?', hintSkeleton: 'Yes, do you happen to have a USB-C or iPhone Lightning charging cable?', variants: ['Yes, do you happen to have a USB-C or iPhone Lightning charging cable?', 'Yes please, do you have an iPhone charging cable available in the back seat?', 'That would be great! Is there a USB-C charging cord plugged in back here?'] },
                { incoming: 'There is a multi-head charging cable plugged into the center console right behind you.', taskRu: 'Спасибо большое, телефон заряжается. Не возражаете, если я сделаю короткий деловой звонок?', hintSkeleton: 'Thank you very much, the phone is charging. Do you mind if I make a brief business phone call?', variants: ['Thank you very much, the phone is charging. Do you mind if I make a brief business phone call?', 'Thanks, it\'s connected. Is it okay if I take a quick work-related phone call?', 'Much appreciated! Would you mind if I had a short hands-free business call?'] },
                { incoming: 'Not at all, go right ahead! I will turn the radio volume down so it is quiet for you.', taskRu: 'Я закончил разговор. Подскажите, из какого терминала вылетает рейс British Airways?', hintSkeleton: 'I finished my call. Could you tell me which terminal British Airways flights depart from?', variants: ['I finished my call. Could you tell me which terminal British Airways flights depart from?', 'All done with the call. Do you know which terminal British Airways uses at this airport?', 'Thanks for turning down the music. Which terminal is designated for British Airways?'] },
                { incoming: 'British Airways departs from Terminal 3, zone B. We are approaching the airport ramps now.', taskRu: 'Пожалуйста, высадите нас на верхнем уровне зоны вылета возле входа номер четыре.', hintSkeleton: 'Please drop us off at the upper departures level near entrance number four.', variants: ['Please drop us off at the upper departures level near entrance number four.', 'Could you pull up to the upper departures curb right outside door 4?', 'Please drop us by door number 4 on the upper departures concourse.'] },
                { incoming: 'Pulling up to door 4 right now. It is 5:08 pm — plenty of time for your check-in!', taskRu: 'Мы доехали замечательно быстро! Помогите мне, пожалуйста, выгрузить чемоданы на тротуар.', hintSkeleton: 'We arrived remarkably fast! Could you please help me unload the suitcases onto the curb?', variants: ['We arrived remarkably fast! Could you please help me unload the suitcases onto the curb?', 'That was incredibly fast! Could you give me a hand getting the luggage onto the sidewalk?', 'Fantastic driving, we made great time. Can you assist me with the bags from the trunk?'] },
                { incoming: 'Here are both suitcases and the fragile blue bag safe and sound. Check the back seat for belongings!', taskRu: 'Все вещи на месте. Я оставил вам двадцать процентов чаевых и пять звезд в приложении.', hintSkeleton: 'Everything is here. I have left you a twenty percent tip and a five-star rating in the app.', variants: ['Everything is here. I have left you a twenty percent tip and a five-star rating in the app.', 'All accounted for. I just submitted a 5-star rating and added a 20% gratuity in the app.', 'Nothing left behind. I tipped you 20% on the app and gave you five stars for the great ride!'] },
                { incoming: 'Thank you so much, generous tips like yours mean the world! Safe flight and travel safe!', taskRu: 'Спасибо за приятную и безопасную поездку, Тарик! Удачи на дорогах и хорошей смены!', hintSkeleton: 'Thank you for the pleasant and safe ride, Tariq! Best of luck on the road and have a great shift!', variants: ['Thank you for the pleasant and safe ride, Tariq! Best of luck on the road and have a great shift!', 'Thanks for the smooth and comfortable trip Tariq! Drive safe and have a wonderful day!', 'Much appreciated Tariq, fantastic service! Take care on the roads and have a profitable evening!'] }
            ]},
            { id: 14, avatar: '☕', title: '15. ☕ Заказ в кофейне', desc: 'Овсяное молоко, помол зерен под воронку, подогрев выпечки, скидка за свой стакан и чек', name: 'Hannah (Barista)', steps: [
                { incoming: 'Good morning! What can I get started for you today?', taskRu: 'Можно мне большой латте на овсяном молоке с одним шотом эспрессо?', hintSkeleton: 'Can I get a large latte with oat milk and a single shot of espresso?', variants: ['Can I get a large latte with oat milk and a single shot of espresso?', 'Could I have a large oat milk latte with a single espresso shot?', 'I would like a large latte made with oat milk and one shot of espresso please.'], exp: 'Can I get / Could I have + with oat milk.' },
                { incoming: 'Sure! Would you like any flavors, and do you prefer it extra hot or regular temp?', taskRu: 'Пожалуйста, сделайте обычной температуры и добавьте ванильный сироп без сахара.', hintSkeleton: 'Regular temperature please, and could you add sugar-free vanilla syrup?', variants: ['Regular temperature please, and add sugar-free vanilla syrup.', 'Regular temp please, and could you add sugar-free vanilla syrup?', 'Regular temperature please, with sugar-free vanilla syrup.'], exp: 'Sugar-free syrup = сироп без сахара.' },
                { incoming: 'Got it, sugar-free vanilla. Do you want our standard house espresso roast or decaf beans?', taskRu: 'Есть ли у вас кофе без кофеина для этого напитка?', hintSkeleton: 'Do you have decaf espresso beans available for this drink?', variants: ['Do you have decaf espresso beans available for this drink?', 'Could you pull this latte using decaffeinated espresso beans?', 'Is decaf espresso an option for this oat latte?'] },
                { incoming: 'Yes, our Swiss Water processed decaf is rich and chocolatey. What brand of oat milk do you prefer?', taskRu: 'Какую марку овсяного молока вы используете для взбивания пены — Oatly Barista?', hintSkeleton: 'Which brand of oat milk do you use for steaming — Oatly Barista?', variants: ['Which brand of oat milk do you use for steaming — Oatly Barista?', 'What brand of oat milk do you steam with, is it Oatly Barista Edition?', 'Do you use Oatly Barista or another brand for the milk foam?'] },
                { incoming: 'We use Oatly Barista Edition exclusively, it creates velvety microfoam. Want it wet or dry foam?', taskRu: 'Пожалуйста, сделайте шелковистую бархатную пенку, почти как в классическом флэт-уайте.', hintSkeleton: 'Please make silky velvety microfoam, almost like in a classic flat white.', variants: ['Please make silky velvety microfoam, almost like in a classic flat white.', 'I would love silky microfoam with a velvety texture, similar to a flat white.', 'Please steam it with fine velvety foam on top, like a traditional flat white.'] },
                { incoming: 'Silky microfoam latte coming up. Would you like anything from our pastry display today?', taskRu: 'Есть ли у вас выпечка или десерты без глютена на витрине?', hintSkeleton: 'Do you have any gluten-free bakery items or pastries in the display case?', variants: ['Do you have any gluten-free bakery items or pastries in the display case?', 'Are there any gluten-free baked goods or treats available this morning?', 'Which of the items in your pastry case are certified gluten-free?'] },
                { incoming: 'Our blueberry almond muffin and chocolate chia cookies are 100% gluten-free and baked fresh.', taskRu: 'Какая мука используется для приготовления чернично-миндального маффина?', hintSkeleton: 'What kind of flour is used in the blueberry almond muffin?', variants: ['What kind of flour is used in the blueberry almond muffin?', 'Which alternative flour do you use for the blueberry almond muffin?', 'Is the blueberry almond muffin baked with almond flour or oat flour?'] },
                { incoming: 'It is made with certified organic almond and rice flour, lightly sweetened with maple syrup.', taskRu: 'Звучит аппетитно, возьму черничный маффин. Можете ли вы подогреть его в печи тридцать секунд?', hintSkeleton: 'Sounds delicious, I will take the blueberry muffin. Could you warm it up in the oven for thirty seconds?', variants: ['Sounds delicious, I will take the blueberry muffin. Could you warm it up in the oven for thirty seconds?', 'Sounds great, I\'ll have the blueberry muffin. Can you heat it up in the oven for 30 seconds?', 'That sounds lovely, one blueberry muffin please. Could you warm it in the toaster oven briefly?'] },
                { incoming: 'Heating the muffin now! By the way, I notice you brought your own travel tumbler mug.', taskRu: 'Предоставляется ли скидка, если я беру кофе в свою собственную термокружку?', hintSkeleton: 'Do you offer a discount if I take coffee in my own reusable travel tumbler mug?', variants: ['Do you offer a discount if I take coffee in my own reusable travel tumbler mug?', 'Is there a discount for bringing a personal reusable thermal cup?', 'Do customers get a discount when using their own travel coffee mug?'] },
                { incoming: 'We give a 50-cent discount for every drink ordered in a reusable personal container.', taskRu: 'Не могли бы вы ополоснуть мою кружку горячей водой перед приготовлением латте?', hintSkeleton: 'Could you please rinse my mug with boiling water before making the latte?', variants: ['Could you please rinse my mug with boiling water before making the latte?', 'Would you mind rinsing out my thermal tumbler with hot water first?', 'Can you give my reusable mug a quick hot water rinse before pouring?'] },
                { incoming: 'Rinsed and sanitized! Would you be interested in buying fresh whole coffee beans for home brewing?', taskRu: 'Какое зерно моносорта вы рекомендуете для альтернативного заваривания через воронку V60?', hintSkeleton: 'What single-origin beans do you recommend for pour-over V60 brewing?', variants: ['What single-origin beans do you recommend for pour-over V60 brewing?', 'Which single-origin coffee beans do you suggest for manual V60 filter brew?', 'What whole-bean single origin works best for home pour-over methods like Chemex or V60?'] },
                { incoming: 'Our washed Ethiopian Yirgacheffe is extraordinary — bright jasmine floral aromas and citrus acidity.', taskRu: 'Обладают ли эти эфиопские зерна фруктовыми нотками бергамота или больше шоколадным профилем?', hintSkeleton: 'Do these Ethiopian beans have fruity bergamot notes or more of a chocolate profile?', variants: ['Do these Ethiopian beans have fruity bergamot notes or more of a chocolate profile?', 'Are the flavor notes of this Ethiopian coffee fruity with citrus or chocolatey and earthy?', 'Does this specific roast lean towards floral peach notes or deep cocoa flavors?'] },
                { incoming: 'It has distinct peach and bergamot floral notes, very tea-like and clean body.', taskRu: 'Я возьму одну двухсотпятидесятиграммовую пачку эфиопских зерен, пожалуйста.', hintSkeleton: 'I will take one two-hundred-and-fifty-gram bag of the Ethiopian beans, please.', variants: ['I will take one two-hundred-and-fifty-gram bag of the Ethiopian beans, please.', 'I\'ll buy a 250g bag of the Ethiopian Yirgacheffe whole beans please.', 'Let me grab one 250-gram bag of those Ethiopian single-origin beans as well.'] },
                { incoming: 'Would you like us to grind the beans for you or will you grind them fresh at home?', taskRu: 'Можете ли вы смолоть эту пачку зерен под аэропресс средней фракцией?', hintSkeleton: 'Could you grind this bag of beans for an Aeropress with a medium grind size?', variants: ['Could you grind this bag of beans for an Aeropress with a medium grind size?', 'Can you grind these beans on a medium-fine setting suitable for an Aeropress?', 'Would you mind grinding this 250g bag for home Aeropress brewing please?'] },
                { incoming: 'Freshly ground to setting 5 on our Mahlkönig grinder. Do you collect loyalty stamps with us?', taskRu: 'Как работает ваша программа лояльности для постоянных гостей?', hintSkeleton: 'How does your customer loyalty rewards program work for regular guests?', variants: ['How does your customer loyalty rewards program work for regular guests?', 'Could you explain your loyalty rewards scheme for frequent visitors?', 'How do I collect points or stamps with your coffee shop loyalty club?'] },
                { incoming: 'Buy 9 handcrafted coffee drinks, and your 10th drink of any size is completely on the house.', taskRu: 'Могу ли я отсканировать электронную карту лояльности прямо из Apple Wallet на телефоне?', hintSkeleton: 'Can I scan the digital loyalty rewards card directly from Apple Wallet on my phone?', variants: ['Can I scan the digital loyalty rewards card directly from Apple Wallet on my phone?', 'Is there a digital loyalty pass I can add to my mobile wallet and scan at checkout?', 'Can I tap my digital rewards card using my smartphone screen?'] },
                { incoming: 'Just hold your phone near the optical reader beside the terminal to register your stamp.', taskRu: 'Готово, карта отсканирована. Принимаете ли вы бесконтактную оплату картой?', hintSkeleton: 'Done, card scanned. Do you accept contactless card payments?', variants: ['Done, card scanned. Do you accept contactless card payments?', 'Stamp registered! Can I pay using contactless card tap on this machine?', 'All scanned. Is contactless tap-to-pay enabled on your card reader?'] },
                { incoming: 'Yes, Apple Pay, Google Pay, and physical chip cards work. Terminal is ready whenever you are.', taskRu: 'Я приложил телефон. Распечатайте, пожалуйста, подробный бумажный чек для отчета по командировке.', hintSkeleton: 'I tapped my phone. Could you please print an itemized paper receipt for my business expense report?', variants: ['I tapped my phone. Could you please print an itemized paper receipt for my business expense report?', 'Payment sent. Could you print a detailed tax receipt so I can expense this with my employer?', 'Phone tapped. Please provide an itemized paper receipt for corporate expense reimbursement.'] },
                { incoming: 'Here is your itemized receipt showing the breakdown: coffee discount, muffin, and ground beans.', taskRu: 'Кофе пахнет восхитительно, и маффин идеально теплый. Огромное спасибо!', hintSkeleton: 'The coffee smells incredible and the muffin is perfectly warm. Thank you so much!', variants: ['The coffee smells incredible and the muffin is perfectly warm. Thank you so much!', 'The aroma of this decaf latte is fantastic, and the warm muffin looks delicious. Thanks a lot!', 'Everything looks and smells wonderful. Thank you for such attentive and friendly service!'] },
                { incoming: 'Enjoy your breakfast and your home Aeropress brewing! Have a wonderful and energizing day ahead!', taskRu: 'Спасибо за отличное обслуживание и позитивное утро, Ханна! Хорошего вам дня!', hintSkeleton: 'Thank you for the excellent service and positive morning, Hannah! Have a wonderful day!', variants: ['Thank you for the excellent service and positive morning, Hannah! Have a wonderful day!', 'Thanks for the great coffee and delightful service Hannah! Have a great shift today!', 'Much appreciated Hannah, best coffee shop in town. Have an awesome rest of your day!'] }
            ]},
            { id: 15, avatar: '👔', title: '16. 👔 Претензия в химчистке', desc: 'Жирное пятно на шерстяном пиджаке, тест растворителя, пуговицы и гарантия', name: 'Elena (Dry Cleaners)', steps: [
                { incoming: 'Here is your wool blazer, all wrapped and ready. That will be $24, please.', taskRu: 'Минутку, масляное пятно на правом рукаве все еще здесь.', hintSkeleton: 'Wait a minute, the oil stain on the right sleeve is still here.', variants: ['Wait a minute, the oil stain on the right sleeve is still here.', 'Hold on, the grease stain on the right sleeve has not come out.', 'Just a moment, the oil stain on the right sleeve is still visible.'], exp: 'Oil stain / grease stain + has not come out.' },
                { incoming: 'Oh, let me see... It appears our standard eco-cycle didn\'t lift it. I sincerely apologize.', taskRu: 'Можете ли вы почистить его повторно бесплатно с более сильным средством?', hintSkeleton: 'Could you clean it again free of charge with a stronger solvent?', variants: ['Could you re-clean it free of charge using a stronger stain remover?', 'Could you clean it again free of charge with a stronger product?', 'Can you run it through again at no extra charge with a stronger treatment?'], exp: 'Free of charge / at no extra charge = бесплатно.' },
                { incoming: 'We can re-treat it with specialized degreaser. What is the fabric composition of this blazer?', taskRu: 'Это стопроцентная натуральная шерсть с подкладкой из натурального шелка.', hintSkeleton: 'It is one hundred percent pure virgin wool with a natural silk lining.', variants: ['It is one hundred percent pure virgin wool with a natural silk lining.', 'The exterior is pure virgin wool and the interior lining is genuine silk.', 'It is made of 100% natural wool with pure silk inner lining.'] },
                { incoming: 'Wool and silk are delicate protein fibers. Harsh chemical spotters might cause slight discoloration.', taskRu: 'Не повредит ли сильный химический растворитель волокна ткани и не полиняет ли темно-синий цвет?', hintSkeleton: 'Will a stronger chemical solvent damage the delicate fibers or fade the navy color?', variants: ['Will a stronger chemical solvent damage the delicate fibers or fade the navy color?', 'Could an aggressive chemical remover ruin the wool fibers or bleed the dark blue dye?', 'Will the stronger solvent weaken the fabric or cause color fading on this navy blazer?'] },
                { incoming: 'Our master spotter will test the chemical on an unexposed interior hem first. Is that acceptable?', taskRu: 'Пожалуйста, обязательно проведите тест на внутреннем шве перед обработкой лицевой стороны рукава.', hintSkeleton: 'Please make sure to do a spot test on an inner seam before treating the outer sleeve.', variants: ['Please make sure to do a spot test on an inner seam before treating the outer sleeve.', 'Please test the chemical on an interior seam first before applying it to the front of the sleeve.', 'Be sure to perform a spot test on the inside hem prior to treating the outer fabric.'] },
                { incoming: 'Noted on the work order: interior spot test mandatory. Did you also notice this loose cuff button?', taskRu: 'Да, одна перламутровая пуговица на манжете оторвалась и потерялась.', hintSkeleton: 'Yes, one mother-of-pearl cuff button came off and was lost.', variants: ['Yes, one mother-of-pearl cuff button came off and was lost.', 'Yes, one of the genuine mother-of-pearl sleeve buttons detached and is missing.', 'Indeed, a mother-of-pearl button fell off the cuff and I couldn\'t find it.'] },
                { incoming: 'We have a matching collection of genuine horn and pearl buttons. Would you like our tailor to replace it?', taskRu: 'Может ли ваш портной пришить подходящую запасную пуговицу на левый манжет?', hintSkeleton: 'Could your tailor sew a matching replacement button onto the left cuff?', variants: ['Could your tailor sew a matching replacement button onto the left cuff?', 'Can your in-house tailor attach a matching replacement button to the sleeve?', 'Would your tailor be able to stitch a replacement button that matches the others?'] },
                { incoming: 'Minor button replacement and re-stitching is complimentary for dry cleaning customers.', taskRu: 'Это превосходно. Когда именно пиджак будет полностью готов после повторной чистки?', hintSkeleton: 'That is excellent. When exactly will the blazer be fully ready after the re-cleaning?', variants: ['That is excellent. When exactly will the blazer be fully ready after the re-cleaning?', 'That is great service. What day and time will the jacket be ready for pickup?', 'Wonderful. When can I realistically collect the blazer once it has been re-treated?'] },
                { incoming: 'Standard re-treatment takes 48 hours, so it would be ready by Friday afternoon at 3 pm.', taskRu: 'Можете ли вы ускорить процесс, чтобы я забрал его в четверг до пяти вечера?', hintSkeleton: 'Can you expedite the process so I can pick it up on Thursday before five pm?', variants: ['Can you expedite the process so I can pick it up on Thursday before five pm?', 'Could you rush the order so it is ready for collection on Thursday before 5 pm?', 'Is there an express option to have it finished by Thursday afternoon prior to 5 pm?'] },
                { incoming: 'I will mark it as Urgent Priority for our morning shift tomorrow. It will be ready Thursday by 4 pm.', taskRu: 'Что произойдет, если масляное пятно не отойдет даже после точечной химической обработки?', hintSkeleton: 'What happens if the oil stain does not come out even after spot chemical treatment?', variants: ['What happens if the oil stain does not come out even after spot chemical treatment?', 'What is your policy if the grease mark remains visible after the second clean?', 'What happens in the event that the stain cannot be removed despite advanced treatment?'] },
                { incoming: 'If we cannot lift it safely, we will issue a 100% refund for the dry cleaning cost of that item.', taskRu: 'Покрывает ли страховка ответственности вашего заведения порчу дорогой брендовой одежды?', hintSkeleton: 'Does your business liability insurance cover damage to expensive designer clothing?', variants: ['Does your business liability insurance cover damage to expensive designer clothing?', 'Is high-end designer apparel protected by your company liability insurance policy?', 'Does your commercial insurance reimburse the replacement value if a luxury garment is damaged?'] },
                { incoming: 'Yes, we are fully insured up to $1,500 per garment for accidental fabric damage or shrinkage.', taskRu: 'Я сохранил оригинальный чек из бутика, подтверждающий стоимость пиджака в пятьсот долларов.', hintSkeleton: 'I kept the original boutique receipt confirming the blazer cost five hundred dollars.', variants: ['I kept the original boutique receipt confirming the blazer cost five hundred dollars.', 'I have the original store purchase receipt proving the jacket was $500.', 'I still possess the store invoice showing that this designer blazer cost 500 dollars.'] },
                { incoming: 'That documentation makes insurance claims very straightforward. Should I keep your wooden hanger?', taskRu: 'Да, пожалуйста, оставьте мой деревянный тремпель и тканевый чехол для костюма у себя.', hintSkeleton: 'Yes, please keep my wooden hanger and the breathable garment bag here.', variants: ['Yes, please keep my wooden hanger and the breathable garment bag here.', 'Yes, hold onto my custom wooden hanger and the fabric suit cover.', 'Please retain my cedar hanger and the protective garment bag with the jacket.'] },
                { incoming: 'Hanger and garment bag tagged with your order number. Do you have your original paper drop-off ticket?', taskRu: 'Вот мой оригинальный желтый квитанционный талон с номером 842.', hintSkeleton: 'Here is my original yellow claim ticket with number 842.', variants: ['Here is my original yellow claim ticket with number 842.', 'Here is the original yellow drop-off receipt, number 842.', 'I have the yellow pickup ticket right here, number eight four two.'] },
                { incoming: 'I am stamping the ticket with "RE-CLEAN / PRIORITY RUSH / THURSDAY 4 PM". Keep this receipt.', taskRu: 'Придет ли мне автоматическое SMS-сообщение на телефон, когда вещь пройдет контроль качества?', hintSkeleton: 'Will I receive an automated SMS text notification when the item passes quality control?', variants: ['Will I receive an automated SMS text notification when the item passes quality control?', 'Do you send an automated text message once the garment is inspected and bagged?', 'Will an SMS confirmation be sent to my mobile as soon as the blazer is ready?'] },
                { incoming: 'Yes, you will get a text message with a barcode for quick locker or counter pickup.', taskRu: 'Мой актуальный номер мобильного телефона сохранен в вашей базе данных клиентов?', hintSkeleton: 'Is my current mobile phone number saved in your customer database?', variants: ['Is my current mobile phone number saved in your customer database?', 'Do you have my up-to-date cell phone number on file in your system?', 'Is my active mobile number correctly registered in your client profile?'] },
                { incoming: 'Ending in 4912, correct? Everything is up to date. Can someone else collect it for you?', taskRu: 'Да, может ли моя коллега забрать пиджак вместо меня, если я перешлю ей фото квитанции?', hintSkeleton: 'Yes, can my colleague collect the blazer on my behalf if I forward her a photo of the ticket?', variants: ['Yes, can my colleague collect the blazer on my behalf if I forward her a photo of the ticket?', 'Can someone else pick it up for me if they show a picture of the claim slip on their phone?', 'Is it permissible for a coworker to pick up the item if she presents the digital receipt?'] },
                { incoming: 'A digital photo of the yellow ticket or forwarding the SMS barcode is completely valid for collection.', taskRu: 'Это очень выручит меня, если я задержусь на деловой встрече в четверг.', hintSkeleton: 'That will really help me out if I get held up at a business meeting on Thursday.', variants: ['That will really help me out if I get held up at a business meeting on Thursday.', 'That will be a lifesaver if my work meetings run late on Thursday afternoon.', 'That is very convenient in case I am delayed at a corporate conference on Thursday.'] },
                { incoming: 'We stay open until 7:30 pm on Thursdays, so you have plenty of time regardless.', taskRu: 'Спасибо за вежливое отношение к претензии и клиентоориентированный сервис, Елена.', hintSkeleton: 'Thank you for handling the complaint politely and for your customer-focused service, Elena.', variants: ['Thank you for handling the complaint politely and for your customer-focused service, Elena.', 'Thanks for resolving this issue so professionally and politely, Elena.', 'I truly appreciate your polite attitude and prompt customer care regarding this issue, Elena.'] },
                { incoming: 'It is our duty to deliver perfection. See you or your colleague Thursday afternoon!', taskRu: 'Договорились. До встречи в четверг, хорошей вам рабочей недели!', hintSkeleton: 'Deal. See you on Thursday, have a great work week ahead!', variants: ['Deal. See you on Thursday, have a great work week ahead!', 'It is a deal. See you Thursday, have a productive rest of the week!', 'Understood. Talk to you on Thursday, have a wonderful week Elena!'] }
            ]},
            { id: 16, avatar: '📦', title: '17. 📦 Доставка посылки', desc: 'Пропущенная доставка, постамат 7-Eleven, таможенные сборы и осмотр коробки', name: 'Carlos (Courier)', steps: [
                { incoming: 'Hi, I have a package from Amazon for you, but nobody is answering the buzzer at building 12.', taskRu: 'Я сейчас на работе. Можете ли вы оставить посылку у двери соседа в квартире 4?', hintSkeleton: 'I am at work right now. Could you leave the package by the door of apartment 4?', variants: ['I am at work right now. Could you leave the package at my neighbor\'s door in apartment 4?', 'I\'m at work right now. Can you leave the package by the door of flat 4?', 'I am currently at work. Could you please leave it outside apartment 4?'], exp: 'Leave the package by the door = оставить у двери.' },
                { incoming: 'Company policy requires an adult signature for this high-value electronics item. I cannot leave it unattended.', taskRu: 'Да, пожалуйста, доставьте завтра после 10 утра, я буду дома весь день.', hintSkeleton: 'Yes, please deliver it tomorrow after 10 am, I will be home all day.', variants: ['Yes please deliver it tomorrow after 10 am, I will be home all day.', 'Yes, please attempt delivery tomorrow after ten am, I\'ll be home all day.', 'That works. Please bring it tomorrow after 10 am, I will be home.'], exp: 'Deliver tomorrow after 10 am + will be home.' },
                { incoming: 'Tomorrow my route covers your sector only between 8 am and 10 am. Will you be home by 9 am?', taskRu: 'К сожалению, в девять утра я еще буду в дороге. Есть ли другие варианты вручения?', hintSkeleton: 'Unfortunately, at nine am I will still be commuting. Are there other delivery options?', variants: ['Unfortunately, at nine am I will still be commuting. Are there other delivery options?', 'Sadly I\'ll still be on my way home at 9 am. What other delivery alternatives exist?', 'Unfortunately I won\'t be back by 9 am. Is there another way we can arrange handover?'] },
                { incoming: 'Can someone else inside your building sign for the parcel if they are over 21 years old?', taskRu: 'Моя пожилая соседка из четвертой квартиры сейчас дома, она может расписаться за меня.', hintSkeleton: 'My elderly neighbor from apartment four is home right now, she can sign for me.', variants: ['My elderly neighbor from apartment four is home right now, she can sign for me.', 'My neighbor in flat 4 is home right now and willing to provide a signature on my behalf.', 'The resident in apartment 4 is home at the moment and can accept the delivery for me.'] },
                { incoming: 'I need written authorization in the delivery app before I can hand it to a third party.', taskRu: 'Я только что добавил ее полное имя в качестве доверенного получателя в мобильном приложении.', hintSkeleton: 'I have just added her full name as an authorized recipient in the mobile app.', variants: ['I have just added her full name as an authorized recipient in the mobile app.', 'I just designated her as an authorized alternative receiver on the delivery portal.', 'Done, I updated the delivery instructions in the app with her full name and flat number.'] },
                { incoming: 'Her name shows up as Mrs. Martha Gable. Let me ring apartment 4 on the intercom...', taskRu: 'Пожалуйста, подождите минуту, она пожилой человек и медленно подходит к двери.', hintSkeleton: 'Please wait a minute, she is an elderly person and walks slowly to the door.', variants: ['Please wait a minute, she is an elderly person and walks slowly to the door.', 'Give her sixty seconds please, she takes a little time to reach the front door.', 'Please hold on a moment, she is quite elderly and walks to the hallway slowly.'] },
