<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Оксфордский словарь 10k</title>
    
    <!-- Подключение единой дизайн-системы и Telegram SDK -->
    <link rel="stylesheet" href="theme.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="tma-bridge.js"></script>

    <style>
        /* Специфические стили словаря и поискового интерфейса */
        body {
            height: auto;
            min-height: 100vh;
            overflow-y: auto;
            user-select: auto; /* Разрешаем выделение текста в словаре */
        }

        .header-wrap {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            background: rgba(11, 15, 25, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: calc(var(--sa-t) + 10px) calc(var(--sa-r) + 12px) 10px calc(var(--sa-l) + 12px);
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .search-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .search-input {
            flex: 1;
            min-width: 0;
            background: #1e293b;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 16px; /* Защита от авто-зума на iOS */
            outline: none;
        }
        .search-input:focus { border-color: var(--primary); }

        .btn-toggle {
            background: #1e293b;
            border: 1px solid var(--card-border);
            color: #cbd5e1;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }
        .btn-toggle.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .chips-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 2px;
            width: 100%;
        }
        .chips-scroll::-webkit-scrollbar { display: none; }

        .chip {
            padding: 6px 12px;
            background: #172136;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .chip.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .stats-text {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            padding: 0 2px;
        }

        .list-container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 12px 12px calc(80px + var(--sa-b)) 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dict-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            word-break: break-word;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 6px;
        }

        .en-tokens {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            line-height: 1.3;
        }

        .badge {
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .b-A1, .b-A2 { background: var(--pos-bg); color: var(--pos); border: 1px solid var(--pos); }
        .b-B1 { background: var(--que-bg); color: var(--que); border: 1px solid var(--que); }
        .b-B2 { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold); }
        .b-C1 { background: var(--rose-bg); color: var(--rose); border: 1px solid var(--rose); }
        .b-C2 { background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple); }

        .ru-trans {
            font-size: 13.5px;
            font-weight: 600;
            color: #cbd5e1;
            line-height: 1.3;
        }
        .ru-trans.blur, .ex-ru.blur {
            filter: blur(5px);
            user-select: none;
        }

        .load-more-btn {
            background: #1e293b;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            margin-top: 10px;
        }

        /* Баннер пэйволла внутри списка */
        .paywall-list-card {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(217, 119, 6, 0.05) 100%);
            border: 1px dashed var(--gold);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header-wrap">
        <div class="search-row">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по eng или рус...">
            <button class="btn-toggle" id="blurBtn" onclick="toggleBlur()">👁️ Скрыть</button>
        </div>

        <div class="chips-scroll">
            <div class="chip active" onclick="setFilter('all', this)">Все</div>
            <div class="chip" onclick="setFilter('verbs', this)">⚡ Глаголы (3 формы)</div>
            <div class="chip" onclick="setFilter('A1', this)">A1 База</div>
            <div class="chip" onclick="setFilter('A2', this)">A2 Фундамент</div>
            <div class="chip" onclick="setFilter('B1', this)">B1 Разговорный</div>
            <div class="chip" onclick="setFilter('B2', this)">B2 Продвинутый</div>
            <div class="chip" onclick="setFilter('C1', this)">C1 Свободный</div>
            <div class="chip" onclick="setFilter('C2', this)">C2 Академик</div>
            <div class="chip" onclick="setFilter('phrasal', this)">🧩 Фразовые</div>
            <div class="chip" onclick="setFilter('idioms', this)">🎯 Идиомы</div>
        </div>

        <div class="stats-text">
            <span id="statCount">Загрузка...</span>
            <span>Тап на слово = озвучка</span>
        </div>
    </div>

    <div class="list-container" id="list"></div>

        // =========================================================================
        // КОНЕЦ БЛОКА ВСТАВКИ
        // =========================================================================

        // ДВИЖОК ПРИЛОЖЕНИЯ
        const DEMO_LIMIT = 10; // Бесплатный лимит слов в демо-версии
        const BATCH_SIZE = 50;

        function speakWord(cleanWord, el) {
            if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');

            document.querySelectorAll('.word').forEach(w => w.classList.remove('speaking'));
            if (el) el.classList.add('speaking');

            if (typeof TMABridge !== 'undefined' && TMABridge.speak) {
                TMABridge.speak(cleanWord, 0.86, () => {
                    if (el) el.classList.remove('speaking');
                });
            }
        }

        function speakPhrase(phrase) {
            if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
            if (typeof TMABridge !== 'undefined' && TMABridge.speak) {
                TMABridge.speak(phrase, 0.9);
            }
        }

        let database = [];
        let filteredData = [];
        let currentFilter = 'all';
        let isBlurred = false;
        let renderedCount = 0;

        function parseDatabase() {
            const lines = RAW_DICTIONARY_TEXT.trim().split('\n');
            database = [];
            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('//') || trimmed.startsWith('/*')) return;
                const parts = trimmed.split('|');
                if (parts.length >= 6) {
                    database.push({
                        term: parts[0].trim(),
                        ru: parts[1].trim(),
                        level: parts[2].trim(),
                        cat: parts[3].trim(),
                        ex: parts[4].trim(),
                        exRu: parts[5].trim()
                    });
                }
            });
        }

        function parseTokens(str) {
            return str.split(' ').map(token => {
                if (token === '>') return '<span style="color: var(--text-muted); font-size: 12px;">→</span>';
                const clean = token.replace(/[^a-zA-Z'-]/g, '');
                return `<span class="word" onclick="event.stopPropagation(); speakWord('${clean}', this)">${token}</span>`;
            }).join(' ');
        }

        function filterDataset() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            filteredData = database.filter(item => {
                let passFilter = false;
                if (currentFilter === 'all') passFilter = true;
                else if (currentFilter === 'verbs') passFilter = (item.cat === 'verbs');
                else if (currentFilter === 'phrasal') passFilter = (item.cat === 'phrasal');
                else if (currentFilter === 'idioms') passFilter = (item.cat === 'idioms');
                else if (currentFilter === item.level) passFilter = true;

                if (!passFilter) return false;
                if (!query) return true;

                return item.term.toLowerCase().includes(query) || 
                       item.ru.toLowerCase().includes(query) || 
                       item.ex.toLowerCase().includes(query);
            });

            const isPrem = typeof TMABridge !== 'undefined' && TMABridge.isPremiumUser();
            const visibleTotal = isPrem ? filteredData.length : Math.min(filteredData.length, DEMO_LIMIT);

            document.getElementById('statCount').innerText = isPrem
                ? `Слов: ${filteredData.length}`
                : `Слов: ${visibleTotal} из ${database.length} (Демо)`;

            renderedCount = 0;
            document.getElementById('list').innerHTML = '';
            renderBatch();
        }

        function renderBatch() {
            const list = document.getElementById('list');
            const isPrem = typeof TMABridge !== 'undefined' && TMABridge.isPremiumUser();

            // Freemium Guard: ограничиваем вывод 15 словами для бесплатных пользователей
            let maxAvailable = filteredData.length;
            if (!isPrem) {
                maxAvailable = Math.min(filteredData.length, DEMO_LIMIT);
            }

            const end = Math.min(renderedCount + BATCH_SIZE, maxAvailable);

            const oldBtn = document.getElementById('loadMoreBtn');
            if (oldBtn) oldBtn.remove();
            const oldPaywall = document.getElementById('dictPaywallCard');
            if (oldPaywall) oldPaywall.remove();

            for (let i = renderedCount; i < end; i++) {
                const item = filteredData[i];
                const card = document.createElement('div');
                card.className = 'dict-card';

                const blurClass = isBlurred ? 'blur' : '';

                card.innerHTML = `
                    <div class="card-header-row">
                        <div class="en-tokens">${parseTokens(item.term)}</div>
                        <span class="badge b-${item.level}">${item.level}</span>
                    </div>
                    <div class="ru-trans ${blurClass}">${item.ru}</div>
                    <div class="example-box">
                        <button class="audio-btn" onclick="event.stopPropagation(); speakPhrase('${item.ex.replace(/'/g, "")}')">🔊</button>
                        <div style="flex: 1; min-width: 0;">
                            <div class="en-phrase">${parseTokens(item.ex)}</div>
                            <div class="ex-ru ${blurClass}" style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">${item.exRu}</div>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    card.querySelectorAll('.ru-trans, .ex-ru').forEach(el => el.classList.toggle('blur'));
                });

                list.appendChild(card);
            }

            renderedCount = end;

            // Если пользователь на демо и достиг лимита в 15 слов — показываем карточку блокировки
            if (!isPrem && renderedCount >= DEMO_LIMIT && filteredData.length > DEMO_LIMIT) {
                const paywallCard = document.createElement('div');
                paywallCard.id = 'dictPaywallCard';
                paywallCard.className = 'paywall-list-card';
                paywallCard.innerHTML = `
                    <div style="font-size: 2rem;">🔒</div>
                    <div style="font-size: 1.1rem; font-weight: 800; color: #fff;">Ознакомительный лимит исчерпан</div>
                    <div style="font-size: 0.85rem; color: var(--text-muted); max-width: 320px;">
                        Вам доступны первые 10 слов. Разблокируйте всю базу слов, идиом и глаголов навсегда.
                    </div>
                    <button class="paywall-btn" style="margin-top: 6px;" onclick="TMABridge.showPaywall()">
                        Разблокировать словарь за ⭐️ Stars
                    </button>
                `;
                list.appendChild(paywallCard);
                return;
            }

            // Кнопка пагинации (для премиум-пользователей)
            if (renderedCount < filteredData.length) {
                const loadBtn = document.createElement('div');
                loadBtn.id = 'loadMoreBtn';
                loadBtn.className = 'load-more-btn';
                loadBtn.innerText = `Показать еще (${filteredData.length - renderedCount})`;
                loadBtn.onclick = () => {
                    if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
                    renderBatch();
                };
                list.appendChild(loadBtn);
            }
        }

        function setFilter(f, el) {
            if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
            currentFilter = f;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            filterDataset();
        }

        function toggleBlur() {
            if (typeof TMABridge !== 'undefined') TMABridge.haptic('light');
            isBlurred = !isBlurred;
            const btn = document.getElementById('blurBtn');
            btn.classList.toggle('active', isBlurred);
            btn.innerText = isBlurred ? '🙈 Скрыто' : '👁️ Скрыть';
            document.querySelectorAll('.ru-trans, .ex-ru').forEach(el => {
                if (isBlurred) el.classList.add('blur');
                else el.classList.remove('blur');
            });
        }

        document.getElementById('searchInput').addEventListener('input', filterDataset);

        document.addEventListener('DOMContentLoaded', () => {
            parseDatabase();
            filterDataset();

            if (typeof TMABridge !== 'undefined') {
                TMABridge.setupBackButton('index.html');
            }
        });
    </script>
